function startTopicQuiz(catKey){
  const c = CAT[catKey];
  const qs = shuffle(QUESTIONS.filter(q=>q.category===catKey));
  state.view="quiz"; state.quizKey=catKey; state.quizTitle=c.label;
  state.questions=qs; state.index=0; state.answers=[]; state.locked=false; state.selectedSata=new Set();
  renderTopicPills(); renderRail();
  renderQuestion();
}
function startFullTest(n){
  const qs = buildFullTest(n);
  state.view="quiz"; state.quizKey="full-"+n; state.quizTitle="Full Length Test "+n;
  state.questions=qs; state.index=0; state.answers=[]; state.locked=false; state.selectedSata=new Set();
  state.testProgress[n] = {status:"progress"};
  renderTopicPills(); renderRail();
  renderQuestion();
}

function renderQuestion(){
  if(state.index >= state.questions.length){ return showResults(); }
  if(state.index>0 && state.index % 10 === 0 && !state._recapShown){
    state._recapShown = true;
    return renderRecap();
  }
  state._recapShown = false;
  state.locked = false; state.selectedSata = new Set();
  const q = state.questions[state.index];
  const c = CAT[q.category];
  const pct = Math.round((state.index/state.questions.length)*100);
  const isSata = q.type==="sata";
  document.getElementById("main").innerHTML = `
    <div class="quiz-header">
      <span class="quiz-title">${state.quizTitle}</span>
      <span class="quiz-title">Question ${state.index+1} of ${state.questions.length}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="cat-tag" style="background:${c.color}">${c.label} · ${q.subtopic}</span>
    <p class="stem">${q.stem}</p>
    ${isSata ? `<div class="sata-note">SELECT ALL THAT APPLY</div>`:""}
    <div class="options" id="optionsWrap">
      ${q.options.map(o=>`
        <button class="opt ${isSata?"sata selectable":""}" data-key="${o.k}" onclick="${isSata?`toggleSata('${o.k}')`:`answerSingle('${o.k}')`}">
          <span class="key">${o.k}</span><span>${o.t}</span>
        </button>`).join("")}
    </div>
    ${isSata ? `<div class="submit-row"><button class="btn" onclick="submitSata()">Check Answer</button></div>` : ""}
    <div id="feedbackZone"></div>
  `;
}

function renderRecap(){
  state.view="recap";
  const last10 = state.answers.slice(-10);
  const items = last10.map((a,i)=>`
    <div class="recap-item"><span class="num mono">${i+1}</span>
      <span><b>${a.subtopic}</b> — ${a.concept}</span>
    </div>`).join("");
  const correctCount = last10.filter(a=>a.correctFlag).length;
  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="recap-icon">⚡</div>
      <h2 style="margin:0 0 4px;">Quick Check — last 10 questions</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 4px;">You got ${correctCount} of ${last10.length} correct. Key concepts just covered:</p>
      <div class="recap-list">${items}</div>
      <button class="btn" onclick="continueAfterRecap()">Continue</button>
    </div>
  `;
}
function continueAfterRecap(){
  state.view="quiz";
  renderQuestion();
}

function answerSingle(key){
  if(state.locked) return;
  state.locked = true;
  const q = state.questions[state.index];
  const correctFlag = key === q.correct;
  recordAnswer(q, correctFlag);
  document.querySelectorAll("#optionsWrap .opt").forEach(btn=>{
    btn.classList.add("locked");
    const k = btn.getAttribute("data-key");
    if(k === q.correct) btn.classList.add("correct");
    else if(k === key) btn.classList.add("incorrect");
  });
  renderFeedback(q, correctFlag, key);
}
function toggleSata(key){
  if(state.locked) return;
  const btn = document.querySelector(`#optionsWrap .opt[data-key="${key}"]`);
  if(state.selectedSata.has(key)){ state.selectedSata.delete(key); btn.classList.remove("chosen"); }
  else { state.selectedSata.add(key); btn.classList.add("chosen"); }
}
function submitSata(){
  if(state.locked) return;
  if(state.selectedSata.size===0) return;
  state.locked = true;
  const q = state.questions[state.index];
  const chosen = Array.from(state.selectedSata).sort();
  const correctSet = q.correct.slice().sort();
  const correctFlag = JSON.stringify(chosen)===JSON.stringify(correctSet);
  recordAnswer(q, correctFlag);
  document.querySelectorAll("#optionsWrap .opt").forEach(btn=>{
    btn.classList.add("locked");
    const k = btn.getAttribute("data-key");
    const isCorrectKey = q.correct.includes(k);
    const wasChosen = chosen.includes(k);
    if(isCorrectKey && wasChosen) btn.classList.add("correct");
    else if(isCorrectKey && !wasChosen) btn.classList.add("missed");
    else if(!isCorrectKey && wasChosen) btn.classList.add("incorrect");
  });
  renderFeedback(q, correctFlag, chosen.join(", "));
}

function recordAnswer(q, correctFlag){
  state.answers.push({qId:q.id, correctFlag, subtopic:q.subtopic, concept:q.explain.concept});
  state.sessionTotal++; if(correctFlag) state.sessionCorrect++;
  renderSessionScore();
}

function renderFeedback(q, correctFlag, chosenLabel){
  const wrongList = Object.entries(q.explain.wrong||{}).map(([k,txt])=>
    `<div class="why-wrong-item"><b>${k}</b>${txt}</div>`).join("");
  const isLast = state.index === state.questions.length-1;
  const html = `
    <div class="feedback-banner ${correctFlag?"good":"bad"}">
      <span class="stamp">${correctFlag?"✓ CORRECT":"✗ INCORRECT"}</span>
      <span>${correctFlag? "Nice — that's the concept locked in." : "Let's break down what was missed."}</span>
    </div>
    <div class="explain">
      <div class="explain-block">
        <h4>Concept tested</h4>
        <div style="font-size:13.5px;">${q.explain.concept}</div>
      </div>
      <div class="explain-block">
        <h4>Why the correct answer is right</h4>
        <ul class="bullets">${q.explain.why.map(w=>`<li>${w}</li>`).join("")}</ul>
      </div>
      ${wrongList ? `<div class="explain-block"><h4>Why the other options are wrong</h4>${wrongList}</div>` : ""}
      <div class="explain-block">
        <div class="quickcheck"><span class="lightning">⚡</span><span>${q.explain.quick}</span></div>
      </div>
    </div>
    <div class="nav-row">
      <button class="btn secondary" onclick="goHome()">Exit to dashboard</button>
      <button class="btn" onclick="nextQuestion()">${isLast? "See results →" : "Next question →"}</button>
    </div>
  `;
  document.getElementById("feedbackZone").innerHTML = html;
}

function nextQuestion(){
  state.index++;
  renderQuestion();
}

function showResults(){
  state.view="results";
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.correctFlag).length;
  const pct = total ? Math.round((correct/total)*100) : 0;

  if(state.quizKey && state.quizKey.startsWith("full-")){
    const n = parseInt(state.quizKey.split("-")[1]);
    state.testProgress[n] = {status:"done", score:pct};
    renderRail();
  }

  const byCat = {};
  state.questions.forEach((q,i)=>{
    byCat[q.category] = byCat[q.category] || {correct:0,total:0};
    byCat[q.category].total++;
    if(state.answers[i] && state.answers[i].correctFlag) byCat[q.category].correct++;
  });
  const catRows = Object.entries(byCat).map(([key,v])=>{
    const c = CAT[key];
    const p = Math.round((v.correct/v.total)*100);
    return `<div class="weight-row">
      <div class="weight-label">${c.label}</div>
      <div class="weight-bar-track"><div class="weight-bar-fill" style="width:${p}%;background:${c.color}"></div></div>
      <div class="weight-pct mono">${p}%</div>
      <div class="weight-cov mono">${v.correct}/${v.total}</div>
    </div>`;
  }).join("");

  const missed = state.questions
    .map((q,i)=>({q,a:state.answers[i]}))
    .filter(x=>x.a && !x.a.correctFlag);

  const missedHtml = missed.length ? missed.map(({q})=>`
    <details class="missed-item">
      <summary><span>${q.subtopic} — ${q.explain.concept}</span><span class="arrow">›</span></summary>
      <p class="stem" style="font-size:14px;">${q.stem}</p>
      <ul class="bullets">${q.explain.why.map(w=>`<li>${w}</li>`).join("")}</ul>
      <div class="quickcheck"><span class="lightning">⚡</span><span>${q.explain.quick}</span></div>
    </details>
  `).join("") : `<p style="color:var(--ink-soft);font-size:13.5px;">No missed questions — clean sweep.</p>`;

  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="score-hero"><span class="score-big" style="color:${pct>=75?'var(--correct)':pct>=60?'var(--gold)':'var(--incorrect)'}">${pct}%</span><span class="score-sub">${correct} of ${total} correct — ${state.quizTitle}</span></div>
      <div id="saveStatus"><span class="save-status off">Saving...</span></div>
      <div class="cta-row">
        <button class="btn" onclick="state.quizKey && state.quizKey.startsWith('full-') ? startFullTest(parseInt(state.quizKey.split('-')[1])) : startTopicQuiz(state.quizKey)">Retake</button>
        <button class="btn secondary" onclick="goHome()">Back to dashboard</button>
      </div>
    </div>
    <div class="card">
      <h3>Score by category</h3>
      ${catRows}
    </div>
    <div class="card">
      <h3>Review missed questions (${missed.length})</h3>
      ${missedHtml}
    </div>
  `;

  const missedSummary = missed.map(({q})=>({subtopic:q.subtopic, concept:q.explain.concept}));
  const record = {
    student_name: state.studentName && state.studentName.trim() ? state.studentName.trim() : "Guest",
    quiz_type: state.quizKey && state.quizKey.startsWith("full-") ? "full" : "topic",
    quiz_title: state.quizTitle,
    category_key: state.quizKey && !state.quizKey.startsWith("full-") ? state.quizKey : null,
    test_number: state.quizKey && state.quizKey.startsWith("full-") ? parseInt(state.quizKey.split("-")[1]) : null,
    score_pct: pct,
    correct_count: correct,
    total_count: total,
    category_breakdown: byCat,
    missed_concepts: missedSummary
  };
  saveResultToSupabase(record);
}

/* ---------- Init ---------- */
document.getElementById("brandHome").addEventListener("click", goHome);
document.getElementById("brandHome").addEventListener("keydown", e=>{ if(e.key==="Enter") goHome(); });
document.getElementById("authForm").addEventListener("submit", handleAuthSubmit);
document.getElementById("authCloseBtn").addEventListener("click", closeAuthModal);
document.getElementById("authOverlay").addEventListener("click", e=>{ if(e.target.id==="authOverlay") closeAuthModal(); });

async function boot(){
  document.getElementById("main").innerHTML = `<div class="card"><h3>Loading question bank…</h3></div>`;
  QUESTIONS = await loadQuestionBank();
  renderTopicPills();
  renderRail();
  await initAuth();
  goHome();
}
boot();
</script>
</body>
</html>
