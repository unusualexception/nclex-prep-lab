/* ============================= SAFETY & INFECTION CONTROL ============================= */
{id:"SIC-1",category:"sic",type:"single",subtopic:"Airborne precautions",
 stem:"A client is admitted with suspected active pulmonary tuberculosis. Which precaution should the RN implement?",
 options:[{k:"A",t:"Standard precautions only"},
          {k:"B",t:"Droplet precautions with a surgical mask"},
          {k:"C",t:"Airborne precautions with an N95 respirator and negative-pressure room"},
          {k:"D",t:"Contact precautions with gown and gloves"}],
 correct:"C",
 explain:{concept:"Transmission-based precautions — Airborne",
   why:["TB is spread via small airborne droplet nuclei that remain suspended in air; it requires a negative-pressure room and a fit-tested N95 (or higher) respirator."],
   wrong:{A:"Insufficient — standard precautions alone do not prevent airborne transmission.",
          B:"A surgical mask does not filter the small particle size of airborne organisms.",
          D:"Contact precautions address organisms spread by touch, not by air."},
   quick:"Airborne = TB, Measles, Varicella (chickenpox) → think 'My Chest Tightens' — N95 + negative pressure room."}},

{id:"SIC-2",category:"sic",type:"single",subtopic:"Contact precautions",
 stem:"A client has a confirmed Clostridioides difficile (C. diff) infection. Which infection control measure is essential?",
 options:[{k:"A",t:"Alcohol-based hand sanitizer before and after care"},
          {k:"B",t:"Soap-and-water hand washing plus contact precautions (gown and gloves)"},
          {k:"C",t:"Droplet precautions with a surgical mask"},
          {k:"D",t:"Standard precautions are sufficient"},],
 correct:"B",
 explain:{concept:"Contact precautions — C. diff spores",
   why:["C. diff forms spores that are NOT killed by alcohol-based hand sanitizer; only mechanical washing with soap and water removes them.",
        "Contact precautions (gown/gloves) prevent spread via hands and surfaces."],
   wrong:{A:"Alcohol-based sanitizer does not kill C. diff spores — this is a classic NCLEX trap.",
          C:"C. diff is spread by contact, not respiratory droplets.",
          D:"Standard precautions alone are inadequate for a spore-forming, contact-spread organism."},
   quick:"C. diff spores survive alcohol gel — always wash with soap and water, and gown/glove for every entry into the room."}},

{id:"SIC-3",category:"sic",type:"single",subtopic:"Droplet precautions",
 stem:"A client is diagnosed with influenza. Which precaution is appropriate?",
 options:[{k:"A",t:"Airborne precautions with N95 respirator"},
          {k:"B",t:"Droplet precautions with a surgical mask within 3 feet of the client"},
          {k:"C",t:"No additional precautions beyond hand hygiene"},
          {k:"D",t:"Protective (reverse) isolation"}],
 correct:"B",
 explain:{concept:"Droplet precautions",
   why:["Influenza spreads via large respiratory droplets that travel a short distance (about 3 feet) — a surgical mask is sufficient protection."],
   wrong:{A:"An N95 and negative pressure room are unnecessary for droplet-spread organisms.",
          C:"Additional precautions beyond hand hygiene are required to prevent droplet spread.",
          D:"Protective isolation protects an immunocompromised client from others, not the reverse."},
   quick:"Droplet = Influenza, Mumps, Rubella, Pertussis → think 'SPIDERMAN' mnemonic. Surgical mask, private room or 3-ft spatial separation."}},

{id:"SIC-4",category:"sic",type:"single",subtopic:"Fall prevention",
 stem:"An older adult client is identified as high risk for falls. Which intervention should the RN implement first?",
 options:[{k:"A",t:"Apply a vest restraint to keep the client in bed"},
          {k:"B",t:"Place the bed in the lowest position with the bed alarm activated and non-skid footwear"},
          {k:"C",t:"Request a sitter to stay with the client continuously"},
          {k:"D",t:"Administer a sedative at bedtime"}],
 correct:"B",
 explain:{concept:"Fall prevention — least restrictive measures first",
   why:["Non-restrictive environmental safety measures (low bed, alarm, non-skid footwear) are the first-line, least restrictive interventions for fall risk."],
   wrong:{A:"Restraints are a last resort, used only after less restrictive measures fail and require a provider order.",
          C:"A continuous sitter may be appropriate but is a resource-intensive step beyond first-line measures.",
          D:"Sedatives increase fall risk by causing drowsiness and impaired balance."},
   quick:"Always start with the LEAST restrictive intervention. Restraints require a time-limited provider order and are never a first choice."}},

{id:"SIC-5",category:"sic",type:"single",subtopic:"Restraint use",
 stem:"Which statement about the use of physical restraints is accurate?",
 options:[{k:"A",t:"A PRN restraint order can be used whenever the nurse judges it necessary"},
          {k:"B",t:"Restraints require a time-limited provider order and must be reassessed per facility policy (commonly every 2 hours)"},
          {k:"C",t:"Restraints may be applied without a provider order in a true emergency and never require follow-up documentation"},
          {k:"D",t:"Once applied, a restraint order does not need to be renewed"}],
 correct:"B",
 explain:{concept:"Legal/ethical use of restraints",
   why:["Restraints require a specific, time-limited provider order (never PRN), least-restrictive-alternative justification, and frequent reassessment/documentation of the continued need, circulation, and skin integrity."],
   wrong:{A:"PRN restraint orders are not permitted — each episode requires a new, specific order.",
          C:"Even emergency application requires a provider order within a defined time frame (often within 1 hour) and full documentation.",
          D:"Restraint orders expire and must be renewed per facility policy/regulation."},
   quick:"Restraints = last resort, least restrictive first, time-limited order, frequent reassessment (~q2h), and thorough documentation every time."}},

{id:"SIC-6",category:"sic",type:"single",subtopic:"Fire safety — RACE",
 stem:"A fire breaks out in a supply room down the hall from an occupied client room. Using the RACE mnemonic, what is the nurse's first action?",
 options:[{k:"A",t:"Extinguish the fire with a fire extinguisher"},
          {k:"B",t:"Rescue/remove clients in immediate danger"},
          {k:"C",t:"Activate the fire alarm"},
          {k:"D",t:"Confine the fire by closing doors"}],
 correct:"B",
 explain:{concept:"Fire safety — RACE sequence",
   why:["RACE stands for Rescue, Alarm, Confine, Extinguish/Evacuate — rescuing anyone in immediate danger always comes first."],
   wrong:{A:"Extinguishing is the last step, attempted only if the fire is small and contained.",
          C:"Activating the alarm is the second step, after ensuring immediate client safety.",
          D:"Confining the fire (closing doors) happens after rescue and alarm activation."},
   quick:"RACE = Rescue → Alarm → Confine → Extinguish/Evacuate. Always rescue first."}},

{id:"SIC-7",category:"sic",type:"single",subtopic:"Rights of medication administration",
 stem:"Before administering a scheduled medication, the RN verifies the client's identity using two identifiers. This action supports which of the 'rights' of medication administration?",
 options:[{k:"A",t:"Right documentation"},
          {k:"B",t:"Right client"},
          {k:"C",t:"Right route"},
          {k:"D",t:"Right time"}],
 correct:"B",
 explain:{concept:"Rights of medication administration",
   why:["Verifying identity with two identifiers (e.g., name and date of birth, checked against the MAR/armband) confirms the Right Client — the single most critical safety check to prevent wrong-client errors."]
   ,wrong:{A:"Documentation happens after administration, not during identity verification.",
          C:"Route refers to how the medication is given (PO, IV, etc.), not who receives it.",
          D:"Timing refers to when the dose is due, not client identity."},
   quick:"The Rights: Client, Drug, Dose, Route, Time, Documentation, Reason — two-identifier checks always map to 'Right Client'."}},

{id:"SIC-8",category:"sic",type:"single",subtopic:"Needlestick injury",
 stem:"An RN sustains a needlestick injury after administering an injection to a client. What is the nurse's first action?",
 options:[{k:"A",t:"Report the injury to the supervisor before doing anything else"},
          {k:"B",t:"Wash the area immediately with soap and water"},
          {k:"C",t:"Apply a tourniquet above the injury site"},
          {k:"D",t:"Continue the medication pass and address it after the shift"}],
 correct:"B",
 explain:{concept:"Occupational exposure response",
   why:["Immediate washing with soap and water reduces the pathogen load at the exposure site and is the priority first step before reporting or further work-up."]
   ,wrong:{A:"Reporting is essential but occurs after the immediate first-aid step.",
          C:"A tourniquet is not indicated and does not reduce infection risk from a needlestick.",
          D:"Delaying care increases risk of transmission of bloodborne pathogens; this must be addressed immediately."},
   quick:"Needlestick sequence: Wash first → Report per facility protocol → Post-exposure evaluation and prophylaxis as indicated."}},

{id:"SIC-9",category:"sic",type:"sata",subtopic:"CLABSI prevention — SATA",
 stem:"Which nursing actions help prevent central line-associated bloodstream infection (CLABSI)? Select all that apply.",
 options:[{k:"A",t:"Perform hand hygiene immediately before and after accessing the line"},
          {k:"B",t:"Use chlorhexidine-based antiseptic for site care"},
          {k:"C",t:"Change the dressing using sterile technique per protocol"},
          {k:"D",t:"Assess daily whether the central line is still necessary"},
          {k:"E",t:"Apply antibiotic ointment to the insertion site routinely"},
          {k:"F",t:"Leave the dressing in place indefinitely unless visibly soiled"}],
 correct:["A","B","C","D"],
 explain:{concept:"CLABSI bundle",
   why:["Hand hygiene, chlorhexidine skin antisepsis, sterile dressing technique, and daily review of line necessity are core elements of the evidence-based CLABSI prevention bundle."],
   wrong:{E:"Routine prophylactic antibiotic ointment is not recommended — it promotes resistance and fungal colonization.",
          F:"Dressings are changed on a defined schedule, not left indefinitely, to prevent bacterial growth under the dressing."},
   quick:"CLABSI bundle = Hand hygiene + chlorhexidine prep + sterile dressing changes + daily 'does this line still need to be here?' review."}},

{id:"SIC-10",category:"sic",type:"single",subtopic:"Home fall-prevention teaching",
 stem:"The RN is teaching an older adult client about fall prevention at home. Which statement by the client indicates a need for further teaching?",
 options:[{k:"A",t:"'I will remove the throw rugs in my hallway.'"},
          {k:"B",t:"'I'll keep a nightlight on in the bathroom.'"},
          {k:"C",t:"'I'll wear my loose bedroom slippers when walking around the house.'"},
          {k:"D",t:"'I'll install grab bars near the toilet and shower.'"}],
 correct:"C",
 explain:{concept:"Fall prevention teaching — evaluating understanding",
   why:["Loose-fitting slippers increase tripping risk; well-fitted, non-skid footwear is recommended instead."],
   wrong:{A:"Removing throw rugs correctly reduces a major tripping hazard.",
          B:"Adequate lighting, including nightlights, correctly reduces fall risk.",
          D:"Grab bars are a correct, evidence-based fall-prevention measure."},
   quick:"When a teaching question asks which statement needs 'further teaching,' you're looking for the INCORRECT client statement — read carefully."}},

/* ============================= HEALTH PROMOTION & MAINTENANCE ============================= */
{id:"HPM-1",category:"hpm",type:"single",subtopic:"Erikson — toddler stage",
 stem:"A mother reports that her 2-year-old frequently says 'no' and insists on doing things independently, such as feeding self. How should the RN interpret this behavior?",
 options:[{k:"A",t:"A sign of a behavioral disorder requiring evaluation"},
          {k:"B",t:"Normal development consistent with Erikson's autonomy vs. shame/doubt stage"},
          {k:"C",t:"A sign of insecure attachment"},
          {k:"D",t:"An indication the child needs stricter discipline"}],
 correct:"B",
 explain:{concept:"Erikson's psychosocial stages — toddlerhood",
   why:["Toddlers (1–3 years) are in the autonomy vs. shame/doubt stage; asserting independence and saying 'no' is expected, healthy development."],
   wrong:{A:"This is normal developmental behavior, not pathology.",
          C:"Attachment concerns present differently (e.g., lack of stranger anxiety or indifference to caregiver).",
          D:"Stricter discipline is not indicated for normal autonomy-seeking behavior."},
   quick:"Erikson quick map: Infant=Trust vs. Mistrust, Toddler=Autonomy vs. Shame/Doubt, Preschool=Initiative vs. Guilt, School-age=Industry vs. Inferiority, Adolescent=Identity vs. Role Confusion."}},

{id:"HPM-2",category:"hpm",type:"single",subtopic:"Infant milestones",
 stem:"Which finding would the RN expect during a well-child visit for a healthy 6-month-old infant?",
 options:[{k:"A",t:"Sits with support and transfers objects hand to hand"},
          {k:"B",t:"Walks independently"},
          {k:"C",t:"Uses a pincer grasp to pick up small objects"},
          {k:"D",t:"Speaks in two-word sentences"}],
 correct:"A",
 explain:{concept:"Infant growth & development milestones",
   why:["By 6 months, expected milestones include sitting with support, rolling both ways, and transferring objects hand to hand."],
   wrong:{B:"Independent walking is expected around 12–15 months.",
          C:"Pincer grasp typically develops around 9 months.",
          D:"Two-word sentences are expected around 18–24 months."},
   quick:"6 months ≈ sits with support + transfers objects. 9 months ≈ pincer grasp + crawls. 12 months ≈ first steps + first words."}},

{id:"HPM-3",category:"hpm",type:"single",subtopic:"Live vaccine contraindications",
 stem:"A nurse is reviewing immunization history before administering the MMR vaccine. Which client finding is a contraindication?",
 options:[{k:"A",t:"Mild upper respiratory infection with low-grade fever"},
          {k:"B",t:"Current pregnancy"},
          {k:"C",t:"History of a mild local reaction to a previous vaccine"},
          {k:"D",t:"Currently taking an oral antibiotic for otitis media"}],
 correct:"B",
 explain:{concept:"Live-virus vaccine contraindications",
   why:["MMR is a live attenuated vaccine and is contraindicated during pregnancy due to theoretical risk to the fetus; pregnancy should be avoided for at least 4 weeks after vaccination."],
   wrong:{A:"A mild illness without high fever is not a contraindication to vaccination.",
          C:"A prior mild local reaction is not a contraindication (a severe/anaphylactic reaction would be).",
          D:"Antibiotic therapy does not contraindicate MMR administration."},
   quick:"Live vaccines (MMR, varicella, intranasal flu) are avoided in pregnancy and in significantly immunocompromised clients."}},

{id:"HPM-4",category:"hpm",type:"single",subtopic:"Prenatal danger signs",
 stem:"A pregnant client at 32 weeks gestation calls the clinic reporting a severe headache, blurred vision, and swelling in her hands and face. What should the RN advise?",
 options:[{k:"A",t:"Take acetaminophen and rest; this is normal in the third trimester"},
          {k:"B",t:"Come to the office or emergency department immediately for evaluation"},
          {k:"C",t:"Increase fluid intake and monitor at home for 24 hours"},
          {k:"D",t:"Apply a cool compress and call back if symptoms worsen"}],
 correct:"B",
 explain:{concept:"Prenatal danger signs — preeclampsia",
   why:["Severe headache, visual disturbances, and facial/hand edema are classic warning signs of preeclampsia, a potentially life-threatening condition requiring immediate evaluation."],
   wrong:{A:"These symptoms are not normal and delaying care risks progression to eclampsia (seizures).",
          C:"Home monitoring delays necessary treatment for a potential obstetric emergency.",
          D:"Symptomatic treatment at home is unsafe given the risk of rapid progression."},
   quick:"Preeclampsia red flags: severe headache + visual changes + edema/rapid weight gain + elevated BP — always urgent, never 'wait and see.'"}},

{id:"HPM-5",category:"hpm",type:"single",subtopic:"Newborn safe sleep",
 stem:"The RN is teaching new parents about safe sleep practices for their newborn. Which instruction is correct?",
 options:[{k:"A",t:"Place the infant on their stomach to sleep to prevent aspiration"},
          {k:"B",t:"Place the infant on their back on a firm mattress with no loose bedding"},
          {k:"C",t:"Have the infant co-sleep in the parents' bed for the first 3 months"},
          {k:"D",t:"Use soft bumper pads and blankets to keep the infant warm"},],
 correct:"B",
 explain:{concept:"Safe sleep / SIDS prevention",
   why:["'Back to sleep' on a firm, flat surface with no soft bedding, pillows, or bumpers is the evidence-based recommendation to reduce the risk of SIDS."],
   wrong:{A:"Stomach sleeping increases SIDS risk and is not recommended.",
          C:"Bed-sharing increases suffocation/SIDS risk; room-sharing without bed-sharing is recommended instead.",
          D:"Soft bedding and bumper pads increase suffocation risk and should be avoided in the crib."},
   quick:"Safe sleep = Back, firm surface, own sleep space, nothing soft/loose in the crib ('Bare is Best')."}},

{id:"HPM-6",category:"hpm",type:"single",subtopic:"Adolescent health promotion",
 stem:"During a routine visit, the RN screens a 13-year-old for scoliosis. Which finding requires further evaluation?",
 options:[{k:"A",t:"Symmetric shoulder height when standing"},
          {k:"B",t:"Uneven shoulder or hip height, or a rib hump when bending forward"},
          {k:"C",t:"Equal leg length"},
          {k:"D",t:"Normal, symmetric gait"}],
 correct:"B",
 explain:{concept:"Adolescent screening — scoliosis",
   why:["Asymmetry of the shoulders, hips, or a rib hump on forward bending (Adam's forward bend test) suggests spinal curvature and warrants referral for imaging/orthopedic evaluation."],
   wrong:{A:"Symmetric findings are normal and reassuring.",
          C:"Equal leg length is a normal finding.",
          D:"A normal gait does not suggest scoliosis."},
   quick:"Scoliosis screening peaks during the adolescent growth spurt — Adam's forward bend test is the classic screening maneuver."}},

{id:"HPM-7",category:"hpm",type:"single",subtopic:"Older adult screening",
 stem:"Which health screening recommendation is appropriate for a 55-year-old client with no personal or family history of colorectal cancer?",
 options:[{k:"A",t:"Colorectal cancer screening should begin at age 45"},
          {k:"B",t:"Colorectal cancer screening is not needed until age 65"},
          {k:"C",t:"Screening is only necessary if the client is symptomatic"},
          {k:"D",t:"Screening is only recommended for clients with a family history"}],
 correct:"A",
 explain:{concept:"Health maintenance screening guidelines",
   why:["Current guidelines recommend average-risk adults begin colorectal cancer screening at age 45; a 55-year-old average-risk client should already be engaged in screening."],
   wrong:{B:"Waiting until 65 delays screening well past the recommended start age.",
          C:"Screening is meant to detect disease before symptoms develop — that is the entire point of screening.",
          D:"Average-risk individuals without family history still need screening starting at 45."},
   quick:"Health promotion = catching disease BEFORE symptoms. Don't wait for symptoms to recommend screening."}},

{id:"HPM-8",category:"hpm",type:"single",subtopic:"Nutrition across the lifespan",
 stem:"A toddler drinks 40 oz of whole milk per day and little else. The RN should recognize this places the child at risk for which condition?",
 options:[{k:"A",t:"Iron-deficiency anemia"},
          {k:"B",t:"Vitamin D toxicity"},
          {k:"C",t:"Childhood obesity only"},
          {k:"D",t:"Hypercalcemia"}],
 correct:"A",
 explain:{concept:"Toddler nutrition — 'milk anemia'",
   why:["Excessive cow's milk intake displaces iron-rich foods and can bind dietary iron, commonly causing iron-deficiency anemia in toddlers ('milk anemia')."],
   wrong:{B:"Vitamin D toxicity is not a typical consequence of excess milk intake at this volume.",
          C:"Weight concerns can occur but iron-deficiency anemia is the classic, testable complication.",
          D:"Hypercalcemia is not the expected primary concern taught for excessive milk intake."},
   quick:"Toddlers should have milk intake limited to about 16–24 oz/day; excess milk = risk for iron-deficiency anemia."}},

{id:"HPM-9",category:"hpm",type:"sata",subtopic:"Normal newborn transition — SATA",
 stem:"Which findings are expected in a healthy newborn during the first 24 hours of life? Select all that apply.",
 options:[{k:"A",t:"Acrocyanosis (bluish hands and feet)"},
          {k:"B",t:"Respiratory rate of 30–60 breaths/min"},
          {k:"C",t:"Heart rate of 110–160 beats/min"},
          {k:"D",t:"Positive Moro (startle) reflex"},
          {k:"E",t:"Respiratory rate of 80 breaths/min with grunting"},
          {k:"F",t:"Central cyanosis of the trunk and face"}],
 correct:["A","B","C","D"],
 explain:{concept:"Normal newborn transition to extrauterine life",
   why:["Acrocyanosis is a normal, expected finding in the first 24–48 hours; RR 30–60, HR 110–160, and a positive Moro reflex are all normal newborn findings."],
   wrong:{E:"Grunting and RR of 80 suggest respiratory distress, not a normal finding.",
          F:"Central cyanosis (trunk/face) is always abnormal and requires immediate evaluation, unlike peripheral acrocyanosis."},
   quick:"Acrocyanosis = normal (peripheral only). Central cyanosis (lips, trunk, tongue) = always abnormal — report immediately."}},

{id:"HPM-10",category:"hpm",type:"single",subtopic:"Self-exam teaching",
 stem:"The RN is teaching a 22-year-old male client about testicular self-examination. Which instruction is correct?",
 options:[{k:"A",t:"Perform the exam once a year during an annual physical only"},
          {k:"B",t:"Perform the exam monthly, ideally after a warm shower when the scrotum is relaxed"},
          {k:"C",t:"Perform the exam only if pain or swelling is noticed"},
          {k:"D",t:"The exam is not recommended for men under age 30"},],
 correct:"B",
 explain:{concept:"Health promotion — self-exam teaching",
   why:["Monthly self-exams after a warm shower (when the scrotal skin is relaxed) make it easier to detect changes such as lumps or swelling early."],
   wrong:{A:"Annual-only exams miss the point of early detection between visits.",
          C:"The exam is meant to detect abnormalities before symptoms like pain occur.",
          D:"Testicular cancer risk is actually highest in younger men (typically ages 15–35), making self-exams especially relevant in this age group."},
   quick:"Self-exams (breast or testicular) are done monthly, proactively — not only when a problem is already suspected."}},

/* ============================= PSYCHOSOCIAL INTEGRITY ============================= */
{id:"PSY-1",category:"psy",type:"single",subtopic:"Therapeutic communication",
 stem:"A client says, 'I don't know if I can handle this diagnosis.' Which response by the RN is most therapeutic?",
 options:[{k:"A",t:"'Don't worry, everything will be fine.'"},
          {k:"B",t:"'Tell me more about what's worrying you.'"},
          {k:"C",t:"'You should try to stay positive.'"},
          {k:"D",t:"'Many people have this diagnosis and do well.'"}],
 correct:"B",
 explain:{concept:"Therapeutic communication — open-ended questions",
   why:["An open-ended prompt invites the client to express feelings and explore concerns in their own words, which is the core of therapeutic communication."],
   wrong:{A:"False reassurance dismisses the client's feelings and shuts down further discussion.",
          C:"Giving advice ('should') is a nontherapeutic blocking technique.",
          D:"Comparing to 'many people' minimizes this client's individual experience."},
   quick:"Therapeutic techniques: open-ended questions, reflection, silence, restating. Nontherapeutic: false reassurance, giving advice, changing the subject, minimizing."}},

{id:"PSY-2",category:"psy",type:"single",subtopic:"Grief — Kübler-Ross",
 stem:"A client recently diagnosed with a terminal illness angrily tells the RN, 'Why is this happening to me? This isn't fair!' How should the RN interpret this?",
 options:[{k:"A",t:"A sign of a maladaptive coping disorder requiring psychiatric referral"},
          {k:"B",t:"A normal stage of the grieving process (anger)"},
          {k:"C",t:"The client is being disrespectful and needs redirection"},
          {k:"D",t:"The client has not accepted the diagnosis and needs more education"}],
 correct:"B",
 explain:{concept:"Kübler-Ross stages of grief",
   why:["Anger is one of the recognized stages of grief (denial, anger, bargaining, depression, acceptance) and is a normal, expected emotional response to a terminal diagnosis."],
   wrong:{A:"This is a normal grief reaction, not pathology requiring psychiatric referral.",
          C:"Labeling the response as disrespectful fails to recognize a normal emotional process.",
          D:"More education does not address the emotional work of grieving; the priority is emotional support."},
   quick:"Grief stages are not linear and can occur in any order or repeat — anger, denial, bargaining, depression, and acceptance are all normal."}},

{id:"PSY-3",category:"psy",type:"single",subtopic:"Defense mechanisms",
 stem:"A client who is angry at their spouse yells at the nurse instead. Which defense mechanism is the client demonstrating?",
 options:[{k:"A",t:"Denial"},{k:"B",t:"Displacement"},{k:"C",t:"Projection"},{k:"D",t:"Rationalization"}],
 correct:"B",
 explain:{concept:"Ego defense mechanisms",
   why:["Displacement is redirecting an emotion (anger) from its original source (the spouse) onto a safer or unrelated target (the nurse)."],
   wrong:{A:"Denial is refusing to acknowledge a painful reality, not redirecting emotion.",
          C:"Projection is attributing one's own unacceptable feelings to someone else, not redirecting them.",
          D:"Rationalization is creating logical-sounding excuses to justify behavior."},
   quick:"Displacement = wrong target, same emotion. Projection = 'you feel this way,' not 'I feel this way.'"}},

{id:"PSY-4",category:"psy",type:"single",subtopic:"Intimate partner violence",
 stem:"The RN suspects a client may be experiencing intimate partner violence. What is the best approach?",
 options:[{k:"A",t:"Ask the client directly about abuse while the partner is out of the room"},
          {k:"B",t:"Ask the client about abuse with the partner present for support"},
          {k:"C",t:"Wait for the client to bring up the topic voluntarily"},
          {k:"D",t:"Confront the partner directly about the suspicion"}],
 correct:"A",
 explain:{concept:"Screening for intimate partner violence",
   why:["Screening must occur privately, without the partner present, to protect the client's safety and allow honest disclosure without fear of retaliation."],
   wrong:{B:"Asking with the partner present can endanger the client and prevents honest answers.",
          C:"Waiting may miss a critical safety window; universal screening in private is standard practice.",
          D:"Confronting the partner is unsafe and not the nurse's role."},
   quick:"IPV screening = always private, always direct, never with the suspected abuser in the room."}},

{id:"PSY-5",category:"psy",type:"single",subtopic:"Alcohol withdrawal",
 stem:"A client with a history of heavy daily alcohol use was admitted 18 hours ago for an unrelated surgery. The RN should monitor closely for which finding?",
 options:[{k:"A",t:"Bradycardia and hypotension"},
          {k:"B",t:"Tremors, anxiety, and elevated vital signs consistent with early withdrawal"},
          {k:"C",t:"Hypoglycemia only"},
          {k:"D",t:"Decreased deep tendon reflexes"}],
 correct:"B",
 explain:{concept:"Alcohol withdrawal timeline",
   why:["Early alcohol withdrawal symptoms (tremors, anxiety, tachycardia, hypertension) typically begin 6–24 hours after the last drink, matching this client's timeline; seizure risk peaks around 12–48 hours, and delirium tremens can occur 48–96 hours after cessation."],
   wrong:{A:"Withdrawal causes sympathetic overdrive (tachycardia/hypertension), not bradycardia/hypotension.",
          C:"Hyperglycemia, not hypoglycemia, is more typical during the sympathetic surge of withdrawal.",
          D:"Withdrawal increases, not decreases, neuromuscular excitability/reflexes."},
   quick:"Alcohol withdrawal timeline: 6–24h tremors/anxiety → 12–48h seizure risk → 48–96h delirium tremens. Use the CIWA-Ar scale and prioritize seizure precautions."}},

{id:"PSY-6",category:"psy",type:"single",subtopic:"Panic attack",
 stem:"A client on the unit suddenly reports chest tightness, shortness of breath, and a feeling of impending doom, with no cardiac findings on prior workup. The RN suspects a panic attack. What is the priority nursing action?",
 options:[{k:"A",t:"Leave the client alone to calm down independently"},
          {k:"B",t:"Stay with the client, speak in a calm low voice, and give simple, short directions"},
          {k:"C",t:"Immediately administer a PRN sedative without further assessment"},
          {k:"D",t:"Explain in detail why the symptoms are not dangerous"}],
 correct:"B",
 explain:{concept:"Therapeutic response to acute anxiety/panic",
   why:["Staying with the client provides safety and reassurance; a calm voice and short, simple directions are easier to process during acute anxiety, when cognitive processing is impaired."],
   wrong:{A:"Leaving an acutely anxious client increases fear and feelings of abandonment.",
          C:"Medication may be appropriate but only after further assessment (including ruling out cardiac causes if not already done) — presence and calming technique come first.",
          D:"Detailed, complex explanations are hard to process during peak anxiety; simple, brief communication is more effective."},
   quick:"During acute panic: stay, stay calm, keep language SHORT and SIMPLE — complex reasoning cannot be processed under high anxiety."}},

{id:"PSY-7",category:"psy",type:"single",subtopic:"Communicating with hallucinations",
 stem:"A client with schizophrenia tells the RN, 'The voices are telling me I'm worthless.' What is the RN's best response?",
 options:[{k:"A",t:"'There are no voices, you're imagining things.'"},
          {k:"B",t:"'That sounds frightening. I don't hear the voices, but I believe they feel real to you.'"},
          {k:"C",t:"'What are the voices saying, in detail?' to gather more information about the content"},
          {k:"D",t:"'You need to ignore the voices.'"}],
 correct:"B",
 explain:{concept:"Therapeutic communication with hallucinations",
   why:["The nurse should acknowledge the client's feelings and experience as real to them without validating the hallucination itself as objectively real ('I don't hear...but I believe they feel real to you')."],
   wrong:{A:"Directly denying the experience can feel invalidating and damage trust.",
          C:"Focusing on the content of hallucinations (especially command hallucinations) without first assessing safety is not the priority response; the emotional/safety focus comes first.",
          D:"Simply telling the client to 'ignore' the voices is dismissive and unhelpful."},
   quick:"With hallucinations: acknowledge the client's feelings, do NOT reinforce the hallucination as real, and always assess for command hallucinations that could involve self-harm."}},

{id:"PSY-8",category:"psy",type:"single",subtopic:"Suicide risk assessment",
 stem:"A client says, 'I just feel like giving up sometimes.' What is the RN's most important next action?",
 options:[{k:"A",t:"Change the subject to avoid upsetting the client"},
          {k:"B",t:"Directly ask the client if they are thinking of harming themselves and whether they have a plan"},
          {k:"C",t:"Document the comment and continue the assessment later"},
          {k:"D",t:"Reassure the client that things will get better"}],
 correct:"B",
 explain:{concept:"Suicide risk assessment",
   why:["Any statement suggesting hopelessness requires a direct, specific safety assessment — asking about suicidal ideation and a plan does not increase risk and is essential to determine the level of danger and next steps (e.g., removing means, 1:1 observation)."],
   wrong:{A:"Avoiding the topic misses a critical safety assessment opportunity.",
          C:"Delaying assessment of a possible safety risk is unsafe.",
          D:"General reassurance without direct assessment fails to determine actual risk."},
   quick:"Asking directly about suicidal thoughts does NOT plant the idea — it is the single most important safety assessment step. Always ask about ideation, plan, and means."}},

{id:"PSY-9",category:"psy",type:"sata",subtopic:"Acute mania interventions — SATA",
 stem:"Which nursing interventions are appropriate for a client experiencing acute mania related to bipolar disorder? Select all that apply.",
 options:[{k:"A",t:"Provide a low-stimulation environment"},
          {k:"B",t:"Offer finger foods the client can eat while moving"},
          {k:"C",t:"Set firm, consistent limits on behavior"},
          {k:"D",t:"Monitor closely for physical exhaustion and dehydration"},
          {k:"E",t:"Encourage participation in large, stimulating group activities"},
          {k:"F",t:"Ask the client to make several complex financial decisions during this time"}],
 correct:["A","B","C","D"],
 explain:{concept:"Nursing care during acute mania",
   why:["A low-stimulation environment reduces escalation; finger foods accommodate an inability to sit still; firm limits provide safety and structure; monitoring for exhaustion/dehydration addresses the physical risks of prolonged hyperactivity."],
   wrong:{E:"Large, stimulating activities can worsen agitation and escalate manic behavior.",
          F:"Clients in acute mania have impaired judgment; major decisions should be postponed, not encouraged, during this period."},
   quick:"Acute mania care = LOW stimulation + firm limits + easy portable nutrition + protect from poor-judgment decisions and physical exhaustion."}},

{id:"PSY-10",category:"psy",type:"single",subtopic:"Cultural competence",
 stem:"A client from a culture that values family-centered decision-making asks that all treatment decisions be discussed with their eldest son rather than directly with them. What is the RN's most appropriate response?",
 options:[{k:"A",t:"Insist on speaking directly with the client only, per standard hospital policy"},
          {k:"B",t:"Respect the client's wishes and involve the son in discussions as requested, while still confirming the client's own consent"},
          {k:"C",t:"Tell the client this practice is not allowed in the hospital"},
          {k:"D",t:"Avoid the topic entirely to prevent conflict"}],
 correct:"B",
 explain:{concept:"Cultural competence / patient-centered care",
   why:["Respecting culturally-based preferences for family involvement in decision-making, while still ensuring the client's own informed consent is documented, honors both autonomy and cultural values."],
   wrong:{A:"Rigidly enforcing a Western individualistic model disregards the client's cultural values.",
          C:"This response is dismissive and not client-centered.",
          D:"Avoiding the topic fails to address the client's expressed preference."},
   quick:"Cultural competence = adapt communication/processes to the client's values while still legally/ethically confirming their own informed consent."}},

/* ============================= BASIC CARE & COMFORT ============================= */
{id:"BCC-1",category:"bcc",type:"single",subtopic:"Pressure injury staging",
 stem:"The RN assesses a client's sacral pressure injury and notes a shallow open ulcer with a red-pink wound bed and no slough. How should this be staged?",
 options:[{k:"A",t:"Stage I"},{k:"B",t:"Stage II"},{k:"C",t:"Stage III"},{k:"D",t:"Stage IV"}],
 correct:"B",
 explain:{concept:"Pressure injury staging",
   why:["Stage II involves partial-thickness skin loss with a shallow open ulcer or intact/ruptured blister and a pink-red wound bed, without slough or exposed deeper tissue."],
   wrong:{A:"Stage I presents as intact skin with non-blanchable redness — no open wound.",
          C:"Stage III involves full-thickness tissue loss with visible fat, but not exposed bone/muscle/tendon.",
          D:"Stage IV involves full-thickness loss with exposed bone, muscle, or tendon."},
   quick:"Stage I = intact skin, red. Stage II = shallow open, pink wound bed. Stage III = fat visible. Stage IV = bone/muscle/tendon visible."}},

{id:"BCC-2",category:"bcc",type:"single",subtopic:"Repositioning",
 stem:"A client with limited mobility is at risk for pressure injury. How often should the RN reposition the client?",
 options:[{k:"A",t:"Every 30 minutes"},{k:"B",t:"Every 2 hours"},{k:"C",t:"Every 6 hours"},{k:"D",t:"Once per shift"}],
 correct:"B",
 explain:{concept:"Pressure injury prevention",
   why:["Repositioning immobile clients at least every 2 hours is the standard evidence-based interval to relieve pressure and maintain tissue perfusion."],
   wrong:{A:"Overly frequent and not the established standard interval.",
          C:"Too infrequent — allows prolonged pressure that can lead to tissue ischemia.",
          D:"Far too infrequent to prevent pressure injury development."},
   quick:"Standard repositioning interval for at-risk immobile clients = every 2 hours ('turn clock' q2h)."}},

{id:"BCC-3",category:"bcc",type:"single",subtopic:"Enteral feeding safety",
 stem:"Before administering an intermittent tube feeding, what is the priority nursing action?",
 options:[{k:"A",t:"Position the client supine for comfort"},
          {k:"B",t:"Elevate the head of the bed to at least 30–45 degrees and verify tube placement"},
          {k:"C",t:"Administer the feeding as fast as possible to save time"},
          {k:"D",t:"Flush the tube with 500 mL of water before feeding"}],
 correct:"B",
 explain:{concept:"Enteral (tube) feeding safety — aspiration prevention",
   why:["Elevating the head of the bed 30–45 degrees and confirming correct tube placement (per facility protocol, e.g., pH testing or x-ray confirmation) are essential steps to reduce aspiration risk."],
   wrong:{A:"A supine position significantly increases aspiration risk during and after feeding.",
          C:"Rapid administration increases risk of reflux, aspiration, and GI distress.",
          D:"500 mL is an excessive, inappropriate flush volume; standard flushes are typically 30 mL before/after feeding per protocol."},
   quick:"Tube feeding safety: HOB ≥30–45°, verify placement before every feeding/medication, maintain elevation for 30–60 min after feeding."}},

{id:"BCC-4",category:"bcc",type:"single",subtopic:"Constipation management",
 stem:"A hospitalized client reports not having a bowel movement in 3 days. What is the RN's first-line intervention?",
 options:[{k:"A",t:"Administer a stimulant laxative immediately"},
          {k:"B",t:"Encourage increased fluid intake, dietary fiber, and ambulation"},
          {k:"C",t:"Schedule a manual disimpaction"},
          {k:"D",t:"Restrict oral intake until the provider is notified"}],
 correct:"B",
 explain:{concept:"Constipation management — least invasive first",
   why:["Non-pharmacologic measures (fluids, fiber, mobility) are first-line interventions for constipation before escalating to medications or invasive procedures."],
   wrong:{A:"Medication is considered only after conservative measures fail or if clinically indicated sooner.",
          C:"Manual disimpaction is invasive and reserved for confirmed impaction, not a first-line step.",
          D:"Restricting oral intake would worsen constipation, not help it."},
   quick:"Constipation ladder: fluids/fiber/mobility first → then stool softener/laxative → then more invasive measures if needed."}},

{id:"BCC-5",category:"bcc",type:"single",subtopic:"Sleep promotion",
 stem:"A hospitalized client is having difficulty sleeping. Which nursing intervention is most appropriate?",
 options:[{k:"A",t:"Administer a sedative-hypnotic as the first choice every night"},
          {k:"B",t:"Cluster nursing care, dim lights, and reduce noise during nighttime hours"},
          {k:"C",t:"Wake the client every hour for vital signs regardless of clinical necessity"},
          {k:"D",t:"Encourage caffeinated beverages in the evening to help the client relax"}],
 correct:"B",
 explain:{concept:"Non-pharmacologic sleep promotion",
   why:["Clustering care, dimming lights, and reducing noise minimize sleep interruptions and support the body's natural sleep-wake cycle — first-line nursing interventions."],
   wrong:{A:"Medication should not be the automatic first choice; non-pharmacologic measures are tried first when appropriate.",
          C:"Unnecessary hourly wake-ups disrupt sleep rather than promote it.",
          D:"Caffeine is a stimulant and would worsen, not help, sleep difficulty."},
   quick:"Sleep hygiene basics: cluster care, reduce light/noise, avoid unnecessary interruptions, avoid stimulants near bedtime."}},

{id:"BCC-6",category:"bcc",type:"single",subtopic:"Non-pharmacologic pain management",
 stem:"A client reports mild incisional pain rated 3/10. Along with the ordered analgesic, which nursing intervention can help manage this pain?",
 options:[{k:"A",t:"Encourage the client to remain completely still and avoid all movement"},
          {k:"B",t:"Offer relaxation techniques, positioning support, and distraction"},
          {k:"C",t:"Withhold pain medication since the pain level is mild"},
          {k:"D",t:"Increase the analgesic dose beyond what is ordered"}],
 correct:"B",
 explain:{concept:"Non-pharmacologic pain management",
   why:["Relaxation, proper positioning, and distraction are evidence-based adjuncts that reduce the perception of pain and can be used alongside prescribed analgesics."],
   wrong:{A:"Complete immobility is not therapeutic and can contribute to complications like atelectasis or DVT.",
          C:"The client's self-report of pain, even if mild, should still be addressed per the plan of care.",
          D:"A nurse cannot increase a dose beyond what is ordered without a new provider order."},
   quick:"Pain management is multimodal: combine ordered analgesics WITH non-pharmacologic strategies (relaxation, positioning, distraction, heat/cold as ordered)."}},

{id:"BCC-7",category:"bcc",type:"single",subtopic:"Assistive devices — cane use",
 stem:"The RN is teaching a client with left-sided leg weakness how to use a cane. On which side should the cane be held?",
 options:[{k:"A",t:"On the weaker (left) side"},{k:"B",t:"On the stronger (right) side"},{k:"C",t:"It does not matter which side"},{k:"D",t:"In front of the body with both hands"}],
 correct:"B",
 explain:{concept:"Assistive device teaching — cane use",
   why:["A cane is held on the stronger side; the client advances the cane and the weaker leg together, allowing the stronger side to provide support and balance."],
   wrong:{A:"Holding the cane on the weak side does not provide adequate support and increases fall risk.",
          C:"Cane-side placement significantly affects stability and safety — it does matter.",
          D:"A cane is used one-handed on the stronger side, not held with both hands in front."},
   quick:"Cane rule: 'Cane on the strong side, move together with the weak side' — this maximizes support and balance."}},

{id:"BCC-8",category:"bcc",type:"single",subtopic:"Range of motion",
 stem:"A client is on prolonged bed rest and unable to move their extremities independently. What is the primary purpose of the RN performing passive range-of-motion (PROM) exercises?",
 options:[{k:"A",t:"To build the client's muscle strength"},
          {k:"B",t:"To maintain joint mobility and prevent contractures"},
          {k:"C",t:"To increase the client's independence in ambulation immediately"},
          {k:"D",t:"To replace the need for physical therapy"}],
 correct:"B",
 explain:{concept:"Range of motion exercises — purpose",
   why:["PROM exercises, performed by the caregiver without client effort, maintain joint flexibility and prevent contractures, muscle atrophy progression, and stiffness in an immobile client."],
   wrong:{A:"PROM does not build strength since the client is not actively contracting muscles — that requires active or resistive exercise.",
          C:"PROM does not directly restore ambulation ability.",
          D:"PROM is a nursing intervention, not a replacement for a full physical therapy plan."},
   quick:"Passive ROM = joint mobility/contracture prevention only (no strength gain). Active/resistive ROM = builds strength."}},

{id:"BCC-9",category:"bcc",type:"sata",subtopic:"Aspiration precautions — SATA",
 stem:"A client has dysphagia following a stroke. Which interventions should the RN include to reduce aspiration risk? Select all that apply.",
 options:[{k:"A",t:"Position the client upright (90 degrees) while eating"},
          {k:"B",t:"Offer thickened liquids as ordered by speech therapy"},
          {k:"C",t:"Instruct the client to tuck the chin while swallowing"},
          {k:"D",t:"Offer small bites and allow adequate time to swallow"},
          {k:"E",t:"Offer thin liquids to make swallowing easier"},
          {k:"F",t:"Have the client lie supine immediately after eating to rest"}],
 correct:["A","B","C","D"],
 explain:{concept:"Dysphagia / aspiration precautions",
   why:["Upright positioning, thickened liquids, chin-tuck technique, and small bites with adequate time all reduce the risk of food/liquid entering the airway in a client with impaired swallowing."],
   wrong:{E:"Thin liquids are harder for a dysphagic client to control and increase aspiration risk — thickened liquids are safer.",
          F:"Lying supine after eating increases reflux and aspiration risk; the client should remain upright for 30–60 minutes after meals."},
   quick:"Dysphagia care: upright + chin tuck + thickened liquids + small bites + stay upright after meals."}},

{id:"BCC-10",category:"bcc",type:"single",subtopic:"Oral care for unconscious client",
 stem:"The RN is providing oral care for an unconscious client. Which action is priority to prevent aspiration during the procedure?",
 options:[{k:"A",t:"Position the client supine with the head flat"},
          {k:"B",t:"Position the client side-lying with suction equipment readily available"},
          {k:"C",t:"Pour water directly into the client's mouth to rinse"},
          {k:"D",t:"Perform oral care only once per shift"}],
 correct:"B",
 explain:{concept:"Oral care safety for the unconscious client",
   why:["Side-lying position allows secretions/fluid to pool and drain from the mouth rather than toward the airway, and having suction available allows immediate removal of any pooled fluid."],
   wrong:{A:"A flat, supine position increases the risk that fluid or secretions will be aspirated into the airway.",
          C:"Pouring water directly into the mouth of an unconscious client risks aspiration; a moistened swab is used instead.",
          D:"Oral care for an unconscious client is typically needed more frequently (e.g., every 2–4 hours) to prevent complications like ventilator-associated pneumonia in intubated clients."},
   quick:"Unconscious client + oral care = side-lying position + suction ready + swab (never pour liquid directly into the mouth)."}},

/* ============================= PHARMACOLOGICAL & PARENTERAL THERAPIES ============================= */
{id:"PHARM-1",category:"pharm",type:"single",subtopic:"Dosage calculation",
 stem:"An order reads: Give 750 mg of a medication PO. Available: 250 mg tablets. How many tablets should the RN administer?",
 options:[{k:"A",t:"1 tablet"},{k:"B",t:"2 tablets"},{k:"C",t:"3 tablets"},{k:"D",t:"4 tablets"}],
 correct:"C",
 explain:{concept:"Basic dosage calculation",
   why:["Desired ÷ Available × Quantity = 750 mg ÷ 250 mg × 1 tablet = 3 tablets."],
   wrong:{A:"Under-dosing — does not meet the 750 mg ordered dose.",
          B:"Under-dosing — 2 tablets = only 500 mg, short of the ordered dose.",
          D:"Over-dosing — 4 tablets = 1000 mg, exceeds the ordered dose."},
   quick:"Formula: (Dose Desired ÷ Dose on Hand) × Quantity = Amount to give. Always double-check units match before calculating."}},

{id:"PHARM-2",category:"pharm",type:"single",subtopic:"IV drip rate calculation",
 stem:"An IV of 1000 mL is ordered to infuse over 8 hours using tubing with a drop factor of 15 gtt/mL. What is the correct flow rate in gtt/min? (Round to the nearest whole number.)",
 options:[{k:"A",t:"16 gtt/min"},{k:"B",t:"21 gtt/min"},{k:"C",t:"31 gtt/min"},{k:"D",t:"42 gtt/min"}],
 correct:"C",
 explain:{concept:"IV flow rate calculation",
   why:["Formula: (Volume × Drop factor) ÷ Time in minutes = (1000 mL × 15 gtt/mL) ÷ 480 min = 15000 ÷ 480 ≈ 31 gtt/min."],
   wrong:{A:"Too low — would under-infuse the ordered volume within 8 hours.",
          B:"Incorrect calculation — does not match the formula result.",
          D:"Too high — would infuse the volume faster than the ordered 8-hour period."},
   quick:"IV drip rate = (Total volume × Drop factor) ÷ Total time in minutes. Always convert hours to minutes first."}},

{id:"PHARM-3",category:"pharm",type:"single",subtopic:"Insulin / hypoglycemia",
 stem:"A client receiving insulin becomes diaphoretic, shaky, and confused. Fingerstick glucose is 52 mg/dL. The client is alert enough to swallow. What is the RN's priority action?",
 options:[{k:"A",t:"Administer 15 g of a fast-acting carbohydrate, such as 4 oz of juice"},
          {k:"B",t:"Administer a full meal immediately"},
          {k:"C",t:"Hold all future insulin doses indefinitely"},
          {k:"D",t:"Administer IV dextrose 50% immediately since the client can swallow"},],
 correct:"A",
 explain:{concept:"Hypoglycemia management — Rule of 15",
   why:["For a conscious client able to swallow, 15 g of fast-acting carbohydrate is the appropriate first step, followed by rechecking glucose in 15 minutes ('Rule of 15')."],
   wrong:{B:"A full meal is not the immediate priority and doesn't reliably deliver fast-acting glucose right away; simple carbohydrate first.",
          C:"Insulin should not be permanently discontinued based on a single hypoglycemic episode without provider reassessment.",
          D:"IV dextrose is reserved for clients who cannot safely swallow (e.g., unconscious); this client is alert and can take oral carbohydrate."},
   quick:"Rule of 15: give 15 g fast-acting carb → recheck glucose in 15 min → repeat if still <70 mg/dL. IV dextrose (D50) is reserved for clients who cannot swallow safely."}},

{id:"PHARM-4",category:"pharm",type:"single",subtopic:"Warfarin therapy",
 stem:"A client taking warfarin has an INR of 2.5. How should the RN interpret this result?",
 options:[{k:"A",t:"Subtherapeutic — the client is at risk for clotting"},
          {k:"B",t:"Within the typical therapeutic range for most indications"},
          {k:"C",t:"Dangerously elevated — the client is at high risk for bleeding"},
          {k:"D",t:"This value indicates the medication should be discontinued immediately"}],
 correct:"B",
 explain:{concept:"Warfarin therapeutic monitoring",
   why:["For most indications (e.g., atrial fibrillation, DVT treatment), the therapeutic INR range is 2.0–3.0; a value of 2.5 falls within this expected range."],
   wrong:{A:"An INR below 2.0 would be considered subtherapeutic, not 2.5.",
          C:"An INR significantly above 3.0 (often >4–5) raises bleeding concern, not 2.5.",
          D:"A therapeutic value does not warrant discontinuation."},
   quick:"Warfarin therapeutic INR ≈ 2.0–3.0 (higher, ~2.5–3.5, for mechanical heart valves). Antidote for toxicity/bleeding = vitamin K."}},

{id:"PHARM-5",category:"pharm",type:"single",subtopic:"Heparin therapy",
 stem:"A client is receiving a continuous IV heparin infusion. Which lab value does the RN monitor to assess therapeutic effect?",
 options:[{k:"A",t:"INR"},{k:"B",t:"aPTT (activated partial thromboplastin time)"},{k:"C",t:"Platelet count only"},{k:"D",t:"Hemoglobin A1c"}],
 correct:"B",
 explain:{concept:"Heparin monitoring",
   why:["aPTT is the lab value used to monitor and titrate IV heparin therapy, with a therapeutic goal typically 1.5–2.5 times the control value (per facility protocol)."],
   wrong:{A:"INR is used to monitor warfarin, not heparin.",
          C:"Platelets are monitored for heparin-induced thrombocytopenia (HIT) as a safety check, but aPTT is the primary therapeutic monitoring value.",
          D:"HbA1c reflects glucose control, unrelated to anticoagulation."},
   quick:"Heparin → aPTT → antidote = protamine sulfate. Warfarin → INR → antidote = vitamin K. Keep these pairs straight — a classic NCLEX pairing question."}},

{id:"PHARM-6",category:"pharm",type:"single",subtopic:"Digoxin safety",
 stem:"Before administering digoxin, what is the priority nursing assessment?",
 options:[{k:"A",t:"Check the client's blood glucose"},
          {k:"B",t:"Assess the apical pulse for 1 full minute and hold the dose if less than 60 bpm (or per facility parameter)"},
          {k:"C",t:"Assess the client's temperature"},
          {k:"D",t:"Assess bowel sounds"}],
 correct:"B",
 explain:{concept:"Digoxin administration safety",
   why:["Digoxin slows the heart rate and can cause dangerous bradycardia or toxicity; the apical pulse must be assessed for a full minute before every dose, and the dose held (with provider notified) if below the facility-specified threshold, typically 60 bpm."],
   wrong:{A:"Blood glucose is unrelated to digoxin's cardiac effects.",
          C:"Temperature is not the priority safety check for this medication.",
          D:"Bowel sounds are not the priority pre-administration assessment for digoxin."},
   quick:"Digoxin = always check apical pulse × 1 full minute before giving. Hold and notify provider if HR <60 (adult) — and know toxicity signs: nausea, visual halos, bradycardia, confusion."}},

{id:"PHARM-7",category:"pharm",type:"single",subtopic:"Opioid safety",
 stem:"A client received IV morphine 15 minutes ago for post-operative pain. What is the priority nursing assessment?",
 options:[{k:"A",t:"Blood pressure only"},{k:"B",t:"Respiratory rate and level of sedation"},{k:"C",t:"Bowel sounds"},{k:"D",t:"Skin turgor"}],
 correct:"B",
 explain:{concept:"Opioid safety monitoring",
   why:["Respiratory depression is the most serious, potentially life-threatening adverse effect of opioids; respiratory rate and sedation level are the priority reassessment after administration."],
   wrong:{A:"Blood pressure is monitored but is not the priority life-threatening concern with opioids.",
          C:"Constipation is a common opioid side effect but is not an immediate, life-threatening priority.",
          D:"Skin turgor is unrelated to opioid safety monitoring."},
   quick:"Opioid priority monitoring = respiratory rate + sedation level. Antidote for overdose/toxicity = naloxone (Narcan)."}},

{id:"PHARM-8",category:"pharm",type:"single",subtopic:"Antibiotic safety",
 stem:"Before administering a first dose of IV antibiotic, what is the RN's priority action?",
 options:[{k:"A",t:"Assess the client for known drug allergies"},
          {k:"B",t:"Warm the antibiotic to room temperature"},
          {k:"C",t:"Administer the medication as fast as possible via IV push"},
          {k:"D",t:"Delay administration until the next scheduled dosing time"}],
 correct:"A",
 explain:{concept:"Antibiotic administration safety",
   why:["Assessing for known allergies before the first dose of any antibiotic is essential to prevent a potentially life-threatening allergic or anaphylactic reaction."],
   wrong:{B:"Not a priority safety step compared to allergy assessment.",
          C:"Most IV antibiotics are given via intermittent infusion over a set time, not rapid IV push, and this doesn't address safety screening.",
          D:"Delaying an ordered antibiotic is inappropriate without an assessment-based reason."},
   quick:"First dose of ANY new medication (especially antibiotics) = confirm allergy history first, and monitor closely during/after the first dose for a reaction."}},

{id:"PHARM-9",category:"pharm",type:"sata",subtopic:"Digoxin toxicity — SATA",
 stem:"Which findings are signs of digoxin toxicity? Select all that apply.",
 options:[{k:"A",t:"Nausea and vomiting"},
          {k:"B",t:"Visual disturbances such as yellow-green halos around lights"},
          {k:"C",t:"Bradycardia"},
          {k:"D",t:"Confusion"},
          {k:"E",t:"Increased appetite"},
          {k:"F",t:"Hypertension with tachycardia"}],
 correct:["A","B","C","D"],
 explain:{concept:"Digoxin toxicity manifestations",
   why:["Classic toxicity signs include GI symptoms (nausea/vomiting/anorexia), visual disturbances (halos, blurred/yellow-green vision), bradycardia or other dysrhythmias, and confusion."],
   wrong:{E:"Toxicity typically causes anorexia/decreased appetite, not increased appetite.",
          F:"Digoxin toxicity is more classically associated with bradycardia, not hypertensive tachycardia."},
   quick:"Digoxin toxicity mnemonic: GI upset + visual halos + bradycardia/arrhythmia + confusion. Check drug level (therapeutic 0.5–2 ng/mL) and potassium level (hypokalemia worsens toxicity)."}},

{id:"PHARM-10",category:"pharm",type:"single",subtopic:"Lithium therapy",
 stem:"A client taking lithium for bipolar disorder should receive which teaching point?",
 options:[{k:"A",t:"Restrict sodium and fluid intake significantly"},
          {k:"B",t:"Maintain consistent, adequate sodium and fluid intake daily"},
          {k:"C",t:"Lithium levels do not need routine monitoring"},
          {k:"D",t:"Increase intake of NSAIDs for any minor aches"}],
 correct:"B",
 explain:{concept:"Lithium safety teaching",
   why:["Consistent sodium and fluid intake is essential because dehydration or low sodium increases lithium reabsorption in the kidneys, raising blood levels and toxicity risk."],
   wrong:{A:"Restricting sodium/fluids increases the risk of lithium toxicity, not decreases it.",
          C:"Lithium has a narrow therapeutic range (about 0.6–1.2 mEq/L) and requires regular blood level monitoring.",
          D:"NSAIDs can decrease renal clearance of lithium and increase toxicity risk; they should generally be avoided or used cautiously."},
   quick:"Lithium safety triad: stay hydrated + consistent sodium intake + avoid NSAIDs. Narrow therapeutic range (0.6–1.2 mEq/L) — toxicity signs include tremor, ataxia, confusion, GI upset."}},

/* ============================= REDUCTION OF RISK POTENTIAL ============================= */
{id:"RRP-1",category:"rrp",type:"single",subtopic:"Hyperkalemia recognition",
 stem:"A client's potassium level is 6.2 mEq/L. Which ECG change should the RN anticipate?",
 options:[{k:"A",t:"Flattened T waves"},{k:"B",t:"Peaked, tall T waves"},{k:"C",t:"Prominent U waves"},{k:"D",t:"Shortened QT interval only"}],
 correct:"B",
 explain:{concept:"Hyperkalemia — ECG changes",
   why:["Hyperkalemia classically causes peaked, tall, narrow T waves and can progress to widened QRS and lethal arrhythmias if untreated."],
   wrong:{A:"Flattened T waves are associated with hypokalemia, not hyperkalemia.",
          C:"Prominent U waves are a hypokalemia finding.",
          D:"Hyperkalemia is more associated with QRS widening than QT shortening as an isolated finding."},
   quick:"Hyperkalemia = peaked T waves. Hypokalemia = flattened T waves + prominent U waves. Normal K+ range: 3.5–5.0 mEq/L."}},

{id:"RRP-2",category:"rrp",type:"single",subtopic:"Hyponatremia",
 stem:"A client's sodium level is 118 mEq/L. Which finding should the RN monitor for as a priority?",
 options:[{k:"A",t:"Peripheral edema only"},{k:"B",t:"Confusion, seizures, and altered level of consciousness"},{k:"C",t:"Excessive thirst"},{k:"D",t:"Muscle cramps only"}],
 correct:"B",
 explain:{concept:"Severe hyponatremia — neurological risk",
   why:["Severe hyponatremia (typically <120 mEq/L) causes cerebral edema, leading to confusion, lethargy, seizures, and potentially coma — a neurological emergency."],
   wrong:{A:"Edema may occur depending on the cause but is not the priority life-threatening concern.",
          C:"Thirst is a nonspecific and lower-priority finding compared to neurological symptoms.",
          D:"Muscle cramps can occur but are not the priority over neurological status at this severity."},
   quick:"Severe hyponatremia (<120) = neuro emergency risk (seizures, cerebral edema). Normal sodium range: 135–145 mEq/L."}},

{id:"RRP-3",category:"rrp",type:"single",subtopic:"Post-op monitoring",
 stem:"A client returns to the unit after abdominal surgery. What is the RN's priority assessment in the first hour?",
 options:[{k:"A",t:"Ambulation status"},
          {k:"B",t:"Airway patency, vital sign trends, and signs of bleeding"},
          {k:"C",t:"Discharge teaching needs"},
          {k:"D",t:"Nutritional preferences"}],
 correct:"B",
 explain:{concept:"Immediate post-operative priority assessment",
   why:["The immediate post-op priority is airway/breathing status, hemodynamic stability (vital sign trends), and detecting early signs of internal or surgical site bleeding."],
   wrong:{A:"Ambulation is addressed later once the client is stable, typically per protocol after the immediate recovery period.",
          C:"Discharge teaching is not an immediate post-op priority.",
          D:"Nutrition preferences are addressed later, not in the first hour after surgery."},
   quick:"Immediate post-op = ABCs + vital sign trends + bleeding/surgical site check, reassessed frequently per facility protocol."}},

{id:"RRP-4",category:"rrp",type:"single",subtopic:"Pre-procedure teaching",
 stem:"A client is scheduled for a colonoscopy tomorrow. Which instruction should the RN include?",
 options:[{k:"A",t:"Eat a normal diet up until the procedure"},
          {k:"B",t:"Complete the prescribed bowel preparation and remain NPO as instructed before the procedure"},
          {k:"C",t:"There is no need to disclose current medications"},
          {k:"D",t:"Take all routine medications, including anticoagulants, without any changes"}],
 correct:"B",
 explain:{concept:"Pre-procedure preparation",
   why:["Adequate bowel preparation and appropriate NPO status are essential for procedure safety and visualization during colonoscopy."],
   wrong:{A:"A normal diet would leave stool in the colon, preventing adequate visualization.",
          C:"All current medications must be disclosed, especially anticoagulants, which may need to be held before the procedure.",
          D:"Anticoagulants are often held before procedures with bleeding risk, per provider instruction — this is not decided by the client without provider input."},
   quick:"Any invasive procedure prep = bowel prep as ordered + NPO status confirmed + full medication reconciliation (especially anticoagulants) + informed consent verified."}},

{id:"RRP-5",category:"rrp",type:"single",subtopic:"ABG interpretation",
 stem:"A client's ABG results are: pH 7.28, PaCO2 55 mmHg, HCO3 24 mEq/L. How should the RN interpret this result?",
 options:[{k:"A",t:"Respiratory acidosis"},{k:"B",t:"Respiratory alkalosis"},{k:"C",t:"Metabolic acidosis"},{k:"D",t:"Metabolic alkalosis"}],
 correct:"A",
 explain:{concept:"ABG interpretation",
   why:["Low pH (<7.35) with elevated PaCO2 (>45) and normal HCO3 indicates an uncompensated respiratory acidosis, typically from hypoventilation (e.g., COPD exacerbation, respiratory depression)."],
   wrong:{B:"Respiratory alkalosis would show an elevated pH and low PaCO2, the opposite of these findings.",
          C:"Metabolic acidosis would show a low HCO3, which is normal here.",
          D:"Metabolic alkalosis would show an elevated pH and elevated HCO3."},
   quick:"ROME: Respiratory = Opposite (pH and CO2 move opposite directions), Metabolic = Equal (pH and HCO3 move the same direction)."}},

{id:"RRP-6",category:"rrp",type:"single",subtopic:"Blood transfusion reaction",
 stem:"Ten minutes into a blood transfusion, a client develops chills, fever, and lower back pain. What is the RN's priority action?",
 options:[{k:"A",t:"Slow the infusion rate and monitor"},
          {k:"B",t:"Stop the transfusion immediately, keep the line open with normal saline, and notify the provider"},
          {k:"C",t:"Administer acetaminophen and continue the transfusion"},
          {k:"D",t:"Document the finding and reassess in 30 minutes"}],
 correct:"B",
 explain:{concept:"Acute transfusion reaction management",
   why:["Fever, chills, and back pain suggest a possible acute hemolytic or febrile transfusion reaction; the transfusion must be stopped immediately, the line kept patent with normal saline (using new tubing), and the provider and blood bank notified right away."],
   wrong:{A:"Slowing but continuing the transfusion still exposes the client to further blood product during a possible serious reaction.",
          C:"Continuing the transfusion during a suspected reaction is unsafe.",
          D:"Waiting to reassess delays critical intervention during a potential emergency."},
   quick:"Suspected transfusion reaction = STOP the transfusion first, keep the vein open with NS via new tubing, then notify the provider and follow facility reaction protocol."}},

{id:"RRP-7",category:"rrp",type:"single",subtopic:"Life-threatening dysrhythmia",
 stem:"A client's cardiac monitor shows ventricular fibrillation and the client is unresponsive with no pulse. What is the priority nursing action?",
 options:[{k:"A",t:"Administer oral antiarrhythmic medication"},
          {k:"B",t:"Begin CPR and prepare for immediate defibrillation"},
          {k:"C",t:"Reposition the client and recheck the monitor in 5 minutes"},
          {k:"D",t:"Notify the family before taking any action"}],
 correct:"B",
 explain:{concept:"Emergency response — pulseless V-fib",
   why:["Pulseless ventricular fibrillation is a cardiac arrest emergency requiring immediate CPR and defibrillation per ACLS protocol — every minute of delay significantly reduces survival."],
   wrong:{A:"Oral medications are inappropriate and far too slow for this emergency.",
          C:"Delaying intervention in a pulseless client is dangerous and can be fatal.",
          D:"Notifying family is not the priority during an active life-threatening emergency."},
   quick:"Pulseless V-fib/V-tach = immediate CPR + defibrillation (shockable rhythms). Time to defibrillation is the single biggest factor in survival."}},

{id:"RRP-8",category:"rrp",type:"single",subtopic:"Anticoagulant hold before surgery",
 stem:"A client scheduled for surgery in the morning is currently taking warfarin. What is the priority nursing action?",
 options:[{k:"A",t:"Administer the scheduled dose of warfarin as usual"},
          {k:"B",t:"Verify the provider's orders regarding holding warfarin and confirm the most recent INR result"},
          {k:"C",t:"Assume the medication should be held without checking orders"},
          {k:"D",t:"Double the dose to 'catch up' before surgery"}],
 correct:"B",
 explain:{concept:"Pre-operative anticoagulant management",
   why:["Anticoagulants are often held before surgery to reduce bleeding risk, but the specific timing and hold instructions must come from the provider's order, along with confirming a current INR to assess bleeding risk."],
   wrong:{A:"Administering warfarin without checking hold orders could increase surgical bleeding risk.",
          C:"Assuming without verifying orders is unsafe nursing practice.",
          D:"Doubling a dose is never appropriate and would dangerously increase bleeding risk."},
   quick:"Never assume — always verify specific hold/bridge orders for anticoagulants before any procedure, and confirm the most recent relevant lab value (INR, aPTT, etc.)."}},

{id:"RRP-9",category:"rrp",type:"sata",subtopic:"VTE risk factors — SATA",
 stem:"Which factors increase a client's risk for venous thromboembolism (VTE)? Select all that apply.",
 options:[{k:"A",t:"Prolonged immobility"},
          {k:"B",t:"Recent major surgery"},
          {k:"C",t:"Oral contraceptive use"},
          {k:"D",t:"Cigarette smoking"},
          {k:"E",t:"Frequent ambulation"},
          {k:"F",t:"Obesity"}],
 correct:["A","B","C","D","F"],
 explain:{concept:"VTE risk factor identification",
   why:["Immobility, surgery, estrogen-containing contraceptives, smoking, and obesity are all well-established VTE risk factors that increase venous stasis, vessel injury, or hypercoagulability (Virchow's triad)."],
   wrong:{E:"Frequent ambulation reduces VTE risk by promoting venous return — it is protective, not a risk factor."},
   quick:"VTE risk = Virchow's triad: venous stasis (immobility) + vessel injury (surgery) + hypercoagulability (contraceptives, smoking, obesity, cancer)."}},

{id:"RRP-10",category:"rrp",type:"single",subtopic:"Compartment syndrome",
 stem:"A client with a new leg cast reports severe pain unrelieved by opioids, along with pallor and diminished pulses in the affected limb. The RN should suspect which complication?",
 options:[{k:"A",t:"Normal post-casting discomfort"},
          {k:"B",t:"Compartment syndrome"},
          {k:"C",t:"Superficial skin irritation from the cast"},
          {k:"D",t:"Expected muscle soreness"}],
 correct:"B",
 explain:{concept:"Compartment syndrome — the 6 P's",
   why:["Pain out of proportion to injury/unrelieved by opioids, pallor, and diminished pulses are hallmark early signs of compartment syndrome, a limb-threatening emergency requiring immediate provider notification."],
   wrong:{A:"Normal post-casting discomfort should respond to ordered analgesics and not include vascular changes.",
          C:"Skin irritation would not cause pulselessness or pain unrelieved by opioids.",
          D:"Expected soreness does not present with vascular compromise findings."},
   quick:"Compartment syndrome — the 6 P's: Pain (out of proportion), Pallor, Paresthesia, Pulselessness, Poikilothermia (cold), Paralysis. Pain unrelieved by opioids is an early red flag — don't wait for all 6 P's to act."}},

/* ============================= PHYSIOLOGICAL ADAPTATION ============================= */
{id:"PA-1",category:"pa",type:"single",subtopic:"Myocardial infarction",
 stem:"A 68-year-old female client with diabetes reports vague fatigue, nausea, and mild jaw discomfort. Vital signs are stable. What should the RN suspect and prioritize?",
 options:[{k:"A",t:"Gastrointestinal upset; offer an antacid"},
          {k:"B",t:"Possible atypical myocardial infarction presentation; obtain a 12-lead ECG and notify the provider immediately"},
          {k:"C",t:"Anxiety; offer reassurance and reassess in 2 hours"},
          {k:"D",t:"Normal aging discomfort; no action needed"}],
 correct:"B",
 explain:{concept:"Atypical MI presentation",
   why:["Women, older adults, and clients with diabetes often present with atypical MI symptoms (fatigue, nausea, jaw/back discomfort) rather than classic crushing chest pain — this requires immediate cardiac workup, not dismissal."],
   wrong:{A:"Assuming GI cause without cardiac workup risks missing a life-threatening MI.",
          C:"Attributing symptoms to anxiety without ruling out cardiac cause is unsafe.",
          D:"These symptoms are not normal aging and require prompt evaluation."},
   quick:"Atypical MI presentation is COMMON in women, older adults, and diabetics — vague fatigue/nausea/jaw pain still warrants an immediate ECG and cardiac workup."}},

{id:"PA-2",category:"pa",type:"single",subtopic:"DKA",
 stem:"A client with type 1 diabetes presents with Kussmaul respirations, fruity breath odor, blood glucose of 480 mg/dL, and dehydration. What is the priority initial intervention?",
 options:[{k:"A",t:"Administer a large bolus of subcutaneous insulin immediately"},
          {k:"B",t:"Begin IV isotonic fluid resuscitation as ordered"},
          {k:"C",t:"Restrict all fluids until glucose normalizes"},
          {k:"D",t:"Administer oral glucose tablets"}],
 correct:"B",
 explain:{concept:"Diabetic ketoacidosis (DKA) management priority",
   why:["The priority in DKA is IV isotonic fluid resuscitation first to correct severe dehydration and improve perfusion; IV (not subcutaneous) insulin is typically started shortly after, per protocol, once fluids are underway and potassium is checked."],
   wrong:{A:"Subcutaneous insulin is not used in DKA due to poor absorption from dehydration; IV insulin infusion is standard, and insulin is not the very first action before fluids.",
          C:"Restricting fluids in a severely dehydrated client is dangerous and incorrect.",
          D:"The client already has hyperglycemia; oral glucose would worsen the condition."},
   quick:"DKA priority sequence: IV fluids first → then IV insulin (regular, continuous infusion) → closely monitor potassium (insulin drives K+ into cells, risking hypokalemia)."}},

{id:"PA-3",category:"pa",type:"single",subtopic:"Sepsis",
 stem:"A client shows signs of early sepsis: temperature 101.8°F (38.8°C), heart rate 118, respiratory rate 24, and confusion. What is the priority nursing action?",
 options:[{k:"A",t:"Administer broad-spectrum antibiotics before obtaining any cultures"},
          {k:"B",t:"Obtain blood cultures before starting antibiotics, then administer broad-spectrum antibiotics as ordered within the recommended time frame"},
          {k:"C",t:"Wait for culture results before starting any treatment"},
          {k:"D",t:"Administer an antipyretic only and reassess in 4 hours"}],

/* =========================================================================
   QUESTION BANK LOADER — pulls live from Supabase's `questions` table.
   Falls back to FALLBACK_QUESTIONS only if Supabase isn't configured yet
   or the fetch fails, so the app never shows a blank screen.
   ========================================================================= */
async function loadQuestionBank(){
  if(sbClient){
    try{
      const { data, error } = await sbClient.from("questions").select("*");
      if(error) throw error;
      if(data && data.length){
        return data.map(r=>({
          id:r.id, category:r.category, type:r.type, subtopic:r.subtopic,
          stem:r.stem, options:r.options, correct:r.correct, explain:r.explain
        }));
      }
    }catch(e){
      console.error("Couldn't load question bank from Supabase — using local fallback.", e);
    }
  }
  return FALLBACK_QUESTIONS;
}

   ENGINE
   ========================================================================= */
const state = {
  view:"home",            // home | quiz | recap | results
  studentName:"",  // legacy; display name now comes from authState.user or defaults to Guest
  quizTitle:"",
  quizKey:null,            // category key or "full-N"
  questions:[],
  index:0,
  answers:[],              // {qId, correctFlag, selected}
  locked:false,
  selectedSata:new Set(),
  sessionCorrect:0,
  sessionTotal:0,
  testProgress:{}          // testNumber -> {status, score}
};

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffle(arr){ return seededShuffle(arr, Math.floor(Math.random()*1e9)); }

function buildFullTest(testNumber){
  const pool = QUESTIONS.length;
  const targetTotal = Math.min(105, pool); // scales down honestly if bank is smaller than 105
  const seed = testNumber*7919 + 13;
  let selected = [];
  CATEGORIES.forEach((c,ci)=>{
    const catPool = seededShuffle(QUESTIONS.filter(q=>q.category===c.key), seed + ci*101 + 7);
    const target = Math.round(targetTotal * c.weight/100);
    selected.push(...catPool.slice(0, Math.min(target, catPool.length)));
  });
  const usedIds = new Set(selected.map(q=>q.id));
  if(selected.length < targetTotal){
    const leftover = seededShuffle(QUESTIONS.filter(q=>!usedIds.has(q.id)), seed+999);
    selected.push(...leftover.slice(0, targetTotal-selected.length));
  }
  return seededShuffle(selected, seed+555);
}

}
function renderRail(){
  const list = document.getElementById("railList");
  const note = document.getElementById("railNote");
  const bankSize = QUESTIONS.length;

}
function renderSessionScore(){

}

/* ---------- Views ---------- */

      <div class="weight-pct mono">${c.weight}%</div>

  }).join("");
  document.getElementById("main").innerHTML = `
    <div class="hero">
