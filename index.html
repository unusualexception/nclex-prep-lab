   quick:"Cultural competence = adapt communication/processes to the client's values while still legally/ethically confirming their own informed consent."}},

{id:"BCC-1",category:"bcc",type:"single",subtopic:"Pressure injury staging",
 stem:"The RN assesses a client's sacral pressure injury and notes a shallow open ulcer with a red-pink wound bed and no slough. How should this be staged?",
 options:[{k:"A",t:"Stage I"},{k:"B",t:"Stage II"},{k:"C",t:"Stage III"},{k:"D",t:"Stage IV"}],
 correct:"B",
 explain:{concept:"Pressure injury staging",
   why:["Stage II involves partial-thickness skin loss with a shallow open ulcer or intact/ruptured blister and a pink-red wound bed, without slough or exposed deeper tissue."],
   wrong:{A:"Stage I presents as intact skin with non-blanchable redness — no open wound.",C:"Stage III involves full-thickness tissue loss with visible fat, but not exposed bone/muscle/tendon.",D:"Stage IV involves full-thickness loss with exposed bone, muscle, or tendon."},
   quick:"Stage I = intact skin, red. Stage II = shallow open, pink wound bed. Stage III = fat visible. Stage IV = bone/muscle/tendon visible."}},

{id:"BCC-2",category:"bcc",type:"single",subtopic:"Repositioning",
 stem:"A client with limited mobility is at risk for pressure injury. How often should the RN reposition the client?",
 options:[{k:"A",t:"Every 6 hours"},{k:"B",t:"Every 30 minutes"},{k:"C",t:"Once per shift"},{k:"D",t:"Every 2 hours"}],
 correct:"D",
 explain:{concept:"Pressure injury prevention",
   why:["Repositioning immobile clients at least every 2 hours is the standard evidence-based interval to relieve pressure and maintain tissue perfusion."],
   wrong:{B:"Overly frequent and not the established standard interval.",A:"Too infrequent — allows prolonged pressure that can lead to tissue ischemia.",C:"Far too infrequent to prevent pressure injury development."},
   quick:"Standard repositioning interval for at-risk immobile clients = every 2 hours ('turn clock' q2h)."}},

{id:"BCC-3",category:"bcc",type:"single",subtopic:"Enteral feeding safety",
 stem:"Before administering an intermittent tube feeding, what is the priority nursing action?",
 options:[{k:"A",t:"Elevate the head of the bed to at least 30–45 degrees and verify tube placement"},{k:"B",t:"Position the client supine for comfort"},{k:"C",t:"Administer the feeding as fast as possible to save time"},{k:"D",t:"Flush the tube with 500 mL of water before feeding"}],
 correct:"A",
 explain:{concept:"Enteral (tube) feeding safety — aspiration prevention",
   why:["Elevating the head of the bed 30–45 degrees and confirming correct tube placement (per facility protocol, e.g., pH testing or x-ray confirmation) are essential steps to reduce aspiration risk."],
   wrong:{B:"A supine position significantly increases aspiration risk during and after feeding.",C:"Rapid administration increases risk of reflux, aspiration, and GI distress.",D:"500 mL is an excessive, inappropriate flush volume; standard flushes are typically 30 mL before/after feeding per protocol."},
   quick:"Tube feeding safety: HOB ≥30–45°, verify placement before every feeding/medication, maintain elevation for 30–60 min after feeding."}},

{id:"BCC-4",category:"bcc",type:"single",subtopic:"Constipation management",
 stem:"A hospitalized client reports not having a bowel movement in 3 days. What is the RN's first-line intervention?",
 options:[{k:"A",t:"Restrict oral intake until the provider is notified"},{k:"B",t:"Schedule a manual disimpaction"},{k:"C",t:"Encourage increased fluid intake, dietary fiber, and ambulation"},{k:"D",t:"Administer a stimulant laxative immediately"}],
 correct:"C",
 explain:{concept:"Constipation management — least invasive first",
   why:["Non-pharmacologic measures (fluids, fiber, mobility) are first-line interventions for constipation before escalating to medications or invasive procedures."],
   wrong:{D:"Medication is considered only after conservative measures fail or if clinically indicated sooner.",B:"Manual disimpaction is invasive and reserved for confirmed impaction, not a first-line step.",A:"Restricting oral intake would worsen constipation, not help it."},
   quick:"Constipation ladder: fluids/fiber/mobility first → then stool softener/laxative → then more invasive measures if needed."}},

{id:"BCC-5",category:"bcc",type:"single",subtopic:"Sleep promotion",
 stem:"A hospitalized client is having difficulty sleeping. Which nursing intervention is most appropriate?",
 options:[{k:"A",t:"Administer a sedative-hypnotic as the first choice every night"},{k:"B",t:"Encourage caffeinated beverages in the evening to help the client relax"},{k:"C",t:"Wake the client every hour for vital signs regardless of clinical necessity"},{k:"D",t:"Cluster nursing care, dim lights, and reduce noise during nighttime hours"}],
 correct:"D",
 explain:{concept:"Non-pharmacologic sleep promotion",
   why:["Clustering care, dimming lights, and reducing noise minimize sleep interruptions and support the body's natural sleep-wake cycle — first-line nursing interventions."],
   wrong:{A:"Medication should not be the automatic first choice; non-pharmacologic measures are tried first when appropriate.",C:"Unnecessary hourly wake-ups disrupt sleep rather than promote it.",B:"Caffeine is a stimulant and would worsen, not help, sleep difficulty."},
   quick:"Sleep hygiene basics: cluster care, reduce light/noise, avoid unnecessary interruptions, avoid stimulants near bedtime."}},

{id:"BCC-6",category:"bcc",type:"single",subtopic:"Non-pharmacologic pain management",
 stem:"A client reports mild incisional pain rated 3/10. Along with the ordered analgesic, which nursing intervention can help manage this pain?",
 options:[{k:"A",t:"Encourage the client to remain completely still and avoid all movement"},{k:"B",t:"Withhold pain medication since the pain level is mild"},{k:"C",t:"Increase the analgesic dose beyond what is ordered"},{k:"D",t:"Offer relaxation techniques, positioning support, and distraction"}],
 correct:"D",
 explain:{concept:"Non-pharmacologic pain management",
   why:["Relaxation, proper positioning, and distraction are evidence-based adjuncts that reduce the perception of pain and can be used alongside prescribed analgesics."],
   wrong:{A:"Complete immobility is not therapeutic and can contribute to complications like atelectasis or DVT.",B:"The client's self-report of pain, even if mild, should still be addressed per the plan of care.",C:"A nurse cannot increase a dose beyond what is ordered without a new provider order."},
   quick:"Pain management is multimodal: combine ordered analgesics WITH non-pharmacologic strategies (relaxation, positioning, distraction, heat/cold as ordered)."}},

{id:"BCC-7",category:"bcc",type:"single",subtopic:"Assistive devices — cane use",
 stem:"The RN is teaching a client with left-sided leg weakness how to use a cane. On which side should the cane be held?",
 options:[{k:"A",t:"On the weaker (left) side"},{k:"B",t:"It does not matter which side"},{k:"C",t:"In front of the body with both hands"},{k:"D",t:"On the stronger (right) side"}],
 correct:"D",
 explain:{concept:"Assistive device teaching — cane use",
   why:["A cane is held on the stronger side; the client advances the cane and the weaker leg together, allowing the stronger side to provide support and balance."],
   wrong:{A:"Holding the cane on the weak side does not provide adequate support and increases fall risk.",B:"Cane-side placement significantly affects stability and safety — it does matter.",C:"A cane is used one-handed on the stronger side, not held with both hands in front."},
   quick:"Cane rule: 'Cane on the strong side, move together with the weak side' — this maximizes support and balance."}},

{id:"BCC-8",category:"bcc",type:"single",subtopic:"Range of motion",
 stem:"A client is on prolonged bed rest and unable to move their extremities independently. What is the primary purpose of the RN performing passive range-of-motion (PROM) exercises?",
 options:[{k:"A",t:"To replace the need for physical therapy"},{k:"B",t:"To build the client's muscle strength"},{k:"C",t:"To increase the client's independence in ambulation immediately"},{k:"D",t:"To maintain joint mobility and prevent contractures"}],
 correct:"D",
 explain:{concept:"Range of motion exercises — purpose",
   why:["PROM exercises, performed by the caregiver without client effort, maintain joint flexibility and prevent contractures, muscle atrophy progression, and stiffness in an immobile client."],
   wrong:{B:"PROM does not build strength since the client is not actively contracting muscles — that requires active or resistive exercise.",C:"PROM does not directly restore ambulation ability.",A:"PROM is a nursing intervention, not a replacement for a full physical therapy plan."},
   quick:"Passive ROM = joint mobility/contracture prevention only (no strength gain). Active/resistive ROM = builds strength."}},

{id:"BCC-9",category:"bcc",type:"sata",subtopic:"Aspiration precautions — SATA",
 stem:"A client has dysphagia following a stroke. Which interventions should the RN include to reduce aspiration risk? Select all that apply.",
 options:[{k:"A",t:"Offer thin liquids to make swallowing easier"},{k:"B",t:"Offer small bites and allow adequate time to swallow"},{k:"C",t:"Offer thickened liquids as ordered by speech therapy"},{k:"D",t:"Position the client upright (90 degrees) while eating"},{k:"E",t:"Instruct the client to tuck the chin while swallowing"},{k:"F",t:"Have the client lie supine immediately after eating to rest"}],
 correct:["B","C","D","E"],
 explain:{concept:"Dysphagia / aspiration precautions",
   why:["Upright positioning, thickened liquids, chin-tuck technique, and small bites with adequate time all reduce the risk of food/liquid entering the airway in a client with impaired swallowing."],
   wrong:{A:"Thin liquids are harder for a dysphagic client to control and increase aspiration risk — thickened liquids are safer.",F:"Lying supine after eating increases reflux and aspiration risk; the client should remain upright for 30–60 minutes after meals."},
   quick:"Dysphagia care: upright + chin tuck + thickened liquids + small bites + stay upright after meals."}},

{id:"BCC-10",category:"bcc",type:"single",subtopic:"Oral care for unconscious client",
 stem:"The RN is providing oral care for an unconscious client. Which action is priority to prevent aspiration during the procedure?",
 options:[{k:"A",t:"Position the client side-lying with suction equipment readily available"},{k:"B",t:"Perform oral care only once per shift"},{k:"C",t:"Pour water directly into the client's mouth to rinse"},{k:"D",t:"Position the client supine with the head flat"}],
 correct:"A",
 explain:{concept:"Oral care safety for the unconscious client",
   why:["Side-lying position allows secretions/fluid to pool and drain from the mouth rather than toward the airway, and having suction available allows immediate removal of any pooled fluid."],
   wrong:{D:"A flat, supine position increases the risk that fluid or secretions will be aspirated into the airway.",C:"Pouring water directly into the mouth of an unconscious client risks aspiration; a moistened swab is used instead.",B:"Oral care for an unconscious client is typically needed more frequently (e.g., every 2–4 hours) to prevent complications like ventilator-associated pneumonia in intubated clients."},
   quick:"Unconscious client + oral care = side-lying position + suction ready + swab (never pour liquid directly into the mouth)."}},

{id:"PHARM-1",category:"pharm",type:"single",subtopic:"Dosage calculation",
 stem:"An order reads: Give 750 mg of a medication PO. Available: 250 mg tablets. How many tablets should the RN administer?",
 options:[{k:"A",t:"3 tablets"},{k:"B",t:"1 tablet"},{k:"C",t:"4 tablets"},{k:"D",t:"2 tablets"}],
 correct:"A",
 explain:{concept:"Basic dosage calculation",
   why:["Desired ÷ Available × Quantity = 750 mg ÷ 250 mg × 1 tablet = 3 tablets."],
   wrong:{B:"Under-dosing — does not meet the 750 mg ordered dose.",D:"Under-dosing — 2 tablets = only 500 mg, short of the ordered dose.",C:"Over-dosing — 4 tablets = 1000 mg, exceeds the ordered dose."},
   quick:"Formula: (Dose Desired ÷ Dose on Hand) × Quantity = Amount to give. Always double-check units match before calculating."}},

{id:"PHARM-2",category:"pharm",type:"single",subtopic:"IV drip rate calculation",
 stem:"An IV of 1000 mL is ordered to infuse over 8 hours using tubing with a drop factor of 15 gtt/mL. What is the correct flow rate in gtt/min? (Round to the nearest whole number.)",
 options:[{k:"A",t:"21 gtt/min"},{k:"B",t:"16 gtt/min"},{k:"C",t:"31 gtt/min"},{k:"D",t:"42 gtt/min"}],
 correct:"C",
 explain:{concept:"IV flow rate calculation",
   why:["Formula: (Volume × Drop factor) ÷ Time in minutes = (1000 mL × 15 gtt/mL) ÷ 480 min = 15000 ÷ 480 ≈ 31 gtt/min."],
   wrong:{B:"Too low — would under-infuse the ordered volume within 8 hours.",A:"Incorrect calculation — does not match the formula result.",D:"Too high — would infuse the volume faster than the ordered 8-hour period."},
   quick:"IV drip rate = (Total volume × Drop factor) ÷ Total time in minutes. Always convert hours to minutes first."}},

{id:"PHARM-3",category:"pharm",type:"single",subtopic:"Insulin / hypoglycemia",
 stem:"A client receiving insulin becomes diaphoretic, shaky, and confused. Fingerstick glucose is 52 mg/dL. The client is alert enough to swallow. What is the RN's priority action?",
 options:[{k:"A",t:"Administer a full meal immediately"},{k:"B",t:"Hold all future insulin doses indefinitely"},{k:"C",t:"Administer IV dextrose 50% immediately since the client can swallow"},{k:"D",t:"Administer 15 g of a fast-acting carbohydrate, such as 4 oz of juice"}],
 correct:"D",
 explain:{concept:"Hypoglycemia management — Rule of 15",
   why:["For a conscious client able to swallow, 15 g of fast-acting carbohydrate is the appropriate first step, followed by rechecking glucose in 15 minutes ('Rule of 15')."],
   wrong:{A:"A full meal is not the immediate priority and doesn't reliably deliver fast-acting glucose right away; simple carbohydrate first.",B:"Insulin should not be permanently discontinued based on a single hypoglycemic episode without provider reassessment.",C:"IV dextrose is reserved for clients who cannot safely swallow (e.g., unconscious); this client is alert and can take oral carbohydrate."},
   quick:"Rule of 15: give 15 g fast-acting carb → recheck glucose in 15 min → repeat if still <70 mg/dL. IV dextrose (D50) is reserved for clients who cannot swallow safely."}},

{id:"PHARM-4",category:"pharm",type:"single",subtopic:"Warfarin therapy",
 stem:"A client taking warfarin has an INR of 2.5. How should the RN interpret this result?",
 options:[{k:"A",t:"This value indicates the medication should be discontinued immediately"},{k:"B",t:"Within the typical therapeutic range for most indications"},{k:"C",t:"Dangerously elevated — the client is at high risk for bleeding"},{k:"D",t:"Subtherapeutic — the client is at risk for clotting"}],
 correct:"B",
 explain:{concept:"Warfarin therapeutic monitoring",
   why:["For most indications (e.g., atrial fibrillation, DVT treatment), the therapeutic INR range is 2.0–3.0; a value of 2.5 falls within this expected range."],
   wrong:{D:"An INR below 2.0 would be considered subtherapeutic, not 2.5.",C:"An INR significantly above 3.0 (often >4–5) raises bleeding concern, not 2.5.",A:"A therapeutic value does not warrant discontinuation."},
   quick:"Warfarin therapeutic INR ≈ 2.0–3.0 (higher, ~2.5–3.5, for mechanical heart valves). Antidote for toxicity/bleeding = vitamin K."}},

{id:"PHARM-5",category:"pharm",type:"single",subtopic:"Heparin therapy",
 stem:"A client is receiving a continuous IV heparin infusion. Which lab value does the RN monitor to assess therapeutic effect?",
 options:[{k:"A",t:"Hemoglobin A1c"},{k:"B",t:"INR"},{k:"C",t:"Platelet count only"},{k:"D",t:"aPTT (activated partial thromboplastin time)"}],
 correct:"D",
 explain:{concept:"Heparin monitoring",
   why:["aPTT is the lab value used to monitor and titrate IV heparin therapy, with a therapeutic goal typically 1.5–2.5 times the control value (per facility protocol)."],
   wrong:{B:"INR is used to monitor warfarin, not heparin.",C:"Platelets are monitored for heparin-induced thrombocytopenia (HIT) as a safety check, but aPTT is the primary therapeutic monitoring value.",A:"HbA1c reflects glucose control, unrelated to anticoagulation."},
   quick:"Heparin → aPTT → antidote = protamine sulfate. Warfarin → INR → antidote = vitamin K. Keep these pairs straight — a classic NCLEX pairing question."}},

{id:"PHARM-6",category:"pharm",type:"single",subtopic:"Digoxin safety",
 stem:"Before administering digoxin, what is the priority nursing assessment?",
 options:[{k:"A",t:"Check the client's blood glucose"},{k:"B",t:"Assess the client's temperature"},{k:"C",t:"Assess bowel sounds"},{k:"D",t:"Assess the apical pulse for 1 full minute and hold the dose if less than 60 bpm (or per facility parameter)"}],
 correct:"D",
 explain:{concept:"Digoxin administration safety",
   why:["Digoxin slows the heart rate and can cause dangerous bradycardia or toxicity; the apical pulse must be assessed for a full minute before every dose, and the dose held (with provider notified) if below the facility-specified threshold, typically 60 bpm."],
   wrong:{A:"Blood glucose is unrelated to digoxin's cardiac effects.",B:"Temperature is not the priority safety check for this medication.",C:"Bowel sounds are not the priority pre-administration assessment for digoxin."},
   quick:"Digoxin = always check apical pulse × 1 full minute before giving. Hold and notify provider if HR <60 (adult) — and know toxicity signs: nausea, visual halos, bradycardia, confusion."}},

{id:"PHARM-7",category:"pharm",type:"single",subtopic:"Opioid safety",
 stem:"A client received IV morphine 15 minutes ago for post-operative pain. What is the priority nursing assessment?",
 options:[{k:"A",t:"Blood pressure only"},{k:"B",t:"Bowel sounds"},{k:"C",t:"Skin turgor"},{k:"D",t:"Respiratory rate and level of sedation"}],
 correct:"D",
 explain:{concept:"Opioid safety monitoring",
   why:["Respiratory depression is the most serious, potentially life-threatening adverse effect of opioids; respiratory rate and sedation level are the priority reassessment after administration."],
   wrong:{A:"Blood pressure is monitored but is not the priority life-threatening concern with opioids.",B:"Constipation is a common opioid side effect but is not an immediate, life-threatening priority.",C:"Skin turgor is unrelated to opioid safety monitoring."},
   quick:"Opioid priority monitoring = respiratory rate + sedation level. Antidote for overdose/toxicity = naloxone (Narcan)."}},

{id:"PHARM-8",category:"pharm",type:"single",subtopic:"Antibiotic safety",
 stem:"Before administering a first dose of IV antibiotic, what is the RN's priority action?",
 options:[{k:"A",t:"Delay administration until the next scheduled dosing time"},{k:"B",t:"Assess the client for known drug allergies"},{k:"C",t:"Warm the antibiotic to room temperature"},{k:"D",t:"Administer the medication as fast as possible via IV push"}],
 correct:"B",
 explain:{concept:"Antibiotic administration safety",
   why:["Assessing for known allergies before the first dose of any antibiotic is essential to prevent a potentially life-threatening allergic or anaphylactic reaction."],
   wrong:{C:"Not a priority safety step compared to allergy assessment.",D:"Most IV antibiotics are given via intermittent infusion over a set time, not rapid IV push, and this doesn't address safety screening.",A:"Delaying an ordered antibiotic is inappropriate without an assessment-based reason."},
   quick:"First dose of ANY new medication (especially antibiotics) = confirm allergy history first, and monitor closely during/after the first dose for a reaction."}},

{id:"PHARM-9",category:"pharm",type:"sata",subtopic:"Digoxin toxicity — SATA",
 stem:"Which findings are signs of digoxin toxicity? Select all that apply.",
 options:[{k:"A",t:"Nausea and vomiting"},{k:"B",t:"Hypertension with tachycardia"},{k:"C",t:"Visual disturbances such as yellow-green halos around lights"},{k:"D",t:"Confusion"},{k:"E",t:"Bradycardia"},{k:"F",t:"Increased appetite"}],
 correct:["A","C","D","E"],
 explain:{concept:"Digoxin toxicity manifestations",
   why:["Classic toxicity signs include GI symptoms (nausea/vomiting/anorexia), visual disturbances (halos, blurred/yellow-green vision), bradycardia or other dysrhythmias, and confusion."],
   wrong:{F:"Toxicity typically causes anorexia/decreased appetite, not increased appetite.",B:"Digoxin toxicity is more classically associated with bradycardia, not hypertensive tachycardia."},
   quick:"Digoxin toxicity mnemonic: GI upset + visual halos + bradycardia/arrhythmia + confusion. Check drug level (therapeutic 0.5–2 ng/mL) and potassium level (hypokalemia worsens toxicity)."}},

{id:"PHARM-10",category:"pharm",type:"single",subtopic:"Lithium therapy",
 stem:"A client taking lithium for bipolar disorder should receive which teaching point?",
 options:[{k:"A",t:"Lithium levels do not need routine monitoring"},{k:"B",t:"Restrict sodium and fluid intake significantly"},{k:"C",t:"Maintain consistent, adequate sodium and fluid intake daily"},{k:"D",t:"Increase intake of NSAIDs for any minor aches"}],
 correct:"C",
 explain:{concept:"Lithium safety teaching",
   why:["Consistent sodium and fluid intake is essential because dehydration or low sodium increases lithium reabsorption in the kidneys, raising blood levels and toxicity risk."],
   wrong:{B:"Restricting sodium/fluids increases the risk of lithium toxicity, not decreases it.",A:"Lithium has a narrow therapeutic range (about 0.6–1.2 mEq/L) and requires regular blood level monitoring.",D:"NSAIDs can decrease renal clearance of lithium and increase toxicity risk; they should generally be avoided or used cautiously."},
   quick:"Lithium safety triad: stay hydrated + consistent sodium intake + avoid NSAIDs. Narrow therapeutic range (0.6–1.2 mEq/L) — toxicity signs include tremor, ataxia, confusion, GI upset."}},

{id:"RRP-1",category:"rrp",type:"single",subtopic:"Hyperkalemia recognition",
 stem:"A client's potassium level is 6.2 mEq/L. Which ECG change should the RN anticipate?",
 options:[{k:"A",t:"Prominent U waves"},{k:"B",t:"Peaked, tall T waves"},{k:"C",t:"Flattened T waves"},{k:"D",t:"Shortened QT interval only"}],
 correct:"B",
 explain:{concept:"Hyperkalemia — ECG changes",
   why:["Hyperkalemia classically causes peaked, tall, narrow T waves and can progress to widened QRS and lethal arrhythmias if untreated."],
   wrong:{C:"Flattened T waves are associated with hypokalemia, not hyperkalemia.",A:"Prominent U waves are a hypokalemia finding.",D:"Hyperkalemia is more associated with QRS widening than QT shortening as an isolated finding."},
   quick:"Hyperkalemia = peaked T waves. Hypokalemia = flattened T waves + prominent U waves. Normal K+ range: 3.5–5.0 mEq/L."}},

{id:"RRP-2",category:"rrp",type:"single",subtopic:"Hyponatremia",
 stem:"A client's sodium level is 118 mEq/L. Which finding should the RN monitor for as a priority?",
 options:[{k:"A",t:"Peripheral edema only"},{k:"B",t:"Confusion, seizures, and altered level of consciousness"},{k:"C",t:"Excessive thirst"},{k:"D",t:"Muscle cramps only"}],
 correct:"B",
 explain:{concept:"Severe hyponatremia — neurological risk",
   why:["Severe hyponatremia (typically <120 mEq/L) causes cerebral edema, leading to confusion, lethargy, seizures, and potentially coma — a neurological emergency."],
   wrong:{A:"Edema may occur depending on the cause but is not the priority life-threatening concern.",C:"Thirst is a nonspecific and lower-priority finding compared to neurological symptoms.",D:"Muscle cramps can occur but are not the priority over neurological status at this severity."},
   quick:"Severe hyponatremia (<120) = neuro emergency risk (seizures, cerebral edema). Normal sodium range: 135–145 mEq/L."}},

{id:"RRP-3",category:"rrp",type:"single",subtopic:"Post-op monitoring",
 stem:"A client returns to the unit after abdominal surgery. What is the RN's priority assessment in the first hour?",
 options:[{k:"A",t:"Ambulation status"},{k:"B",t:"Airway patency, vital sign trends, and signs of bleeding"},{k:"C",t:"Discharge teaching needs"},{k:"D",t:"Nutritional preferences"}],
 correct:"B",
 explain:{concept:"Immediate post-operative priority assessment",
   why:["The immediate post-op priority is airway/breathing status, hemodynamic stability (vital sign trends), and detecting early signs of internal or surgical site bleeding."],
   wrong:{A:"Ambulation is addressed later once the client is stable, typically per protocol after the immediate recovery period.",C:"Discharge teaching is not an immediate post-op priority.",D:"Nutrition preferences are addressed later, not in the first hour after surgery."},
   quick:"Immediate post-op = ABCs + vital sign trends + bleeding/surgical site check, reassessed frequently per facility protocol."}},

{id:"RRP-4",category:"rrp",type:"single",subtopic:"Pre-procedure teaching",
 stem:"A client is scheduled for a colonoscopy tomorrow. Which instruction should the RN include?",
 options:[{k:"A",t:"Eat a normal diet up until the procedure"},{k:"B",t:"Take all routine medications, including anticoagulants, without any changes"},{k:"C",t:"There is no need to disclose current medications"},{k:"D",t:"Complete the prescribed bowel preparation and remain NPO as instructed before the procedure"}],
 correct:"D",
 explain:{concept:"Pre-procedure preparation",
   why:["Adequate bowel preparation and appropriate NPO status are essential for procedure safety and visualization during colonoscopy."],
   wrong:{A:"A normal diet would leave stool in the colon, preventing adequate visualization.",C:"All current medications must be disclosed, especially anticoagulants, which may need to be held before the procedure.",B:"Anticoagulants are often held before procedures with bleeding risk, per provider instruction — this is not decided by the client without provider input."},
   quick:"Any invasive procedure prep = bowel prep as ordered + NPO status confirmed + full medication reconciliation (especially anticoagulants) + informed consent verified."}},

{id:"RRP-5",category:"rrp",type:"single",subtopic:"ABG interpretation",
 stem:"A client's ABG results are: pH 7.28, PaCO2 55 mmHg, HCO3 24 mEq/L. How should the RN interpret this result?",
 options:[{k:"A",t:"Respiratory alkalosis"},{k:"B",t:"Metabolic alkalosis"},{k:"C",t:"Respiratory acidosis"},{k:"D",t:"Metabolic acidosis"}],
 correct:"C",
 explain:{concept:"ABG interpretation",
   why:["Low pH (<7.35) with elevated PaCO2 (>45) and normal HCO3 indicates an uncompensated respiratory acidosis, typically from hypoventilation (e.g., COPD exacerbation, respiratory depression)."],
   wrong:{A:"Respiratory alkalosis would show an elevated pH and low PaCO2, the opposite of these findings.",D:"Metabolic acidosis would show a low HCO3, which is normal here.",B:"Metabolic alkalosis would show an elevated pH and elevated HCO3."},
   quick:"ROME: Respiratory = Opposite (pH and CO2 move opposite directions), Metabolic = Equal (pH and HCO3 move the same direction)."}},

{id:"RRP-6",category:"rrp",type:"single",subtopic:"Blood transfusion reaction",
 stem:"Ten minutes into a blood transfusion, a client develops chills, fever, and lower back pain. What is the RN's priority action?",
 options:[{k:"A",t:"Slow the infusion rate and monitor"},{k:"B",t:"Administer acetaminophen and continue the transfusion"},{k:"C",t:"Stop the transfusion immediately, keep the line open with normal saline, and notify the provider"},{k:"D",t:"Document the finding and reassess in 30 minutes"}],
 correct:"C",
 explain:{concept:"Acute transfusion reaction management",
   why:["Fever, chills, and back pain suggest a possible acute hemolytic or febrile transfusion reaction; the transfusion must be stopped immediately, the line kept patent with normal saline (using new tubing), and the provider and blood bank notified right away."],
   wrong:{A:"Slowing but continuing the transfusion still exposes the client to further blood product during a possible serious reaction.",B:"Continuing the transfusion during a suspected reaction is unsafe.",D:"Waiting to reassess delays critical intervention during a potential emergency."},
   quick:"Suspected transfusion reaction = STOP the transfusion first, keep the vein open with NS via new tubing, then notify the provider and follow facility reaction protocol."}},

{id:"RRP-7",category:"rrp",type:"single",subtopic:"Life-threatening dysrhythmia",
 stem:"A client's cardiac monitor shows ventricular fibrillation and the client is unresponsive with no pulse. What is the priority nursing action?",
 options:[{k:"A",t:"Begin CPR and prepare for immediate defibrillation"},{k:"B",t:"Administer oral antiarrhythmic medication"},{k:"C",t:"Notify the family before taking any action"},{k:"D",t:"Reposition the client and recheck the monitor in 5 minutes"}],
 correct:"A",
 explain:{concept:"Emergency response — pulseless V-fib",
   why:["Pulseless ventricular fibrillation is a cardiac arrest emergency requiring immediate CPR and defibrillation per ACLS protocol — every minute of delay significantly reduces survival."],
   wrong:{B:"Oral medications are inappropriate and far too slow for this emergency.",D:"Delaying intervention in a pulseless client is dangerous and can be fatal.",C:"Notifying family is not the priority during an active life-threatening emergency."},
   quick:"Pulseless V-fib/V-tach = immediate CPR + defibrillation (shockable rhythms). Time to defibrillation is the single biggest factor in survival."}},

{id:"RRP-8",category:"rrp",type:"single",subtopic:"Anticoagulant hold before surgery",
 stem:"A client scheduled for surgery in the morning is currently taking warfarin. What is the priority nursing action?",
 options:[{k:"A",t:"Assume the medication should be held without checking orders"},{k:"B",t:"Double the dose to 'catch up' before surgery"},{k:"C",t:"Verify the provider's orders regarding holding warfarin and confirm the most recent INR result"},{k:"D",t:"Administer the scheduled dose of warfarin as usual"}],
 correct:"C",
 explain:{concept:"Pre-operative anticoagulant management",
   why:["Anticoagulants are often held before surgery to reduce bleeding risk, but the specific timing and hold instructions must come from the provider's order, along with confirming a current INR to assess bleeding risk."],
   wrong:{D:"Administering warfarin without checking hold orders could increase surgical bleeding risk.",A:"Assuming without verifying orders is unsafe nursing practice.",B:"Doubling a dose is never appropriate and would dangerously increase bleeding risk."},
   quick:"Never assume — always verify specific hold/bridge orders for anticoagulants before any procedure, and confirm the most recent relevant lab value (INR, aPTT, etc.)."}},

{id:"RRP-9",category:"rrp",type:"sata",subtopic:"VTE risk factors — SATA",
 stem:"Which factors increase a client's risk for venous thromboembolism (VTE)? Select all that apply.",
 options:[{k:"A",t:"Prolonged immobility"},{k:"B",t:"Obesity"},{k:"C",t:"Cigarette smoking"},{k:"D",t:"Frequent ambulation"},{k:"E",t:"Recent major surgery"},{k:"F",t:"Oral contraceptive use"}],
 correct:["A","B","C","E","F"],
 explain:{concept:"VTE risk factor identification",
   why:["Immobility, surgery, estrogen-containing contraceptives, smoking, and obesity are all well-established VTE risk factors that increase venous stasis, vessel injury, or hypercoagulability (Virchow's triad)."],
   wrong:{D:"Frequent ambulation reduces VTE risk by promoting venous return — it is protective, not a risk factor."},
   quick:"VTE risk = Virchow's triad: venous stasis (immobility) + vessel injury (surgery) + hypercoagulability (contraceptives, smoking, obesity, cancer)."}},

{id:"RRP-10",category:"rrp",type:"single",subtopic:"Compartment syndrome",
 stem:"A client with a new leg cast reports severe pain unrelieved by opioids, along with pallor and diminished pulses in the affected limb. The RN should suspect which complication?",
 options:[{k:"A",t:"Expected muscle soreness"},{k:"B",t:"Compartment syndrome"},{k:"C",t:"Normal post-casting discomfort"},{k:"D",t:"Superficial skin irritation from the cast"}],
 correct:"B",
 explain:{concept:"Compartment syndrome — the 6 P's",
   why:["Pain out of proportion to injury/unrelieved by opioids, pallor, and diminished pulses are hallmark early signs of compartment syndrome, a limb-threatening emergency requiring immediate provider notification."],
   wrong:{C:"Normal post-casting discomfort should respond to ordered analgesics and not include vascular changes.",D:"Skin irritation would not cause pulselessness or pain unrelieved by opioids.",A:"Expected soreness does not present with vascular compromise findings."},
   quick:"Compartment syndrome — the 6 P's: Pain (out of proportion), Pallor, Paresthesia, Pulselessness, Poikilothermia (cold), Paralysis. Pain unrelieved by opioids is an early red flag — don't wait for all 6 P's to act."}},

{id:"PA-1",category:"pa",type:"single",subtopic:"Myocardial infarction",
 stem:"A 68-year-old female client with diabetes reports vague fatigue, nausea, and mild jaw discomfort. Vital signs are stable. What should the RN suspect and prioritize?",
 options:[{k:"A",t:"Possible atypical myocardial infarction presentation; obtain a 12-lead ECG and notify the provider immediately"},{k:"B",t:"Anxiety; offer reassurance and reassess in 2 hours"},{k:"C",t:"Gastrointestinal upset; offer an antacid"},{k:"D",t:"Normal aging discomfort; no action needed"}],
 correct:"A",
 explain:{concept:"Atypical MI presentation",
   why:["Women, older adults, and clients with diabetes often present with atypical MI symptoms (fatigue, nausea, jaw/back discomfort) rather than classic crushing chest pain — this requires immediate cardiac workup, not dismissal."],
   wrong:{C:"Assuming GI cause without cardiac workup risks missing a life-threatening MI.",B:"Attributing symptoms to anxiety without ruling out cardiac cause is unsafe.",D:"These symptoms are not normal aging and require prompt evaluation."},
   quick:"Atypical MI presentation is COMMON in women, older adults, and diabetics — vague fatigue/nausea/jaw pain still warrants an immediate ECG and cardiac workup."}},

{id:"PA-2",category:"pa",type:"single",subtopic:"DKA",
 stem:"A client with type 1 diabetes presents with Kussmaul respirations, fruity breath odor, blood glucose of 480 mg/dL, and dehydration. What is the priority initial intervention?",
 options:[{k:"A",t:"Begin IV isotonic fluid resuscitation as ordered"},{k:"B",t:"Administer a large bolus of subcutaneous insulin immediately"},{k:"C",t:"Administer oral glucose tablets"},{k:"D",t:"Restrict all fluids until glucose normalizes"}],
 correct:"A",
 explain:{concept:"Diabetic ketoacidosis (DKA) management priority",
   why:["The priority in DKA is IV isotonic fluid resuscitation first to correct severe dehydration and improve perfusion; IV (not subcutaneous) insulin is typically started shortly after, per protocol, once fluids are underway and potassium is checked."],
   wrong:{B:"Subcutaneous insulin is not used in DKA due to poor absorption from dehydration; IV insulin infusion is standard, and insulin is not the very first action before fluids.",D:"Restricting fluids in a severely dehydrated client is dangerous and incorrect.",C:"The client already has hyperglycemia; oral glucose would worsen the condition."},
   quick:"DKA priority sequence: IV fluids first → then IV insulin (regular, continuous infusion) → closely monitor potassium (insulin drives K+ into cells, risking hypokalemia)."}},

{id:"PA-3",category:"pa",type:"single",subtopic:"Sepsis",
 stem:"A client shows signs of early sepsis: temperature 101.8°F (38.8°C), heart rate 118, respiratory rate 24, and confusion. What is the priority nursing action?",
 options:[{k:"A",t:"Obtain blood cultures before starting antibiotics, then administer broad-spectrum antibiotics as ordered within the recommended time frame"},{k:"B",t:"Administer broad-spectrum antibiotics before obtaining any cultures"},{k:"C",t:"Wait for culture results before starting any treatment"},{k:"D",t:"Administer an antipyretic only and reassess in 4 hours"}],
 correct:"A",
 explain:{concept:"Sepsis bundle — sequence of care",
   why:["Blood cultures should be drawn before antibiotics are started (to accurately identify the organism), but antibiotic administration should not be delayed — current sepsis bundles emphasize antibiotics within 1 hour of recognition."],
   wrong:{B:"Giving antibiotics before cultures can prevent identification of the causative organism.",C:"Waiting for culture results (which take 24–72 hours) dangerously delays life-saving treatment.",D:"Antipyretics alone do not address the underlying infection and are not the priority sepsis intervention."},
   quick:"Sepsis bundle: draw cultures FIRST, then give broad-spectrum antibiotics within 1 hour — don't delay antibiotics waiting for results, but don't skip cultures either."}},

{id:"PA-4",category:"pa",type:"single",subtopic:"Stroke — FAST / tPA window",
 stem:"A client arrives at the ED with sudden facial droop, slurred speech, and left arm weakness that began 90 minutes ago. What is the priority nursing action?",
 options:[{k:"A",t:"Schedule an MRI for the next day"},{k:"B",t:"Administer aspirin immediately without imaging"},{k:"C",t:"Wait for the family to arrive before starting any workup"},{k:"D",t:"Obtain an immediate non-contrast CT scan of the head and determine tPA eligibility"}],
 correct:"D",
 explain:{concept:"Acute ischemic stroke — time-critical intervention",
   why:["A non-contrast CT scan must be obtained immediately to rule out hemorrhagic stroke before any thrombolytic therapy; tPA is generally most effective within a 3–4.5 hour window from symptom onset, making rapid imaging and assessment critical ('time is brain')."],
   wrong:{C:"Waiting for family delays time-critical stroke treatment.",B:"Aspirin is contraindicated before ruling out hemorrhagic stroke via imaging, since it could worsen bleeding.",A:"Delaying imaging until the next day would place the client far outside the treatment window."},
   quick:"Stroke = 'Time is brain.' Immediate non-contrast CT to rule out hemorrhage BEFORE any antiplatelet/thrombolytic therapy. tPA window ≈ 3–4.5 hours from symptom onset."}},

{id:"PA-5",category:"pa",type:"single",subtopic:"Hypovolemic shock",
 stem:"A client with active GI bleeding has a blood pressure of 84/50 mmHg, heart rate of 128, and cool clammy skin. What is the priority nursing intervention?",
 options:[{k:"A",t:"Initiate IV fluid resuscitation with isotonic fluids as ordered and prepare for possible blood transfusion"},{k:"B",t:"Encourage oral fluids only"},{k:"C",t:"Restrict IV fluids to avoid overload"},{k:"D",t:"Elevate the head of the bed to 90 degrees"}],
 correct:"A",
 explain:{concept:"Hypovolemic shock management",
   why:["Hypotension, tachycardia, and cool clammy skin indicate hypovolemic shock from blood loss; the priority is rapid isotonic IV fluid resuscitation and preparation for blood products to restore circulating volume and perfusion."],
   wrong:{D:"An upright position can worsen hypotension and cerebral perfusion in shock; a flat or modified Trendelenburg position is often preferred.",C:"Restricting fluids in hypovolemic shock is dangerous and worsens perfusion.",B:"Oral fluids are inadequate and unsafe given hemodynamic instability and potential GI source."},
   quick:"Hypovolemic shock = restore volume FAST (isotonic IV fluids ± blood products) and identify/stop the source of loss."}},

{id:"PA-6",category:"pa",type:"single",subtopic:"Hyperkalemia emergency management",
 stem:"A client with acute kidney injury has a potassium level of 6.8 mEq/L with peaked T waves on ECG. Which intervention would the RN anticipate first?",
 options:[{k:"A",t:"Administer a potassium supplement"},{k:"B",t:"Withhold all treatment until the next lab draw"},{k:"C",t:"Administer IV calcium gluconate to stabilize the cardiac membrane"},{k:"D",t:"Encourage a high-potassium diet"}],
 correct:"C",
 explain:{concept:"Emergency hyperkalemia management",
   why:["IV calcium gluconate is given first in severe/symptomatic hyperkalemia to stabilize the cardiac cell membrane and reduce arrhythmia risk; it does not lower potassium but protects the heart while other measures (insulin/glucose, kayexalate, dialysis) act to actually lower the potassium level."],
   wrong:{D:"A high-potassium diet would worsen an already dangerous hyperkalemia.",A:"Giving more potassium would be directly harmful and contraindicated.",B:"Withholding treatment with ECG changes present is unsafe — this is an emergency."},
   quick:"Severe hyperkalemia with ECG changes: Calcium gluconate FIRST (protects the heart) → then insulin+glucose and/or kayexalate/dialysis to actually lower the potassium level."}},

{id:"PA-7",category:"pa",type:"single",subtopic:"COPD oxygen therapy",
 stem:"A client with severe COPD (chronic CO2 retainer) is receiving supplemental oxygen. Which finding requires immediate RN follow-up?",
 options:[{k:"A",t:"Oxygen saturation of 99% on a high-flow, high-concentration device"},{k:"B",t:"Respiratory rate of 18 breaths/min"},{k:"C",t:"Client resting comfortably in bed"},{k:"D",t:"Oxygen saturation of 90%"}],
 correct:"A",
 explain:{concept:"Oxygen therapy in chronic CO2 retainers",
   why:["In clients who chronically retain CO2, their respiratory drive relies on relative hypoxemia rather than CO2 levels; administering high-flow oxygen that raises saturation too high (near 100%) can blunt this drive and lead to worsening hypoventilation and CO2 narcosis."],
   wrong:{D:"An oxygen saturation around 88–92% is often the appropriate target range for this population, not a concerning finding.",B:"A respiratory rate of 18 is within normal limits.",C:"A comfortable, resting client is a reassuring finding, not a concern."},
   quick:"Chronic CO2 retainers (severe COPD): target SpO2 ≈ 88–92%, titrate oxygen carefully — over-oxygenating can suppress their hypoxic respiratory drive."}},

{id:"PA-8",category:"pa",type:"single",subtopic:"Acute kidney injury monitoring",
 stem:"A client is diagnosed with acute kidney injury and is in the oliguric phase. Which finding is the priority for the RN to monitor?",
 options:[{k:"A",t:"Serum potassium level and fluid balance"},{k:"B",t:"Sleep quality"},{k:"C",t:"Appetite for solid foods only"},{k:"D",t:"Hair growth pattern"}],
 correct:"A",
 explain:{concept:"Acute kidney injury — oliguric phase priorities",
   why:["During the oliguric phase, the kidneys cannot adequately excrete potassium or fluid, creating high risk for life-threatening hyperkalemia and fluid overload — these must be monitored closely."],
   wrong:{D:"Not a relevant priority finding in AKI.",C:"Appetite may be affected but is not the priority safety concern.",B:"Sleep quality is not the priority physiological monitoring focus during this phase."},
   quick:"AKI oliguric phase = high risk for hyperkalemia + fluid overload. Diuretic phase (later) = high risk for hypokalemia + dehydration from massive urine output. Know both phases."}},

{id:"PA-9",category:"pa",type:"sata",subtopic:"Increased intracranial pressure — SATA",
 stem:"Which findings are consistent with increased intracranial pressure (ICP)? Select all that apply.",
 options:[{k:"A",t:"Pupillary changes (sluggish or fixed/dilated)"},{k:"B",t:"Hypotension with tachycardia"},{k:"C",t:"Widened pulse pressure (increasing systolic, stable/decreasing diastolic)"},{k:"D",t:"Irregular respiratory pattern"},{k:"E",t:"Bradycardia"},{k:"F",t:"Decreasing level of consciousness"}],
 correct:["A","C","D","E","F"],
 explain:{concept:"Increased ICP — Cushing's triad and early warning signs",
   why:["Cushing's triad (widened pulse pressure, bradycardia, irregular respirations) is a late, ominous sign of increased ICP; decreasing LOC is actually the EARLIEST indicator, and pupillary changes reflect brainstem/cranial nerve compression."],
   wrong:{B:"Increased ICP classically causes hypertension (not hypotension) with bradycardia (not tachycardia) — the opposite of this option."},
   quick:"Earliest sign of increased ICP = change in level of consciousness (before vital sign changes appear). Cushing's triad (widened pulse pressure + bradycardia + irregular respirations) is a LATE, life-threatening sign."}},

{id:"PA-10",category:"pa",type:"single",subtopic:"Burns — airway priority",
 stem:"A client is brought to the ED after a house fire with facial soot, singed nasal hair, and a hoarse voice. What is the RN's priority concern?",
 options:[{k:"A",t:"Possible inhalation injury and impending airway compromise"},{k:"B",t:"Pain management as the first priority"},{k:"C",t:"Cosmetic appearance of facial burns"},{k:"D",t:"Immediate initiation of the Parkland formula fluid calculation before any airway assessment"}],
 correct:"A",
 explain:{concept:"Burn injury — airway priority",
   why:["Facial soot, singed nasal hair, and hoarseness are red flags for inhalation injury, which can cause rapid, life-threatening airway edema and obstruction — airway is always the priority ('A' in ABCs), even before fluid resuscitation calculations."],
   wrong:{C:"Cosmetic concerns are never the priority in an acute trauma/burn situation.",D:"Fluid resuscitation (Parkland formula) is important but follows airway securement in the priority sequence.",B:"Pain management, while important, is secondary to securing a patent airway."},
   quick:"Burn priority = Airway first (watch for soot, singed hairs, hoarseness = inhalation injury red flags), THEN fluid resuscitation (Parkland formula), THEN wound care/pain management."}}

];

/* =========================================================================
   QUESTION BANK LOADER — pulls live from Supabase's `questions` table.
   Falls back to FALLBACK_QUESTIONS only if Supabase isn't configured yet
   or the fetch fails, so the app never shows a blank screen.
   ========================================================================= */
async function loadQuestionBank(){
  if(sbClient){
    try{
      const { data, error } = await sbClient.from("questions").select("*");
      if(error) throw error;
      if(data && data.length){
        return data.map(r=>({
          id:r.id, category:r.category, type:r.type, subtopic:r.subtopic,
          stem:r.stem, options:r.options, correct:r.correct, explain:r.explain
        }));
      }
    }catch(e){
      console.error("Couldn't load question bank from Supabase — using local fallback.", e);
    }
  }
  return FALLBACK_QUESTIONS;
}

const state = {
  view:"home",            // home | quiz | recap | results
  feedbackMode:"immediate", // "immediate" | "end" — chosen fresh each time a quiz starts
  studentName:"",  // legacy; display name now comes from authState.user or defaults to Guest
  quizTitle:"",
  quizKey:null,            // category key or "full-N"
  questions:[],
  index:0,
  answers:[],              // {qId, status:"correct"|"incorrect"|"skipped", selected}
  locked:false,
  selectedSata:new Set(),
  sessionCorrect:0,
  sessionTotal:0,
  testProgress:{}          // testNumber -> {status, score}
};

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffle(arr){ return seededShuffle(arr, Math.floor(Math.random()*1e9)); }

function buildFullTest(testNumber){
  const pool = QUESTIONS.length;
  const targetTotal = Math.min(105, pool); // scales down honestly if bank is smaller than 105
  const seed = testNumber*7919 + 13;
  let selected = [];
  CATEGORIES.forEach((c,ci)=>{
    const catPool = seededShuffle(QUESTIONS.filter(q=>q.category===c.key), seed + ci*101 + 7);
    const target = Math.round(targetTotal * c.weight/100);
    selected.push(...catPool.slice(0, Math.min(target, catPool.length)));
  });
  const usedIds = new Set(selected.map(q=>q.id));
  if(selected.length < targetTotal){
    const leftover = seededShuffle(QUESTIONS.filter(q=>!usedIds.has(q.id)), seed+999);
    selected.push(...leftover.slice(0, targetTotal-selected.length));
  }
  return seededShuffle(selected, seed+555);
}

let pendingStart = null;
function startTopicQuiz(catKey){
  pendingStart = {kind:"topic", key:catKey};
  document.getElementById("quizOptionsTitle").textContent = CAT[catKey].label;
  document.getElementById("quizOptionsOverlay").style.display = "flex";
}
function startFullTest(n){
  pendingStart = {kind:"full", key:n};
  document.getElementById("quizOptionsTitle").textContent = "Full Length Test "+n;
  document.getElementById("quizOptionsOverlay").style.display = "flex";
}
function closeQuizOptionsModal(){
  document.getElementById("quizOptionsOverlay").style.display = "none";
  pendingStart = null;
}
function confirmQuizMode(mode){
  state.feedbackMode = mode;
  const p = pendingStart;
  closeQuizOptionsModal();
  if(!p) return;
  if(p.kind==="topic") actuallyStartTopicQuiz(p.key);
  else actuallyStartFullTest(p.key);
}

function actuallyStartTopicQuiz(catKey){
  const c = CAT[catKey];
  const qs = shuffle(QUESTIONS.filter(q=>q.category===catKey));
  state.view="quiz"; state.quizKey=catKey; state.quizTitle=c.label;
  state.questions=qs; state.index=0; state.answers=[]; state.locked=false; state.selectedSata=new Set();
  renderTopicPills(); renderRail();
  renderQuestion();
}
function actuallyStartFullTest(n){
  const qs = buildFullTest(n);
  state.view="quiz"; state.quizKey="full-"+n; state.quizTitle="Full Length Test "+n;
  state.questions=qs; state.index=0; state.answers=[]; state.locked=false; state.selectedSata=new Set();
  state.testProgress[n] = {status:"progress"};
  renderTopicPills(); renderRail();
  renderQuestion();
}

function renderQuestion(){
  if(state.index >= state.questions.length){ return showResults(); }
  if(state.index>0 && state.index % 10 === 0 && !state._recapShown){
    state._recapShown = true;
    return renderRecap();
  }
  state._recapShown = false;
  state.locked = false; state.selectedSata = new Set();
  const q = state.questions[state.index];
  const c = CAT[q.category];
  const pct = Math.round((state.index/state.questions.length)*100);
  const isSata = q.type==="sata";
  document.getElementById("main").innerHTML = `
    <div class="quiz-header">
      <span class="quiz-title">${state.quizTitle}</span>
      <span class="quiz-title">Question ${state.index+1} of ${state.questions.length}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <span class="cat-tag" style="background:${c.color}">${c.label} · ${q.subtopic}</span>
    <p class="stem">${q.stem}</p>
    ${isSata ? `<div class="sata-note">SELECT ALL THAT APPLY</div>`:""}
    <div class="options" id="optionsWrap">
      ${q.options.map(o=>`
        <button class="opt ${isSata?"sata selectable":""}" data-key="${o.k}" onclick="${isSata?`toggleSata('${o.k}')`:`answerSingle('${o.k}')`}">
          <span class="key">${o.k}</span><span>${o.t}</span>
        </button>`).join("")}
    </div>
    ${isSata ? `<div class="submit-row"><button class="btn" onclick="submitSata()">Check Answer</button></div>` : ""}
    <div class="nav-row" style="margin-top:2px;">
      <button class="link-btn" style="color:var(--ink-soft);" onclick="skipQuestion()">Skip this question (scores 0) →</button>
    </div>
    <div id="feedbackZone"></div>
  `;
}

function renderRecap(){
  state.view="recap";
  const last10 = state.answers.slice(-10);
  const items = last10.map((a,i)=>`
    <div class="recap-item"><span class="num mono">${i+1}</span>
      <span><b>${a.subtopic}</b> — ${a.concept}</span>
    </div>`).join("");
  const correctCount = last10.filter(a=>a.status==="correct").length;
  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="recap-icon">⚡</div>
      <h2 style="margin:0 0 4px;">Quick Check — last 10 questions</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 4px;">You got ${correctCount} of ${last10.length} correct. Key concepts just covered:</p>
      <div class="recap-list">${items}</div>
      <button class="btn" onclick="continueAfterRecap()">Continue</button>
    </div>
  `;
}
function continueAfterRecap(){
  state.view="quiz";
  renderQuestion();
}

function answerSingle(key){
  if(state.locked) return;
  state.locked = true;
  const q = state.questions[state.index];
  const status = key === q.correct ? "correct" : "incorrect";
  recordAnswer(q, status, key);
  if(state.feedbackMode==="immediate"){
    document.querySelectorAll("#optionsWrap .opt").forEach(btn=>{
      btn.classList.add("locked");
      const k = btn.getAttribute("data-key");
      if(k === q.correct) btn.classList.add("correct");
      else if(k === key) btn.classList.add("incorrect");
    });
    renderFeedback(q, status);
  } else {
    document.querySelectorAll("#optionsWrap .opt").forEach(btn=>{
      btn.classList.add("locked");
      if(btn.getAttribute("data-key")===key) btn.classList.add("chosen");
    });
    renderDeferredFeedback();
  }
}
function toggleSata(key){
  if(state.locked) return;
  const btn = document.querySelector(`#optionsWrap .opt[data-key="${key}"]`);
  if(state.selectedSata.has(key)){ state.selectedSata.delete(key); btn.classList.remove("chosen"); }
  else { state.selectedSata.add(key); btn.classList.add("chosen"); }
}
function submitSata(){
  if(state.locked) return;
  if(state.selectedSata.size===0) return;
  state.locked = true;
  const q = state.questions[state.index];
  const chosen = Array.from(state.selectedSata).sort();
  const correctSet = q.correct.slice().sort();
  const status = JSON.stringify(chosen)===JSON.stringify(correctSet) ? "correct" : "incorrect";
  recordAnswer(q, status, chosen);
  if(state.feedbackMode==="immediate"){
    document.querySelectorAll("#optionsWrap .opt").forEach(btn=>{
      btn.classList.add("locked");
      const k = btn.getAttribute("data-key");
      const isCorrectKey = q.correct.includes(k);
      const wasChosen = chosen.includes(k);
      if(isCorrectKey && wasChosen) btn.classList.add("correct");
      else if(isCorrectKey && !wasChosen) btn.classList.add("missed");
      else if(!isCorrectKey && wasChosen) btn.classList.add("incorrect");
    });
    renderFeedback(q, status);
  } else {
    document.querySelectorAll("#optionsWrap .opt").forEach(btn=>btn.classList.add("locked"));
    renderDeferredFeedback();
  }
}

function skipQuestion(){
  if(state.locked) return;
  state.locked = true;
  const q = state.questions[state.index];
  recordAnswer(q, "skipped", null);
  document.querySelectorAll("#optionsWrap .opt").forEach(btn=>btn.classList.add("locked"));
  const isLast = state.index === state.questions.length-1;
  document.getElementById("feedbackZone").innerHTML = `
    <div class="feedback-banner" style="background:var(--gold-100);color:var(--gold);">
      <span class="stamp">⏭ SKIPPED</span>
      <span>No points for this one — worth 0. Correct answer isn't shown, but you can review it later.</span>
    </div>
    ${navRow(isLast)}
  `;
}

function navRow(isLast){
  const remaining = state.questions.length - state.answers.length;
  return `
    <div class="nav-row">
      <button class="btn secondary" onclick="goHome()">Exit to dashboard</button>
      <div style="display:flex;gap:8px;">
        ${!isLast ? `<button class="btn secondary" style="border-color:var(--incorrect);color:var(--incorrect);" onclick="finishTestNow()">Finish test now (${remaining} left → skipped)</button>` : ""}
        <button class="btn" onclick="nextQuestion()">${isLast? "See results →" : "Next question →"}</button>
      </div>
    </div>`;
}

function finishTestNow(){
  const remaining = state.questions.length - state.answers.length;
  if(remaining > 0 && !confirm(`Finish now? The remaining ${remaining} question${remaining>1?"s":""} will be marked as skipped (0 points each).`)) return;
  for(let i=state.answers.length; i<state.questions.length; i++){
    const q = state.questions[i];
    state.answers.push({qId:q.id, status:"skipped", selected:null, subtopic:q.subtopic, concept:q.explain.concept, category:q.category});
  }
  state.sessionTotal += remaining;
  renderSessionScore();
  showResults();
}

function renderDeferredFeedback(){
  const isLast = state.index === state.questions.length-1;
  document.getElementById("feedbackZone").innerHTML = `
    <div class="feedback-banner" style="background:var(--teal-100);color:var(--teal-900);">
      <span class="stamp">RECORDED</span>
      <span>Answer saved — you'll see correct answers and rationales in your full review after this test.</span>
    </div>
    ${navRow(isLast)}
  `;
}

function recordAnswer(q, status, selected){
  state.answers.push({qId:q.id, status, selected, subtopic:q.subtopic, concept:q.explain.concept, category:q.category});
  state.sessionTotal++; if(status==="correct") state.sessionCorrect++;
  renderSessionScore();
}

function renderFeedback(q, status){
  const correctFlag = status==="correct";
  const wrongList = Object.entries(q.explain.wrong||{}).map(([k,txt])=>
    `<div class="why-wrong-item"><b>${k}</b>${txt}</div>`).join("");
  const isLast = state.index === state.questions.length-1;
  const html = `
    <div class="feedback-banner ${correctFlag?"good":"bad"}">
      <span class="stamp">${correctFlag?"✓ CORRECT (+2)":"✗ INCORRECT (−0.5)"}</span>
      <span>${correctFlag? "Nice — that's the concept locked in." : "Let's break down what was missed."}</span>
    </div>
    <div class="explain">
      <div class="explain-block">
        <h4>Concept tested</h4>
        <div style="font-size:13.5px;">${q.explain.concept}</div>
      </div>
      <div class="explain-block">
        <h4>Why the correct answer is right</h4>
        <ul class="bullets">${q.explain.why.map(w=>`<li>${w}</li>`).join("")}</ul>
      </div>
      ${wrongList ? `<div class="explain-block"><h4>Why the other options are wrong</h4>${wrongList}</div>` : ""}
      <div class="explain-block">
        <div class="quickcheck"><span class="lightning">⚡</span><span>${q.explain.quick}</span></div>
      </div>
    </div>
    ${navRow(isLast)}
  `;
  document.getElementById("feedbackZone").innerHTML = html;
}

function nextQuestion(){
  state.index++;
  renderQuestion();
}

function showResults(){
  state.view="results";
  const total = state.questions.length;
  const correct = state.answers.filter(a=>a.status==="correct").length;
  const incorrect = state.answers.filter(a=>a.status==="incorrect").length;
  const skipped = state.answers.filter(a=>a.status==="skipped").length;
  const pct = total ? Math.round((correct/total)*100) : 0;

  // Weighted scoring: +2 per correct, -0.5 per incorrect, 0 per skipped
  const weightedScore = Math.round((correct*2 - incorrect*0.5) * 10) / 10;
  const weightedMax = total*2;

  if(state.quizKey && state.quizKey.startsWith("full-")){
    const n = parseInt(state.quizKey.split("-")[1]);
    state.testProgress[n] = {status:"done", score:pct};
    renderRail();
  }

  const byCat = {};
  state.questions.forEach((q,i)=>{
    byCat[q.category] = byCat[q.category] || {correct:0,total:0,skipped:0};
    byCat[q.category].total++;
    const a = state.answers[i];
    if(a && a.status==="correct") byCat[q.category].correct++;
    if(a && a.status==="skipped") byCat[q.category].skipped++;
  });
  const catRows = Object.entries(byCat).map(([key,v])=>{
    const c = CAT[key];
    const p = Math.round((v.correct/v.total)*100);
    return `<div class="weight-row">
      <div class="weight-label">${c.label}${v.skipped? `<div class="mono" style="font-size:10px;color:var(--gold);">${v.skipped} skipped</div>`:""}</div>
      <div class="weight-bar-track"><div class="weight-bar-fill" style="width:${p}%;background:${c.color}"></div></div>
      <div class="weight-pct mono">${p}%</div>
      <div class="weight-cov mono">${v.correct}/${v.total}</div>
    </div>`;
  }).join("");

  // Full per-question review — every question, including skipped
  const statusIcon = {correct:"✓", incorrect:"✗", skipped:"⏭"};
  const reviewHtml = state.questions.map((q,i)=>{
    const a = state.answers[i];
    const status = a ? a.status : "skipped";
    const wrongList = Object.entries(q.explain.wrong||{}).map(([k,txt])=>
      `<div class="why-wrong-item"><b>${k}</b>${txt}</div>`).join("");
    const yourAnswer = (a && a.selected!=null) ? (Array.isArray(a.selected) ? a.selected.join(", ") : a.selected) : "— (skipped)";
    const correctAnswer = Array.isArray(q.correct) ? q.correct.join(", ") : q.correct;
    return `
    <details class="missed-item">
      <summary><span>${statusIcon[status]} ${q.subtopic} — ${q.explain.concept}</span><span class="arrow">›</span></summary>
      <p class="stem" style="font-size:14px;">${q.stem}</p>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;" class="mono">Your answer: ${yourAnswer} &nbsp;·&nbsp; Correct: ${correctAnswer}</p>
      <ul class="bullets">${q.explain.why.map(w=>`<li>${w}</li>`).join("")}</ul>
      ${wrongList ? `<div class="explain-block">${wrongList}</div>` : ""}
      <div class="quickcheck"><span class="lightning">⚡</span><span>${q.explain.quick}</span></div>
    </details>`;
  }).join("");

  document.getElementById("main").innerHTML = `
    <div class="card">
      <div class="score-hero"><span class="score-big" style="color:${weightedScore>=weightedMax*0.7?'var(--correct)':weightedScore>=weightedMax*0.5?'var(--gold)':'var(--incorrect)'}">${weightedScore}</span><span class="score-sub">of ${weightedMax} pts — ${state.quizTitle}</span></div>
      <p class="mono" style="font-size:13px;color:var(--ink-soft);margin:2px 0 0;">${correct} correct · ${incorrect} incorrect · ${skipped} skipped &nbsp;(${pct}% accuracy) &nbsp;·&nbsp; scoring: +2 correct, −0.5 incorrect, 0 skipped</p>
      <div id="saveStatus"><span class="save-status off">Saving...</span></div>
      <div class="cta-row">
        <button class="btn" onclick="state.quizKey && state.quizKey.startsWith('full-') ? startFullTest(parseInt(state.quizKey.split('-')[1])) : startTopicQuiz(state.quizKey)">Retake</button>
        <button class="btn secondary" onclick="goHome()">Back to dashboard</button>
      </div>
    </div>
    <div class="card">
      <h3>Score by category</h3>
      ${catRows}
    </div>
    <div class="card">
      <h3>Full review — every question (${total})</h3>
      ${reviewHtml}
    </div>
  `;

  const missedSummary = state.questions
    .map((q,i)=>({q,a:state.answers[i]}))
    .filter(x=>x.a && x.a.status==="incorrect")
    .map(({q})=>({subtopic:q.subtopic, concept:q.explain.concept}));

  const record = {
    student_name: state.studentName && state.studentName.trim() ? state.studentName.trim() : "Guest",
    quiz_type: state.quizKey && state.quizKey.startsWith("full-") ? "full" : "topic",
    quiz_title: state.quizTitle,
    category_key: state.quizKey && !state.quizKey.startsWith("full-") ? state.quizKey : null,
    test_number: state.quizKey && state.quizKey.startsWith("full-") ? parseInt(state.quizKey.split("-")[1]) : null,
    score_pct: pct,
    correct_count: correct,
    total_count: total,
    skipped_count: skipped,
    weighted_score: weightedScore,
    weighted_max: weightedMax,
    category_breakdown: byCat,
    missed_concepts: missedSummary
  };
  saveResultToSupabase(record, state.questions, state.answers);
}
