<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCLEX Prep Lab — Clinical Judgment Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#16211C;
    --ink-soft:#4A554C;
    --paper:#F5F6F2;
    --panel:#FFFFFF;
    --line:#DCE1D8;
    --line-soft:#EAEDE6;
    --teal-900:#0B4F45;
    --teal-600:#12786A;
    --teal-100:#E4F0EB;
    --gold:#A9782C;
    --gold-100:#F5EDDC;
    --blue:#2B5A82;
    --correct:#1E7A4C;
    --correct-bg:#E6F3EA;
    --incorrect:#B8402A;
    --incorrect-bg:#FBEAE6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--blue); outline-offset:2px;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:20px;
    padding:14px 20px;background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:6px;flex-shrink:0;cursor:pointer;}
  .brand-mark{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--teal-900);}
  .brand-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--ink-soft);}
  .topic-pills{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:thin;}
  .topic-pills::-webkit-scrollbar{height:5px;}
  .topic-pills::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .pill{
    flex-shrink:0;
    display:flex;align-items:center;gap:7px;
    padding:7px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--paper);font-size:12.5px;font-weight:500;color:var(--ink);
    white-space:nowrap;transition:.15s;
  }
  .pill:hover{border-color:var(--teal-600);}
  .pill.active{background:var(--teal-900);border-color:var(--teal-900);color:#fff;}
  .pill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .pill .wt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.75;}
  .session-score{
    flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:12px;
    background:var(--teal-100);color:var(--teal-900);padding:6px 10px;border-radius:8px;
    border:1px solid var(--line);
  }
  .account-widget{flex-shrink:0;display:flex;align-items:center;gap:8px;}
  .account-pill{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;background:var(--paper);font-size:12.5px;
  }
  .account-pill .who{display:flex;flex-direction:column;line-height:1.25;}
  .account-pill .who b{font-size:12px;}
  .account-pill .who span{font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .link-btn{background:none;border:none;color:var(--blue);font-size:11.5px;font-weight:600;padding:0;text-decoration:underline;}
  .account-btn{
    padding:7px 12px;border-radius:8px;border:1px solid var(--teal-900);background:var(--teal-900);color:#fff;
    font-size:12.5px;font-weight:600;
  }
  .save-status{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 0;
  }
  .save-status.ok{color:var(--correct);}
  .save-status.off{color:var(--ink-soft);}
  .save-status.err{color:var(--incorrect);}

  /* ---------- Auth modal ---------- */
  .auth-overlay{
    position:fixed;inset:0;background:rgba(22,33,28,.45);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .auth-modal{
    background:var(--panel);border-radius:12px;padding:26px 26px 20px;width:100%;max-width:380px;
    position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .auth-close{
    position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;
    color:var(--ink-soft);line-height:1;
  }
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .auth-tab{
    background:none;border:none;padding:8px 4px 10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .auth-tab.active{color:var(--teal-900);border-bottom-color:var(--teal-900);}
  .auth-field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
  .auth-field label{font-size:11.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);}
  .auth-field input{
    border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:13.5px;
    font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
  }
  .auth-field input:focus{outline:none;border-color:var(--teal-600);}
  .auth-error{color:var(--incorrect);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .auth-guest-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-top:14px;text-align:center;}

  /* ---------- ECG strip (signature element) ---------- */
  .ecg-strip{height:20px;background:var(--panel);border-bottom:1px solid var(--line);overflow:hidden;}
  .ecg-strip svg{display:block;width:200%;height:100%;animation:ecgmove 9s linear infinite;}
  @keyframes ecgmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){ .ecg-strip svg{animation:none} }

  /* ---------- Layout ----------test */
  .layout{display:flex;flex:1;min-height:0;}
  .rail{
    width:190px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);padding:16px 12px;
    overflow-y:auto;
  }
  .rail-title{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;
    color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;padding:0 4px;
  }
  .rail-note{font-size:11px;color:var(--ink-soft);padding:0 4px 10px;line-height:1.5;border-bottom:1px dashed var(--line);margin-bottom:10px;}
  .rail-list{display:flex;flex-direction:column;gap:4px;}
  .rail-btn{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    width:100%;text-align:left;padding:8px 9px;border-radius:7px;border:1px solid transparent;
    background:transparent;font-size:12.5px;color:var(--ink);
  }
  .rail-btn:hover{background:var(--paper);border-color:var(--line);}
  .rail-btn.active{background:var(--teal-900);color:#fff;}
  .rail-btn .id{font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
  .rail-btn .status{width:7px;height:7px;border-radius:50%;background:var(--line);flex-shrink:0;}
  .rail-btn .status.done{background:var(--teal-600);}
  .rail-btn .status.progress{background:var(--gold);}

  .main{flex:1;min-width:0;padding:26px 30px 60px;overflow-y:auto;}
  .wrap{max-width:760px;margin:0 auto;}

  /* ---------- Dashboard ---------- */
  .hero h1{font-size:26px;margin:0 0 6px;}
  .hero p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 22px;max-width:560px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .card h3{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .weight-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .weight-row:last-child{border-bottom:none;}
  .weight-label{width:190px;flex-shrink:0;font-size:13px;font-weight:500;}
  .weight-bar-track{flex:1;height:8px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line);}
  .weight-bar-fill{height:100%;border-radius:5px;}
  .weight-pct{width:38px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .weight-cov{width:74px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .bullets{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;color:var(--ink);}
  .bullets li{margin-bottom:4px;}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .btn{
    padding:10px 16px;border-radius:8px;border:1px solid var(--teal-900);
    background:var(--teal-900);color:#fff;font-size:13.5px;font-weight:600;
  }
  .btn.secondary{background:transparent;color:var(--teal-900);}
  .btn:hover{opacity:.9;}

  /* ---------- Quiz ---------- */
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .quiz-title{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .progress-track{height:5px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--teal-600);transition:width .25s;}
  .cat-tag{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:'IBM Plex Mono',monospace;
    padding:3px 9px;border-radius:6px;margin-bottom:12px;color:#fff;
  }
  .stem{font-size:17px;line-height:1.55;margin:0 0 18px;font-weight:500;}
  .sata-note{font-size:12px;color:var(--blue);font-weight:600;margin:-10px 0 14px;font-family:'IBM Plex Mono',monospace;}
  .options{display:flex;flex-direction:column;gap:9px;margin-bottom:6px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    text-align:left;padding:13px 14px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--panel);font-size:14.5px;line-height:1.5;width:100%;color:var(--ink);
    transition:.12s;
  }
  .opt:hover:not(.locked){border-color:var(--teal-600);background:var(--teal-100);}
  .opt .key{
    flex-shrink:0;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-size:12px;font-weight:600;
  }
  .opt.sata .key{border-radius:5px;}
  .opt.correct{border-color:var(--correct);background:var(--correct-bg);}
  .opt.correct .key{border-color:var(--correct);background:var(--correct);color:#fff;}
  .opt.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .opt.incorrect .key{border-color:var(--incorrect);background:var(--incorrect);color:#fff;}
  .opt.missed{border-color:var(--correct);border-style:dashed;}
  .opt.locked{cursor:default;}
  .opt.chosen{border-color:var(--blue);background:var(--teal-100);}
  .opt.selectable.chosen .key{background:var(--blue);border-color:var(--blue);color:#fff;}

  .submit-row{margin:14px 0;}
  .feedback-banner{
    display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:9px;margin:16px 0 14px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
  }
  .feedback-banner.good{background:var(--correct-bg);color:var(--correct);}
  .feedback-banner.bad{background:var(--incorrect-bg);color:var(--incorrect);}
  .stamp{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.05em;
    border:2px solid currentColor;border-radius:5px;padding:3px 9px;transform:rotate(-3deg);
  }

  .explain{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;}
  .explain h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .explain-block{margin-bottom:14px;}
  .explain-block:last-child{margin-bottom:0;}
  .why-wrong-item{font-size:13.5px;line-height:1.6;margin-bottom:6px;}
  .why-wrong-item b{font-family:'IBM Plex Mono',monospace;color:var(--incorrect);margin-right:5px;}
  .quickcheck{
    background:var(--gold-100);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;
    padding:11px 14px;font-size:13.5px;line-height:1.55;display:flex;gap:9px;align-items:flex-start;
  }
  .quickcheck .lightning{flex-shrink:0;font-weight:700;color:var(--gold);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;}

  /* ---------- Recap (quick check interstitial) ---------- */
  .recap-icon{font-size:28px;margin-bottom:8px;}
  .recap-list{display:flex;flex-direction:column;gap:8px;margin:16px 0 22px;}
  .recap-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:9px 12px;background:var(--paper);border-radius:7px;border:1px solid var(--line);}
  .recap-item .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);flex-shrink:0;width:18px;}

  /* ---------- Results ---------- */
  .score-hero{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
  .score-big{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;}
  .score-sub{color:var(--ink-soft);font-size:14px;}
  .missed-item{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:8px;background:var(--panel);}
  .missed-item summary{cursor:pointer;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px;}
  .missed-item summary::-webkit-details-marker{display:none;}
  .missed-item[open] summary{margin-bottom:10px;}
  .missed-item .arrow{transition:.15s;color:var(--ink-soft);}
  .missed-item[open] .arrow{transform:rotate(90deg);}

  @media (max-width:880px){
    .layout{flex-direction:column;}
    .rail{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 14px;max-height:150px;}
    .rail-list{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:4px;}
    .rail-btn{flex-shrink:0;width:auto;}
    .main{padding:20px 16px 50px;}
    .weight-label{width:130px;font-size:12px;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand" id="brandHome" tabindex="0" role="button" aria-label="Go to dashboard">
      <span class="brand-mark">NCLEX</span><span class="brand-sub">PREP LAB</span>
    </div>
    <nav class="topic-pills" id="topicPills" aria-label="Topic area quizzes"></nav>
    <div class="account-widget" id="accountWidget"></div>
    <div class="session-score mono" id="sessionScore">0 / 0 correct</div>
  </header>

  <div class="auth-overlay" id="authOverlay" style="display:none;">
    <div class="auth-modal">
      <button class="auth-close" id="authCloseBtn" aria-label="Close">×</button>
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignIn" onclick="setAuthMode('signin')">Log in</button>
        <button class="auth-tab" id="tabSignUp" onclick="setAuthMode('signup')">Create account</button>
      </div>
      <form id="authForm">
        <div class="auth-field" id="nameFieldWrap" style="display:none;">
          <label for="authName">Full name</label>
          <input id="authName" type="text" autocomplete="name" maxlength="60">
        </div>
        <div class="auth-field">
          <label for="authEmail">Email</label>
          <input id="authEmail" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="authPassword">Password</label>
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" required>
        </div>
        <div id="authError" class="auth-error"></div>
        <button type="submit" class="btn" id="authSubmitBtn" style="width:100%;">Log in</button>
      </form>
      <div class="auth-guest-note">No account needed to practice — close this and you'll continue as a guest. Guest results still save, just without a login to review them later.</div>
    </div>
  </div>

  <div class="auth-overlay" id="quizOptionsOverlay" style="display:none;">
    <div class="auth-modal">
      <button class="auth-close" id="quizOptionsCloseBtn" aria-label="Close">×</button>
      <h3 style="margin:0 0 6px;font-size:16px;" id="quizOptionsTitle">Start quiz</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 18px;">How do you want to see answers?</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn" style="width:100%;text-align:left;" onclick="confirmQuizMode('immediate')">
          Immediately after each question<br><span style="font-weight:400;font-size:11.5px;opacity:.85;">See correct/incorrect + rationale right away — best for learning as you go</span>
        </button>
        <button class="btn secondary" style="width:100%;text-align:left;border-width:1.5px;" onclick="confirmQuizMode('end')">
          Only at the end of the test<br><span style="font-weight:400;font-size:11.5px;opacity:.85;">Answer all questions blind, then review everything at once — closer to real exam conditions</span>
        </button>
      </div>
    </div>
  </div>

  <div class="ecg-strip" aria-hidden="true">
    <svg viewBox="0 0 1000 40" preserveAspectRatio="none">
      <path d="M0,20 L140,20 L160,20 L172,6 L184,34 L196,20 L220,20 L500,20 L640,20 L652,6 L664,34 L676,20 L700,20 L1000,20 M1000,20 L1140,20 L1160,20 L1172,6 L1184,34 L1196,20 L1220,20 L1500,20 L1640,20 L1652,6 L1664,34 L1676,20 L1700,20 L2000,20"
            fill="none" stroke="#12786A" stroke-width="2"/>
    </svg>
  </div>

  <div class="layout">
    <aside class="rail" aria-label="Full-length tests">
      <div class="rail-title">Full-Length Tests</div>
      <div class="rail-note" id="railNote"></div>
      <div class="rail-list" id="railList"></div>
    </aside>
    <main class="main"><div class="wrap" id="main"></div></main>
  </div>

</div>

<script>
/* =========================================================================
   SUPABASE CONFIG — paste your own project's values here.
   Find these in your Supabase project: Settings > API.
   The "anon" key is DESIGNED to be public/embedded in client-side code —
   it is safe to expose. What actually protects the data is the Row Level
   Security (RLS) policy on the table (see setup SQL provided separately),
   which allows INSERT but not SELECT for anonymous requests.
   ========================================================================= */
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";       // e.g. "https://abcdefgh.supabase.co"
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";      // the long "anon public" key

let sbClient = null;
const supabaseConfigured = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_");
if(supabaseConfigured && window.supabase){
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

/* =========================================================================
   AUTH — email/password accounts via Supabase Auth, with an anonymous
   guest fallback. Guest IDs are generated fresh each browser session
   (no localStorage is used here), so guest history isn't recoverable
   across visits — only signed-in students get durable history.
   ========================================================================= */
const authState = { user:null, guestId:null };
let authMode = "signin";

function newGuestId(){
  return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "guest-"+Math.random().toString(36).slice(2)+Date.now();
}

async function initAuth(){
  if(sbClient){
    try{
      const { data } = await sbClient.auth.getSession();
      if(data && data.session) applySession(data.session);
      sbClient.auth.onAuthStateChange((_event, session)=>{
        if(session) applySession(session); else clearSession();
      });
    }catch(e){
      console.error("Supabase auth check failed — continuing as guest.", e);
    }
  }
  if(!authState.user) authState.guestId = newGuestId();
  renderAccountWidget();
}
function applySession(session){
  const u = session.user;
  authState.user = { id:u.id, email:u.email, name:(u.user_metadata && u.user_metadata.full_name) || u.email.split("@")[0] };
  authState.guestId = null;
  renderAccountWidget();
}
function clearSession(){
  authState.user = null;
  authState.guestId = newGuestId();
  renderAccountWidget();
}

function renderAccountWidget(){
  const el = document.getElementById("accountWidget");
  if(!el) return;
  if(authState.user){
    el.innerHTML = `
      <div class="account-pill">
        <div class="who"><b>${authState.user.name}</b><span>SIGNED IN</span></div>
        <button class="link-btn" onclick="viewMyResults()">History</button>
        <button class="link-btn" onclick="signOut()">Log out</button>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="account-pill">
        <div class="who"><b>Guest</b><span>NOT SAVED TO ACCOUNT</span></div>
      </div>
      <button class="account-btn" onclick="openAuthModal('signin')">Log in / Sign up</button>`;
  }
}

function openAuthModal(mode){
  setAuthMode(mode);
  document.getElementById("authOverlay").style.display = "flex";
  document.getElementById("authError").textContent = "";
}
function closeAuthModal(){
  document.getElementById("authOverlay").style.display = "none";
}
function setAuthMode(mode){
  authMode = mode;
  document.getElementById("tabSignIn").classList.toggle("active", mode==="signin");
  document.getElementById("tabSignUp").classList.toggle("active", mode==="signup");
  document.getElementById("nameFieldWrap").style.display = mode==="signup" ? "flex":"none";
  document.getElementById("authSubmitBtn").textContent = mode==="signup" ? "Create account" : "Log in";
  document.getElementById("authError").textContent = "";
}

async function handleAuthSubmit(evt){
  evt.preventDefault();
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  if(!sbClient){
    errEl.textContent = "Supabase isn't connected yet — accounts can't be created until it's set up.";
    return;
  }
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const name = document.getElementById("authName").value.trim();
  const btn = document.getElementById("authSubmitBtn");
  btn.disabled = true; btn.textContent = "Please wait...";
  try{
    if(authMode==="signup"){
      if(!name){ throw new Error("Please enter your name."); }
      const { data, error } = await sbClient.auth.signUp({
        email, password, options:{ data:{ full_name:name } }
      });
      if(error) throw error;
      if(data.session){
        closeAuthModal();
      } else {
        errEl.style.color = "var(--correct)";
        errEl.textContent = "Account created — check your email to confirm, then log in.";
        setAuthMode("signin");
      }
    } else {
      const { error } = await sbClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
      closeAuthModal();
    }
  }catch(e){
    errEl.style.color = "var(--incorrect)";
    errEl.textContent = e.message || "Something went wrong — please try again.";
  }finally{
    btn.disabled = false;
    setAuthMode(authMode);
  }
}
async function signOut(){
  if(sbClient) await sbClient.auth.signOut();
  clearSession();
  goHome();
}

let historyCache = {}; // resultId -> fetched answer detail, so re-expanding doesn't refetch

async function viewMyResults(){
  if(!sbClient || !authState.user) return;
  historyCache = {};
  document.getElementById("main").innerHTML = `<div class="card"><h3>Loading your history…</h3></div>`;
  const { data, error } = await sbClient.from("quiz_results")
    .select("*").eq("user_id", authState.user.id)
    .order("created_at", { ascending:false });
  if(error){
    document.getElementById("main").innerHTML = `<div class="card"><p>Couldn't load history: ${error.message}</p><p style="font-size:12px;color:var(--ink-soft);">If this persists, check that the "Logged-in users view own results" policy exists on quiz_results in Supabase.</p></div>`;
    return;
  }
  renderHistoryList(data||[]);
}

function renderHistoryList(rows){
  const list = rows.length ? rows.map(r=>{
    const wPct = r.weighted_max ? Math.max(0, Math.min(100, Math.round(r.weighted_score/r.weighted_max*100))) : r.score_pct;
    return `
    <div class="missed-item" id="hist-${r.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="flex:1;cursor:pointer;" onclick="toggleHistoryDetail('${r.id}')">
          <div style="font-weight:600;font-size:13.5px;">${r.quiz_title}</div>
          <div class="mono" style="font-size:10.5px;color:var(--ink-soft);margin:2px 0 6px;">${new Date(r.created_at).toLocaleString()}</div>
          <div class="weight-bar-track"><div class="weight-bar-fill" style="width:${wPct}%;background:${wPct>=70?'#1E7A4C':wPct>=50?'#A9782C':'#B8402A'}"></div></div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div class="score-big" style="font-size:22px;">${r.weighted_score!=null? r.weighted_score : '—'}</div>
          <div class="mono" style="font-size:10px;color:var(--ink-soft);">of ${r.weighted_max!=null? r.weighted_max : '—'} pts</div>
          <div class="mono" style="font-size:10.5px;color:var(--ink-soft);margin-top:2px;">${r.correct_count}/${r.total_count} correct (${r.score_pct}%)${r.skipped_count? ` · ${r.skipped_count} skipped`:""}</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="link-btn" onclick="toggleHistoryDetail('${r.id}')" id="hist-toggle-${r.id}">▸ View every answer</button>
        <button class="link-btn" style="color:var(--incorrect);" onclick="deleteHistoryItem('${r.id}')">Delete this attempt</button>
      </div>
      <div id="hist-detail-${r.id}"></div>
    </div>`;
  }).join("") : `<p style="color:var(--ink-soft);font-size:13.5px;">No attempts yet — take a quiz to start building your history.</p>`;

  document.getElementById("main").innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h3 style="margin:0;">Your history — ${authState.user.name}</h3>
        ${rows.length ? `<button class="link-btn" style="color:var(--incorrect);" onclick="clearAllHistory()">Clear all history</button>` : ""}
      </div>
    </div>
    <div class="card">${list}</div>
    <button class="btn secondary" onclick="goHome()">Back to dashboard</button>
  `;
}

async function toggleHistoryDetail(resultId){
  const detailEl = document.getElementById("hist-detail-"+resultId);
  const toggleBtn = document.getElementById("hist-toggle-"+resultId);
  if(detailEl.dataset.open==="1"){
    detailEl.innerHTML = "";
    detailEl.dataset.open = "0";
    if(toggleBtn) toggleBtn.textContent = "▸ View every answer";
    return;
  }
  if(toggleBtn) toggleBtn.textContent = "▾ Hide answers";
  detailEl.dataset.open = "1";
  detailEl.innerHTML = `<p style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Loading answers…</p>`;

  if(!historyCache[resultId]){
    const { data: answers, error: aErr } = await sbClient.from("quiz_answers")
      .select("*").eq("quiz_result_id", resultId).eq("user_id", authState.user.id);
    if(aErr){ detailEl.innerHTML = `<p style="font-size:12px;color:var(--incorrect);">Couldn't load answers: ${aErr.message}</p>`; return; }
    const qIds = (answers||[]).map(a=>a.question_id);
    let qMap = {};
    if(qIds.length){
      const { data: qs } = await sbClient.from("questions").select("*").in("id", qIds);
      (qs||[]).forEach(q=> qMap[q.id]=q);
    }
    historyCache[resultId] = (answers||[]).map(a=>({...a, question:qMap[a.question_id]}));
  }

  const items = historyCache[resultId];
  const icon = {correct:"✓", incorrect:"✗", skipped:"⏭"};
  detailEl.innerHTML = `<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">` +
    items.map(a=>{
      const q = a.question;
      const st = a.status || (a.correct_flag ? "correct" : "incorrect");
      const yourAns = a.selected!=null ? (Array.isArray(a.selected) ? a.selected.join(", ") : a.selected) : "— (skipped)";
      const correctAns = Array.isArray(a.correct_answer) ? a.correct_answer.join(", ") : a.correct_answer;
      if(!q){
        return `<div class="recap-item">${icon[st]||"?"} ${a.subtopic} — question no longer in bank</div>`;
      }
      const wrongList = Object.entries((q.explain&&q.explain.wrong)||{}).map(([k,txt])=>
        `<div class="why-wrong-item"><b>${k}</b>${txt}</div>`).join("");
      return `<details class="missed-item" style="background:var(--paper);">
        <summary><span>${icon[st]||"?"} ${a.subtopic}${q.explain?" — "+q.explain.concept:""}</span><span class="arrow">›</span></summary>
        <p class="stem" style="font-size:13.5px;">${q.stem}</p>
        <p class="mono" style="font-size:12px;color:var(--ink-soft);margin:0 0 8px;">Your answer: ${yourAns} &nbsp;·&nbsp; Correct: ${correctAns}</p>
        ${q.explain? `<ul class="bullets">${q.explain.why.map(w=>`<li>${w}</li>`).join("")}</ul>` : ""}
        ${wrongList ? `<div class="explain-block">${wrongList}</div>` : ""}
        ${q.explain? `<div class="quickcheck"><span class="lightning">⚡</span><span>${q.explain.quick}</span></div>` : ""}
      </details>`;
    }).join("") + `</div>`;
}

async function deleteHistoryItem(resultId){
  if(!confirm("Delete this test attempt and all its answers? This can't be undone.")) return;
  const { error } = await sbClient.from("quiz_results").delete().eq("id", resultId).eq("user_id", authState.user.id);
  if(error){ alert("Couldn't delete: "+error.message); return; }
  const el = document.getElementById("hist-"+resultId);
  if(el) el.remove();
  delete historyCache[resultId];
}

async function clearAllHistory(){
  if(!confirm("Delete ALL of your saved test history? This can't be undone.")) return;
  const { error } = await sbClient.from("quiz_results").delete().eq("user_id", authState.user.id);
  if(error){ alert("Couldn't clear history: "+error.message); return; }
  viewMyResults();
}


async function saveResultToSupabase(record, questions, answers){
  const statusEl = document.getElementById("saveStatus");
  if(!sbClient){
    if(statusEl) statusEl.innerHTML = `<span class="save-status off">Not saved — Supabase isn't connected yet (results shown here only)</span>`;
    return;
  }
  const userId = authState.user ? authState.user.id : null;
  const guestId = authState.user ? null : authState.guestId;
  record.user_id = userId;
  record.guest_id = guestId;
  if(authState.user) record.student_name = authState.user.name;

  try{
    const { data, error } = await sbClient.from("quiz_results").insert(record).select().single();
    if(error) throw error;

    // Persist every individual question + answer, linked to this result
    if(questions && answers && questions.length){
      const answerRows = questions.map((q,i)=>{
        const a = answers[i] || {status:"skipped", selected:null};
        return {
          quiz_result_id: data.id,
          user_id: userId,
          guest_id: guestId,
          question_id: q.id,
          category: q.category,
          subtopic: q.subtopic,
          selected: a.selected!==undefined ? a.selected : null,
          correct_answer: q.correct,
          status: a.status || "skipped",
          correct_flag: a.status === "correct"
        };
      });
      const { error: aErr } = await sbClient.from("quiz_answers").insert(answerRows);
      if(aErr) console.error("Saved result, but per-question answers failed:", aErr);
    }

    if(statusEl) statusEl.innerHTML = `<span class="save-status ok">✓ Result + all answers saved${authState.user? " to your account" : " as guest"}</span>`;
  }catch(e){
    console.error("Supabase save failed:", e);
    if(statusEl) statusEl.innerHTML = `<span class="save-status err">⚠ Couldn't save this result — check your Supabase setup</span>`;
  }
}

    "Autonomic dysreflexia (SCI at T6 or above): sit the client UP, loosen clothing, find and remove the trigger (bladder/bowel first) — a hypertensive emergency.",
    "Tension pneumothorax: tracheal deviation AWAY from the affected side + absent breath sounds + hypotension + JVD — immediate needle decompression is life-saving.",
    "Cardiac tamponade — Beck's triad: muffled heart sounds + jugular venous distension + hypotension, plus pulsus paradoxus.",
    "Septic shock has two phases: warm/hyperdynamic (early, vasodilated) can progress to cold/hypodynamic (poor perfusion) if untreated — don't be falsely reassured by warm skin.",
    "Addisonian crisis: missed steroid doses + severe hypotension + weakness + GI symptoms = emergency needing immediate IV corticosteroids and fluids.",
    "'Pain out of proportion to exam findings' + atrial fibrillation = think acute mesenteric ischemia, a vascular emergency.",
    "Fluid volume deficit: tachycardia + hypotension + dry mucous membranes + concentrated urine + poor skin turgor — pulses are weak/thready, not bounding."
  ]
};

{id:"MOC-1",category:"moc",type:"single",subtopic:"Delegation to UAP",
 stem:"The RN is assigning tasks to unlicensed assistive personnel (UAP). Which task is appropriate to delegate?",
 options:[{k:"A",t:"Change the dressing on a client's new surgical wound"},{k:"B",t:"Assess a client who was just admitted with abdominal pain"},{k:"C",t:"Ambulate a client who is 2 days post-op hip replacement and hemodynamically stable"},{k:"D",t:"Teach a client how to self-administer insulin"}],
 correct:"C",
 explain:{concept:"Delegation — the Five Rights (Right Task, Right Circumstance)",
   why:["Ambulating a stable client is routine, has a predictable outcome, and does not require clinical judgment.","The RN has already assessed the client as stable enough for this activity."],
   wrong:{B:"Assessment requires interpreting data and clinical judgment — an RN-only skill.",D:"Teaching requires evaluating the client's understanding and adapting instruction; only a licensed nurse can teach.",A:"A new surgical wound needs RN assessment of the wound bed/drainage, not just dressing mechanics."},
   quick:"UAP may perform routine, standardized tasks on STABLE clients with PREDICTABLE outcomes — never assess, teach, evaluate, or give medications."}},

{id:"MOC-2",category:"moc",type:"single",subtopic:"Delegation to LPN/LVN",
 stem:"The RN is planning client assignments for the shift. Which client is most appropriate to assign to the LPN/LVN?",
 options:[{k:"A",t:"A client who returned from surgery 1 hour ago with unstable vital signs"},{k:"B",t:"A client just admitted with new-onset chest pain"},{k:"C",t:"A client 2 days post-op needing a routine dressing change per protocol, vital signs stable"},{k:"D",t:"A client requiring a teaching plan for a new diagnosis of diabetes"}],
 correct:"C",
 explain:{concept:"Delegation — LPN/LVN scope of practice",
   why:["LPN/LVN scope includes care of clients with stable, expected conditions and reinforcing (not initiating) teaching.","Routine wound care per an established protocol is within LPN scope in most jurisdictions."],
   wrong:{B:"An unstable, undiagnosed client needs RN-level assessment and clinical judgment.",D:"Developing an initial teaching plan is an RN responsibility; the LPN may reinforce it afterward.",A:"Unstable post-op clients require RN assessment and rapid clinical decision-making."},
   quick:"Rule of thumb: RN = unstable, unpredictable, or first-time teaching/assessment. LPN/LVN = stable, routine, reinforcing."}},

{id:"MOC-3",category:"moc",type:"single",subtopic:"Prioritization — ABCs",
 stem:"The RN is caring for four clients. Which client should be assessed first?",
 options:[{k:"A",t:"A client with new-onset stridor and anxious facial expression"},{k:"B",t:"A client requesting pain medication for a 4/10 incisional pain"},{k:"C",t:"A client scheduled for discharge teaching this morning"},{k:"D",t:"A client with a stable ostomy asking about diet"}],
 correct:"A",
 explain:{concept:"Prioritization — Airway, Breathing, Circulation (ABC)",
   why:["Stridor signals a narrowing/obstructed upper airway — a life-threatening emergency that can progress to complete obstruction within minutes."],
   wrong:{B:"Moderate pain is important but not immediately life-threatening.",C:"Discharge teaching can be delayed without harm to the client.",D:"A stable ostomy client with a diet question is the lowest acuity here."},
   quick:"Airway problems always outrank pain, teaching, or psychosocial needs — treat what will kill the client fastest, first."}},

{id:"MOC-4",category:"moc",type:"single",subtopic:"Informed consent",
 stem:"A client is scheduled for surgery and asks the RN to explain the risks of the procedure before signing the consent form. What is the RN's best action?",
 options:[{k:"A",t:"Have the client sign the form and document that consent was obtained"},{k:"B",t:"Notify the surgeon that the client has questions before the procedure and consent form are finalized"},{k:"C",t:"Reassure the client that the procedure is routine and low-risk"},{k:"D",t:"Explain the risks and benefits of the procedure to the client"}],
 correct:"B",
 explain:{concept:"Informed consent — nurse's role vs. provider's role",
   why:["Obtaining informed consent (explaining risks, benefits, and alternatives) is the responsibility of the provider performing the procedure.","The nurse's role is to verify understanding, witness the signature, and notify the provider if the client has unanswered questions."],
   wrong:{D:"Explaining medical risks/benefits is outside nursing scope — this is the provider's legal responsibility.",A:"Signing without addressing the client's questions violates the client's right to informed consent.",C:"Minimizing risk without provider clarification is inappropriate and not the nurse's role."},
   quick:"Nurse = witnesses signature + confirms understanding. Provider = explains risks/benefits/alternatives. Unanswered questions = stop and call the provider."}},

{id:"MOC-5",category:"moc",type:"single",subtopic:"Advance directives",
 stem:"An unconscious client has a signed living will stating no mechanical ventilation should be used. The family requests that the client be placed on a ventilator. What should the RN do?",
 options:[{k:"A",t:"Wait until the client regains consciousness to clarify wishes"},{k:"B",t:"Ask the hospital ethics committee to decide immediately"},{k:"C",t:"Honor the living will and notify the provider of the client's documented wishes"},{k:"D",t:"Follow the family's request since they are present and advocating for the client"}],
 correct:"C",
 explain:{concept:"Advance directives / client autonomy",
   why:["A valid advance directive reflects the client's own wishes made while competent and legally supersedes family preference."],
   wrong:{D:"Family wishes cannot override a valid advance directive.",A:"An unconscious client cannot clarify wishes in real time; the directive exists for exactly this situation.",B:"The ethics committee is not the first step when a clear, valid directive already exists."},
   quick:"A valid advance directive = the client's own voice. It outranks family preference every time."}},

{id:"MOC-6",category:"moc",type:"single",subtopic:"Case management / discharge planning",
 stem:"A client is being discharged with a new colostomy. Which referral is the priority for the RN case manager to initiate?",
 options:[{k:"A",t:"Wound, ostomy, and continence (WOC) nurse for stoma care follow-up"},{k:"B",t:"Dietitian for general nutrition counseling only"},{k:"C",t:"Physical therapy for strength training"},{k:"D",t:"Social worker for financial counseling"}],
 correct:"A",
 explain:{concept:"Continuity of care / appropriate referrals",
   why:["A new colostomy requires specialized stoma care teaching and follow-up to prevent skin breakdown, leakage, and psychological adjustment issues — this is the WOC nurse's specialty."],
   wrong:{C:"Not the priority need related to the new ostomy itself.",D:"May be appropriate later but is not the priority safety/self-care need at discharge.",B:"General nutrition counseling is less urgent than stoma-specific self-care teaching."},
   quick:"Match the referral to the client's most specialized, safety-critical new need — a new stoma always triggers a WOC referral."}},

{id:"MOC-7",category:"moc",type:"single",subtopic:"Prioritization — Maslow",
 stem:"Which client need should the RN address first, based on Maslow's hierarchy of needs?",
 options:[{k:"A",t:"A client worried about being able to afford medications after discharge"},{k:"B",t:"A client who is short of breath with an oxygen saturation of 88%"},{k:"C",t:"A client wanting reassurance about their diagnosis"},{k:"D",t:"A client who feels isolated from family during hospitalization"}],
 correct:"B",
 explain:{concept:"Prioritization — Maslow's hierarchy of needs",
   why:["Physiological needs (oxygenation) sit at the base of Maslow's hierarchy and must be met before safety, belonging, or esteem needs."],
   wrong:{A:"A safety/security-level need — addressed only after physiological needs are stable.",D:"A belonging-level need — lower priority than an oxygenation problem.",C:"An esteem/psychological need — lowest priority of the four options."},
   quick:"Maslow order for prioritization: Physiological → Safety → Love/Belonging → Esteem → Self-actualization."}},

{id:"MOC-8",category:"moc",type:"single",subtopic:"Confidentiality / HIPAA",
 stem:"The RN overhears a colleague discussing a client's HIV status with another staff member in the cafeteria. What is the most appropriate action?",
 options:[{k:"A",t:"Privately remind the colleague this is a confidentiality violation and report per facility policy"},{k:"B",t:"Post a reminder about confidentiality on the unit bulletin board"},{k:"C",t:"Tell the client their information was discussed"},{k:"D",t:"Ignore it since both staff members work on the unit"}],
 correct:"A",
 explain:{concept:"HIPAA / client confidentiality",
   why:["Discussing identifiable client health information in a public area is a HIPAA violation regardless of who is listening.","The nurse has a professional obligation to address the breach directly and follow the facility's reporting process."],
   wrong:{D:"Ignoring a witnessed violation fails the nurse's professional and legal obligation.",B:"A general reminder does not address this specific, already-occurred breach.",C:"Informing the client is not the nurse's first action and may not be appropriate or required by policy."},
   quick:"'Need to know' + private location are both required for any client information discussion — a break room or cafeteria never qualifies."}},

{id:"MOC-9",category:"moc",type:"sata",subtopic:"Delegation to UAP — SATA",
 stem:"Which of the following tasks can the RN safely delegate to unlicensed assistive personnel (UAP)? Select all that apply.",
 options:[{k:"A",t:"Providing routine perineal and hygiene care for a stable client"},{k:"B",t:"Measuring and recording vital signs on a stable client"},{k:"C",t:"Assisting a stable client with ambulation in the hallway"},{k:"D",t:"Administering a scheduled oral medication"},{k:"E",t:"Performing the initial assessment on a newly admitted client"},{k:"F",t:"Recording oral intake and urinary output amounts"}],
 correct:["A","B","C","F"],
 explain:{concept:"Delegation — tasks within UAP scope",
   why:["Vital signs on a stable client, assisted ambulation, I&O recording, and routine hygiene are all standardized tasks with predictable outcomes that do not require nursing judgment."],
   wrong:{D:"Medication administration always requires a licensed nurse, regardless of client stability.",E:"Initial/admission assessment requires RN clinical judgment and cannot be delegated."},
   quick:"If a task requires assessment, judgment, teaching, or evaluation — it stays with the licensed nurse, no exceptions."}},

{id:"MOC-10",category:"moc",type:"single",subtopic:"Medication error / incident report",
 stem:"The RN discovers that a client was accidentally given a double dose of a scheduled oral medication 20 minutes ago. What is the RN's first action?",
 options:[{k:"A",t:"Complete an incident report immediately"},{k:"B",t:"Document the error in the client's chart in detail"},{k:"C",t:"Assess the client for adverse effects and notify the provider"},{k:"D",t:"Wait to see if symptoms develop before taking action"}],
 correct:"C",
 explain:{concept:"Medication error response / client safety first",
   why:["The immediate priority after any error is always the client's physiological safety — assess for harm, then notify the provider so orders can be adjusted if needed."],
   wrong:{A:"The incident report is completed after the client is assessed and safe — and is never charted in the medical record.",B:"Documentation follows the safety assessment, not before it.",D:"Waiting delays detection of a potentially serious adverse reaction."},
   quick:"Error sequence: 1) Assess/stabilize the client → 2) Notify the provider → 3) Document facts in the chart → 4) File the incident report (separately, never referenced in the chart)."}},

{id:"SIC-1",category:"sic",type:"single",subtopic:"Airborne precautions",
 stem:"A client is admitted with suspected active pulmonary tuberculosis. Which precaution should the RN implement?",
 options:[{k:"A",t:"Droplet precautions with a surgical mask"},{k:"B",t:"Contact precautions with gown and gloves"},{k:"C",t:"Airborne precautions with an N95 respirator and negative-pressure room"},{k:"D",t:"Standard precautions only"}],
 correct:"C",
 explain:{concept:"Transmission-based precautions — Airborne",
   why:["TB is spread via small airborne droplet nuclei that remain suspended in air; it requires a negative-pressure room and a fit-tested N95 (or higher) respirator."],
   wrong:{D:"Insufficient — standard precautions alone do not prevent airborne transmission.",A:"A surgical mask does not filter the small particle size of airborne organisms.",B:"Contact precautions address organisms spread by touch, not by air."},
   quick:"Airborne = TB, Measles, Varicella (chickenpox) → think 'My Chest Tightens' — N95 + negative pressure room."}},

{id:"SIC-2",category:"sic",type:"single",subtopic:"Contact precautions",
 stem:"A client has a confirmed Clostridioides difficile (C. diff) infection. Which infection control measure is essential?",
 options:[{k:"A",t:"Alcohol-based hand sanitizer before and after care"},{k:"B",t:"Droplet precautions with a surgical mask"},{k:"C",t:"Soap-and-water hand washing plus contact precautions (gown and gloves)"},{k:"D",t:"Standard precautions are sufficient"}],
 correct:"C",
 explain:{concept:"Contact precautions — C. diff spores",
   why:["C. diff forms spores that are NOT killed by alcohol-based hand sanitizer; only mechanical washing with soap and water removes them.","Contact precautions (gown/gloves) prevent spread via hands and surfaces."],
   wrong:{A:"Alcohol-based sanitizer does not kill C. diff spores — this is a classic NCLEX trap.",B:"C. diff is spread by contact, not respiratory droplets.",D:"Standard precautions alone are inadequate for a spore-forming, contact-spread organism."},
   quick:"C. diff spores survive alcohol gel — always wash with soap and water, and gown/glove for every entry into the room."}},

{id:"SIC-3",category:"sic",type:"single",subtopic:"Droplet precautions",
 stem:"A client is diagnosed with influenza. Which precaution is appropriate?",
 options:[{k:"A",t:"Protective (reverse) isolation"},{k:"B",t:"No additional precautions beyond hand hygiene"},{k:"C",t:"Droplet precautions with a surgical mask within 3 feet of the client"},{k:"D",t:"Airborne precautions with N95 respirator"}],
 correct:"C",
 explain:{concept:"Droplet precautions",
   why:["Influenza spreads via large respiratory droplets that travel a short distance (about 3 feet) — a surgical mask is sufficient protection."],
   wrong:{D:"An N95 and negative pressure room are unnecessary for droplet-spread organisms.",B:"Additional precautions beyond hand hygiene are required to prevent droplet spread.",A:"Protective isolation protects an immunocompromised client from others, not the reverse."},
   quick:"Droplet = Influenza, Mumps, Rubella, Pertussis → think 'SPIDERMAN' mnemonic. Surgical mask, private room or 3-ft spatial separation."}},

{id:"SIC-4",category:"sic",type:"single",subtopic:"Fall prevention",
 stem:"An older adult client is identified as high risk for falls. Which intervention should the RN implement first?",
 options:[{k:"A",t:"Place the bed in the lowest position with the bed alarm activated and non-skid footwear"},{k:"B",t:"Administer a sedative at bedtime"},{k:"C",t:"Apply a vest restraint to keep the client in bed"},{k:"D",t:"Request a sitter to stay with the client continuously"}],
 correct:"A",
 explain:{concept:"Fall prevention — least restrictive measures first",
   why:["Non-restrictive environmental safety measures (low bed, alarm, non-skid footwear) are the first-line, least restrictive interventions for fall risk."],
   wrong:{C:"Restraints are a last resort, used only after less restrictive measures fail and require a provider order.",D:"A continuous sitter may be appropriate but is a resource-intensive step beyond first-line measures.",B:"Sedatives increase fall risk by causing drowsiness and impaired balance."},
   quick:"Always start with the LEAST restrictive intervention. Restraints require a time-limited provider order and are never a first choice."}},

{id:"SIC-5",category:"sic",type:"single",subtopic:"Restraint use",
 stem:"Which statement about the use of physical restraints is accurate?",
 options:[{k:"A",t:"Once applied, a restraint order does not need to be renewed"},{k:"B",t:"Restraints may be applied without a provider order in a true emergency and never require follow-up documentation"},{k:"C",t:"A PRN restraint order can be used whenever the nurse judges it necessary"},{k:"D",t:"Restraints require a time-limited provider order and must be reassessed per facility policy (commonly every 2 hours)"}],
 correct:"D",
 explain:{concept:"Legal/ethical use of restraints",
   why:["Restraints require a specific, time-limited provider order (never PRN), least-restrictive-alternative justification, and frequent reassessment/documentation of the continued need, circulation, and skin integrity."],
   wrong:{C:"PRN restraint orders are not permitted — each episode requires a new, specific order.",B:"Even emergency application requires a provider order within a defined time frame (often within 1 hour) and full documentation.",A:"Restraint orders expire and must be renewed per facility policy/regulation."},
   quick:"Restraints = last resort, least restrictive first, time-limited order, frequent reassessment (~q2h), and thorough documentation every time."}},

{id:"SIC-6",category:"sic",type:"single",subtopic:"Fire safety — RACE",
 stem:"A fire breaks out in a supply room down the hall from an occupied client room. Using the RACE mnemonic, what is the nurse's first action?",
 options:[{k:"A",t:"Rescue/remove clients in immediate danger"},{k:"B",t:"Extinguish the fire with a fire extinguisher"},{k:"C",t:"Activate the fire alarm"},{k:"D",t:"Confine the fire by closing doors"}],
 correct:"A",
 explain:{concept:"Fire safety — RACE sequence",
   why:["RACE stands for Rescue, Alarm, Confine, Extinguish/Evacuate — rescuing anyone in immediate danger always comes first."],
   wrong:{B:"Extinguishing is the last step, attempted only if the fire is small and contained.",C:"Activating the alarm is the second step, after ensuring immediate client safety.",D:"Confining the fire (closing doors) happens after rescue and alarm activation."},
   quick:"RACE = Rescue → Alarm → Confine → Extinguish/Evacuate. Always rescue first."}},

{id:"SIC-7",category:"sic",type:"single",subtopic:"Rights of medication administration",
 stem:"Before administering a scheduled medication, the RN verifies the client's identity using two identifiers. This action supports which of the 'rights' of medication administration?",
 options:[{k:"A",t:"Right time"},{k:"B",t:"Right route"},{k:"C",t:"Right client"},{k:"D",t:"Right documentation"}],
 correct:"C",
 explain:{concept:"Rights of medication administration",
   why:["Verifying identity with two identifiers (e.g., name and date of birth, checked against the MAR/armband) confirms the Right Client — the single most critical safety check to prevent wrong-client errors."],
   wrong:{D:"Documentation happens after administration, not during identity verification.",B:"Route refers to how the medication is given (PO, IV, etc.), not who receives it.",A:"Timing refers to when the dose is due, not client identity."},
   quick:"The Rights: Client, Drug, Dose, Route, Time, Documentation, Reason — two-identifier checks always map to 'Right Client'."}},

{id:"SIC-8",category:"sic",type:"single",subtopic:"Needlestick injury",
 stem:"An RN sustains a needlestick injury after administering an injection to a client. What is the nurse's first action?",
 options:[{k:"A",t:"Apply a tourniquet above the injury site"},{k:"B",t:"Report the injury to the supervisor before doing anything else"},{k:"C",t:"Wash the area immediately with soap and water"},{k:"D",t:"Continue the medication pass and address it after the shift"}],
 correct:"C",
 explain:{concept:"Occupational exposure response",
   why:["Immediate washing with soap and water reduces the pathogen load at the exposure site and is the priority first step before reporting or further work-up."],
   wrong:{B:"Reporting is essential but occurs after the immediate first-aid step.",A:"A tourniquet is not indicated and does not reduce infection risk from a needlestick.",D:"Delaying care increases risk of transmission of bloodborne pathogens; this must be addressed immediately."},
   quick:"Needlestick sequence: Wash first → Report per facility protocol → Post-exposure evaluation and prophylaxis as indicated."}},

{id:"SIC-9",category:"sic",type:"sata",subtopic:"CLABSI prevention — SATA",
 stem:"Which nursing actions help prevent central line-associated bloodstream infection (CLABSI)? Select all that apply.",
 options:[{k:"A",t:"Change the dressing using sterile technique per protocol"},{k:"B",t:"Assess daily whether the central line is still necessary"},{k:"C",t:"Apply antibiotic ointment to the insertion site routinely"},{k:"D",t:"Use chlorhexidine-based antiseptic for site care"},{k:"E",t:"Perform hand hygiene immediately before and after accessing the line"},{k:"F",t:"Leave the dressing in place indefinitely unless visibly soiled"}],
 correct:["A","B","D","E"],
 explain:{concept:"CLABSI bundle",
   why:["Hand hygiene, chlorhexidine skin antisepsis, sterile dressing technique, and daily review of line necessity are core elements of the evidence-based CLABSI prevention bundle."],
   wrong:{C:"Routine prophylactic antibiotic ointment is not recommended — it promotes resistance and fungal colonization.",F:"Dressings are changed on a defined schedule, not left indefinitely, to prevent bacterial growth under the dressing."},
   quick:"CLABSI bundle = Hand hygiene + chlorhexidine prep + sterile dressing changes + daily 'does this line still need to be here?' review."}},

{id:"SIC-10",category:"sic",type:"single",subtopic:"Home fall-prevention teaching",
 stem:"The RN is teaching an older adult client about fall prevention at home. Which statement by the client indicates a need for further teaching?",
 options:[{k:"A",t:"'I'll wear my loose bedroom slippers when walking around the house.'"},{k:"B",t:"'I'll install grab bars near the toilet and shower.'"},{k:"C",t:"'I will remove the throw rugs in my hallway.'"},{k:"D",t:"'I'll keep a nightlight on in the bathroom.'"}],
 correct:"A",
 explain:{concept:"Fall prevention teaching — evaluating understanding",
   why:["Loose-fitting slippers increase tripping risk; well-fitted, non-skid footwear is recommended instead."],
   wrong:{C:"Removing throw rugs correctly reduces a major tripping hazard.",D:"Adequate lighting, including nightlights, correctly reduces fall risk.",B:"Grab bars are a correct, evidence-based fall-prevention measure."},
   quick:"When a teaching question asks which statement needs 'further teaching,' you're looking for the INCORRECT client statement — read carefully."}},

{id:"HPM-1",category:"hpm",type:"single",subtopic:"Erikson — toddler stage",
 stem:"A mother reports that her 2-year-old frequently says 'no' and insists on doing things independently, such as feeding self. How should the RN interpret this behavior?",
 options:[{k:"A",t:"A sign of a behavioral disorder requiring evaluation"},{k:"B",t:"An indication the child needs stricter discipline"},{k:"C",t:"Normal development consistent with Erikson's autonomy vs. shame/doubt stage"},{k:"D",t:"A sign of insecure attachment"}],
 correct:"C",
 explain:{concept:"Erikson's psychosocial stages — toddlerhood",
   why:["Toddlers (1–3 years) are in the autonomy vs. shame/doubt stage; asserting independence and saying 'no' is expected, healthy development."],
   wrong:{A:"This is normal developmental behavior, not pathology.",D:"Attachment concerns present differently (e.g., lack of stranger anxiety or indifference to caregiver).",B:"Stricter discipline is not indicated for normal autonomy-seeking behavior."},
   quick:"Erikson quick map: Infant=Trust vs. Mistrust, Toddler=Autonomy vs. Shame/Doubt, Preschool=Initiative vs. Guilt, School-age=Industry vs. Inferiority, Adolescent=Identity vs. Role Confusion."}},

{id:"HPM-2",category:"hpm",type:"single",subtopic:"Infant milestones",
 stem:"Which finding would the RN expect during a well-child visit for a healthy 6-month-old infant?",
 options:[{k:"A",t:"Walks independently"},{k:"B",t:"Speaks in two-word sentences"},{k:"C",t:"Sits with support and transfers objects hand to hand"},{k:"D",t:"Uses a pincer grasp to pick up small objects"}],
 correct:"C",
 explain:{concept:"Infant growth & development milestones",
   why:["By 6 months, expected milestones include sitting with support, rolling both ways, and transferring objects hand to hand."],
   wrong:{A:"Independent walking is expected around 12–15 months.",D:"Pincer grasp typically develops around 9 months.",B:"Two-word sentences are expected around 18–24 months."},
   quick:"6 months ≈ sits with support + transfers objects. 9 months ≈ pincer grasp + crawls. 12 months ≈ first steps + first words."}},

{id:"HPM-3",category:"hpm",type:"single",subtopic:"Live vaccine contraindications",
 stem:"A nurse is reviewing immunization history before administering the MMR vaccine. Which client finding is a contraindication?",
 options:[{k:"A",t:"Mild upper respiratory infection with low-grade fever"},{k:"B",t:"History of a mild local reaction to a previous vaccine"},{k:"C",t:"Current pregnancy"},{k:"D",t:"Currently taking an oral antibiotic for otitis media"}],
 correct:"C",
 explain:{concept:"Live-virus vaccine contraindications",
   why:["MMR is a live attenuated vaccine and is contraindicated during pregnancy due to theoretical risk to the fetus; pregnancy should be avoided for at least 4 weeks after vaccination."],
   wrong:{A:"A mild illness without high fever is not a contraindication to vaccination.",B:"A prior mild local reaction is not a contraindication (a severe/anaphylactic reaction would be).",D:"Antibiotic therapy does not contraindicate MMR administration."},
   quick:"Live vaccines (MMR, varicella, intranasal flu) are avoided in pregnancy and in significantly immunocompromised clients."}},

{id:"HPM-4",category:"hpm",type:"single",subtopic:"Prenatal danger signs",
 stem:"A pregnant client at 32 weeks gestation calls the clinic reporting a severe headache, blurred vision, and swelling in her hands and face. What should the RN advise?",
 options:[{k:"A",t:"Increase fluid intake and monitor at home for 24 hours"},{k:"B",t:"Apply a cool compress and call back if symptoms worsen"},{k:"C",t:"Come to the office or emergency department immediately for evaluation"},{k:"D",t:"Take acetaminophen and rest; this is normal in the third trimester"}],
 correct:"C",
 explain:{concept:"Prenatal danger signs — preeclampsia",
   why:["Severe headache, visual disturbances, and facial/hand edema are classic warning signs of preeclampsia, a potentially life-threatening condition requiring immediate evaluation."],
   wrong:{D:"These symptoms are not normal and delaying care risks progression to eclampsia (seizures).",A:"Home monitoring delays necessary treatment for a potential obstetric emergency.",B:"Symptomatic treatment at home is unsafe given the risk of rapid progression."},
   quick:"Preeclampsia red flags: severe headache + visual changes + edema/rapid weight gain + elevated BP — always urgent, never 'wait and see.'"}},

{id:"HPM-5",category:"hpm",type:"single",subtopic:"Newborn safe sleep",
 stem:"The RN is teaching new parents about safe sleep practices for their newborn. Which instruction is correct?",
 options:[{k:"A",t:"Place the infant on their back on a firm mattress with no loose bedding"},{k:"B",t:"Have the infant co-sleep in the parents' bed for the first 3 months"},{k:"C",t:"Place the infant on their stomach to sleep to prevent aspiration"},{k:"D",t:"Use soft bumper pads and blankets to keep the infant warm"}],
 correct:"A",
 explain:{concept:"Safe sleep / SIDS prevention",
   why:["'Back to sleep' on a firm, flat surface with no soft bedding, pillows, or bumpers is the evidence-based recommendation to reduce the risk of SIDS."],
   wrong:{C:"Stomach sleeping increases SIDS risk and is not recommended.",B:"Bed-sharing increases suffocation/SIDS risk; room-sharing without bed-sharing is recommended instead.",D:"Soft bedding and bumper pads increase suffocation risk and should be avoided in the crib."},
   quick:"Safe sleep = Back, firm surface, own sleep space, nothing soft/loose in the crib ('Bare is Best')."}},

{id:"HPM-6",category:"hpm",type:"single",subtopic:"Adolescent health promotion",
 stem:"During a routine visit, the RN screens a 13-year-old for scoliosis. Which finding requires further evaluation?",
 options:[{k:"A",t:"Symmetric shoulder height when standing"},{k:"B",t:"Equal leg length"},{k:"C",t:"Normal, symmetric gait"},{k:"D",t:"Uneven shoulder or hip height, or a rib hump when bending forward"}],
 correct:"D",
 explain:{concept:"Adolescent screening — scoliosis",
   why:["Asymmetry of the shoulders, hips, or a rib hump on forward bending (Adam's forward bend test) suggests spinal curvature and warrants referral for imaging/orthopedic evaluation."],
   wrong:{A:"Symmetric findings are normal and reassuring.",B:"Equal leg length is a normal finding.",C:"A normal gait does not suggest scoliosis."},
   quick:"Scoliosis screening peaks during the adolescent growth spurt — Adam's forward bend test is the classic screening maneuver."}},

{id:"HPM-7",category:"hpm",type:"single",subtopic:"Older adult screening",
 stem:"Which health screening recommendation is appropriate for a 55-year-old client with no personal or family history of colorectal cancer?",
 options:[{k:"A",t:"Screening is only recommended for clients with a family history"},{k:"B",t:"Screening is only necessary if the client is symptomatic"},{k:"C",t:"Colorectal cancer screening should begin at age 45"},{k:"D",t:"Colorectal cancer screening is not needed until age 65"}],
 correct:"C",
 explain:{concept:"Health maintenance screening guidelines",
   why:["Current guidelines recommend average-risk adults begin colorectal cancer screening at age 45; a 55-year-old average-risk client should already be engaged in screening."],
   wrong:{D:"Waiting until 65 delays screening well past the recommended start age.",B:"Screening is meant to detect disease before symptoms develop — that is the entire point of screening.",A:"Average-risk individuals without family history still need screening starting at 45."},
   quick:"Health promotion = catching disease BEFORE symptoms. Don't wait for symptoms to recommend screening."}},

{id:"HPM-8",category:"hpm",type:"single",subtopic:"Nutrition across the lifespan",
 stem:"A toddler drinks 40 oz of whole milk per day and little else. The RN should recognize this places the child at risk for which condition?",
 options:[{k:"A",t:"Hypercalcemia"},{k:"B",t:"Vitamin D toxicity"},{k:"C",t:"Iron-deficiency anemia"},{k:"D",t:"Childhood obesity only"}],
 correct:"C",
 explain:{concept:"Toddler nutrition — 'milk anemia'",
   why:["Excessive cow's milk intake displaces iron-rich foods and can bind dietary iron, commonly causing iron-deficiency anemia in toddlers ('milk anemia')."],
   wrong:{B:"Vitamin D toxicity is not a typical consequence of excess milk intake at this volume.",D:"Weight concerns can occur but iron-deficiency anemia is the classic, testable complication.",A:"Hypercalcemia is not the expected primary concern taught for excessive milk intake."},
   quick:"Toddlers should have milk intake limited to about 16–24 oz/day; excess milk = risk for iron-deficiency anemia."}},

{id:"HPM-9",category:"hpm",type:"sata",subtopic:"Normal newborn transition — SATA",
 stem:"Which findings are expected in a healthy newborn during the first 24 hours of life? Select all that apply.",
 options:[{k:"A",t:"Central cyanosis of the trunk and face"},{k:"B",t:"Respiratory rate of 30–60 breaths/min"},{k:"C",t:"Heart rate of 110–160 beats/min"},{k:"D",t:"Respiratory rate of 80 breaths/min with grunting"},{k:"E",t:"Acrocyanosis (bluish hands and feet)"},{k:"F",t:"Positive Moro (startle) reflex"}],
 correct:["B","C","E","F"],
 explain:{concept:"Normal newborn transition to extrauterine life",
   why:["Acrocyanosis is a normal, expected finding in the first 24–48 hours; RR 30–60, HR 110–160, and a positive Moro reflex are all normal newborn findings."],
   wrong:{D:"Grunting and RR of 80 suggest respiratory distress, not a normal finding.",A:"Central cyanosis (trunk/face) is always abnormal and requires immediate evaluation, unlike peripheral acrocyanosis."},
   quick:"Acrocyanosis = normal (peripheral only). Central cyanosis (lips, trunk, tongue) = always abnormal — report immediately."}},

{id:"HPM-10",category:"hpm",type:"single",subtopic:"Self-exam teaching",
 stem:"The RN is teaching a 22-year-old male client about testicular self-examination. Which instruction is correct?",
 options:[{k:"A",t:"The exam is not recommended for men under age 30"},{k:"B",t:"Perform the exam only if pain or swelling is noticed"},{k:"C",t:"Perform the exam once a year during an annual physical only"},{k:"D",t:"Perform the exam monthly, ideally after a warm shower when the scrotum is relaxed"}],
 correct:"D",
 explain:{concept:"Health promotion — self-exam teaching",
   why:["Monthly self-exams after a warm shower (when the scrotal skin is relaxed) make it easier to detect changes such as lumps or swelling early."],
   wrong:{C:"Annual-only exams miss the point of early detection between visits.",B:"The exam is meant to detect abnormalities before symptoms like pain occur.",A:"Testicular cancer risk is actually highest in younger men (typically ages 15–35), making self-exams especially relevant in this age group."},
   quick:"Self-exams (breast or testicular) are done monthly, proactively — not only when a problem is already suspected."}},

{id:"PSY-1",category:"psy",type:"single",subtopic:"Therapeutic communication",
 stem:"A client says, 'I don't know if I can handle this diagnosis.' Which response by the RN is most therapeutic?",
 options:[{k:"A",t:"'Don't worry, everything will be fine.'"},{k:"B",t:"'You should try to stay positive.'"},{k:"C",t:"'Tell me more about what's worrying you.'"},{k:"D",t:"'Many people have this diagnosis and do well.'"}],
 correct:"C",
 explain:{concept:"Therapeutic communication — open-ended questions",
   why:["An open-ended prompt invites the client to express feelings and explore concerns in their own words, which is the core of therapeutic communication."],
   wrong:{A:"False reassurance dismisses the client's feelings and shuts down further discussion.",B:"Giving advice ('should') is a nontherapeutic blocking technique.",D:"Comparing to 'many people' minimizes this client's individual experience."},
   quick:"Therapeutic techniques: open-ended questions, reflection, silence, restating. Nontherapeutic: false reassurance, giving advice, changing the subject, minimizing."}},

{id:"PSY-2",category:"psy",type:"single",subtopic:"Grief — Kübler-Ross",
 stem:"A client recently diagnosed with a terminal illness angrily tells the RN, 'Why is this happening to me? This isn't fair!' How should the RN interpret this?",
 options:[{k:"A",t:"A sign of a maladaptive coping disorder requiring psychiatric referral"},{k:"B",t:"A normal stage of the grieving process (anger)"},{k:"C",t:"The client is being disrespectful and needs redirection"},{k:"D",t:"The client has not accepted the diagnosis and needs more education"}],
 correct:"B",
 explain:{concept:"Kübler-Ross stages of grief",
   why:["Anger is one of the recognized stages of grief (denial, anger, bargaining, depression, acceptance) and is a normal, expected emotional response to a terminal diagnosis."],
   wrong:{A:"This is a normal grief reaction, not pathology requiring psychiatric referral.",C:"Labeling the response as disrespectful fails to recognize a normal emotional process.",D:"More education does not address the emotional work of grieving; the priority is emotional support."},
   quick:"Grief stages are not linear and can occur in any order or repeat — anger, denial, bargaining, depression, and acceptance are all normal."}},

{id:"PSY-3",category:"psy",type:"single",subtopic:"Defense mechanisms",
 stem:"A client who is angry at their spouse yells at the nurse instead. Which defense mechanism is the client demonstrating?",
 options:[{k:"A",t:"Projection"},{k:"B",t:"Displacement"},{k:"C",t:"Rationalization"},{k:"D",t:"Denial"}],
 correct:"B",
 explain:{concept:"Ego defense mechanisms",
   why:["Displacement is redirecting an emotion (anger) from its original source (the spouse) onto a safer or unrelated target (the nurse)."],
   wrong:{D:"Denial is refusing to acknowledge a painful reality, not redirecting emotion.",A:"Projection is attributing one's own unacceptable feelings to someone else, not redirecting them.",C:"Rationalization is creating logical-sounding excuses to justify behavior."},
   quick:"Displacement = wrong target, same emotion. Projection = 'you feel this way,' not 'I feel this way.'"}},

{id:"PSY-4",category:"psy",type:"single",subtopic:"Intimate partner violence",
 stem:"The RN suspects a client may be experiencing intimate partner violence. What is the best approach?",
 options:[{k:"A",t:"Wait for the client to bring up the topic voluntarily"},{k:"B",t:"Ask the client directly about abuse while the partner is out of the room"},{k:"C",t:"Ask the client about abuse with the partner present for support"},{k:"D",t:"Confront the partner directly about the suspicion"}],
 correct:"B",
 explain:{concept:"Screening for intimate partner violence",
   why:["Screening must occur privately, without the partner present, to protect the client's safety and allow honest disclosure without fear of retaliation."],
   wrong:{C:"Asking with the partner present can endanger the client and prevents honest answers.",A:"Waiting may miss a critical safety window; universal screening in private is standard practice.",D:"Confronting the partner is unsafe and not the nurse's role."},
   quick:"IPV screening = always private, always direct, never with the suspected abuser in the room."}},

{id:"PSY-5",category:"psy",type:"single",subtopic:"Alcohol withdrawal",
 stem:"A client with a history of heavy daily alcohol use was admitted 18 hours ago for an unrelated surgery. The RN should monitor closely for which finding?",
 options:[{k:"A",t:"Bradycardia and hypotension"},{k:"B",t:"Decreased deep tendon reflexes"},{k:"C",t:"Hypoglycemia only"},{k:"D",t:"Tremors, anxiety, and elevated vital signs consistent with early withdrawal"}],
 correct:"D",
 explain:{concept:"Alcohol withdrawal timeline",
   why:["Early alcohol withdrawal symptoms (tremors, anxiety, tachycardia, hypertension) typically begin 6–24 hours after the last drink, matching this client's timeline; seizure risk peaks around 12–48 hours, and delirium tremens can occur 48–96 hours after cessation."],
   wrong:{A:"Withdrawal causes sympathetic overdrive (tachycardia/hypertension), not bradycardia/hypotension.",C:"Hyperglycemia, not hypoglycemia, is more typical during the sympathetic surge of withdrawal.",B:"Withdrawal increases, not decreases, neuromuscular excitability/reflexes."},
   quick:"Alcohol withdrawal timeline: 6–24h tremors/anxiety → 12–48h seizure risk → 48–96h delirium tremens. Use the CIWA-Ar scale and prioritize seizure precautions."}},

{id:"PSY-6",category:"psy",type:"single",subtopic:"Panic attack",
 stem:"A client on the unit suddenly reports chest tightness, shortness of breath, and a feeling of impending doom, with no cardiac findings on prior workup. The RN suspects a panic attack. What is the priority nursing action?",
 options:[{k:"A",t:"Explain in detail why the symptoms are not dangerous"},{k:"B",t:"Immediately administer a PRN sedative without further assessment"},{k:"C",t:"Leave the client alone to calm down independently"},{k:"D",t:"Stay with the client, speak in a calm low voice, and give simple, short directions"}],
 correct:"D",
 explain:{concept:"Therapeutic response to acute anxiety/panic",
   why:["Staying with the client provides safety and reassurance; a calm voice and short, simple directions are easier to process during acute anxiety, when cognitive processing is impaired."],
   wrong:{C:"Leaving an acutely anxious client increases fear and feelings of abandonment.",B:"Medication may be appropriate but only after further assessment (including ruling out cardiac causes if not already done) — presence and calming technique come first.",A:"Detailed, complex explanations are hard to process during peak anxiety; simple, brief communication is more effective."},
   quick:"During acute panic: stay, stay calm, keep language SHORT and SIMPLE — complex reasoning cannot be processed under high anxiety."}},

{id:"PSY-7",category:"psy",type:"single",subtopic:"Communicating with hallucinations",
 stem:"A client with schizophrenia tells the RN, 'The voices are telling me I'm worthless.' What is the RN's best response?",
 options:[{k:"A",t:"'There are no voices, you're imagining things.'"},{k:"B",t:"'That sounds frightening. I don't hear the voices, but I believe they feel real to you.'"},{k:"C",t:"'You need to ignore the voices.'"},{k:"D",t:"'What are the voices saying, in detail?' to gather more information about the content"}],
 correct:"B",
 explain:{concept:"Therapeutic communication with hallucinations",
   why:["The nurse should acknowledge the client's feelings and experience as real to them without validating the hallucination itself as objectively real ('I don't hear...but I believe they feel real to you')."],
   wrong:{A:"Directly denying the experience can feel invalidating and damage trust.",D:"Focusing on the content of hallucinations (especially command hallucinations) without first assessing safety is not the priority response; the emotional/safety focus comes first.",C:"Simply telling the client to 'ignore' the voices is dismissive and unhelpful."},
   quick:"With hallucinations: acknowledge the client's feelings, do NOT reinforce the hallucination as real, and always assess for command hallucinations that could involve self-harm."}},

{id:"PSY-8",category:"psy",type:"single",subtopic:"Suicide risk assessment",
 stem:"A client says, 'I just feel like giving up sometimes.' What is the RN's most important next action?",
 options:[{k:"A",t:"Change the subject to avoid upsetting the client"},{k:"B",t:"Directly ask the client if they are thinking of harming themselves and whether they have a plan"},{k:"C",t:"Document the comment and continue the assessment later"},{k:"D",t:"Reassure the client that things will get better"}],
 correct:"B",
 explain:{concept:"Suicide risk assessment",
   why:["Any statement suggesting hopelessness requires a direct, specific safety assessment — asking about suicidal ideation and a plan does not increase risk and is essential to determine the level of danger and next steps (e.g., removing means, 1:1 observation)."],
   wrong:{A:"Avoiding the topic misses a critical safety assessment opportunity.",C:"Delaying assessment of a possible safety risk is unsafe.",D:"General reassurance without direct assessment fails to determine actual risk."},
   quick:"Asking directly about suicidal thoughts does NOT plant the idea — it is the single most important safety assessment step. Always ask about ideation, plan, and means."}},

{id:"PSY-9",category:"psy",type:"sata",subtopic:"Acute mania interventions — SATA",
 stem:"Which nursing interventions are appropriate for a client experiencing acute mania related to bipolar disorder? Select all that apply.",
 options:[{k:"A",t:"Set firm, consistent limits on behavior"},{k:"B",t:"Monitor closely for physical exhaustion and dehydration"},{k:"C",t:"Ask the client to make several complex financial decisions during this time"},{k:"D",t:"Encourage participation in large, stimulating group activities"},{k:"E",t:"Offer finger foods the client can eat while moving"},{k:"F",t:"Provide a low-stimulation environment"}],
 correct:["A","B","E","F"],
 explain:{concept:"Nursing care during acute mania",
   why:["A low-stimulation environment reduces escalation; finger foods accommodate an inability to sit still; firm limits provide safety and structure; monitoring for exhaustion/dehydration addresses the physical risks of prolonged hyperactivity."],
   wrong:{D:"Large, stimulating activities can worsen agitation and escalate manic behavior.",C:"Clients in acute mania have impaired judgment; major decisions should be postponed, not encouraged, during this period."},
   quick:"Acute mania care = LOW stimulation + firm limits + easy portable nutrition + protect from poor-judgment decisions and physical exhaustion."}},

{id:"PSY-10",category:"psy",type:"single",subtopic:"Cultural competence",
 stem:"A client from a culture that values family-centered decision-making asks that all treatment decisions be discussed with their eldest son rather than directly with them. What is the RN's most appropriate response?",
 options:[{k:"A",t:"Respect the client's wishes and involve the son in discussions as requested, while still confirming the client's own consent"},{k:"B",t:"Insist on speaking directly with the client only, per standard hospital policy"},{k:"C",t:"Avoid the topic entirely to prevent conflict"},{k:"D",t:"Tell the client this practice is not allowed in the hospital"}],
 correct:"A",
 explain:{concept:"Cultural competence / patient-centered care",
   why:["Respecting culturally-based preferences for family involvement in decision-making, while still ensuring the client's own informed consent is documented, honors both autonomy and cultural values."],
   wrong:{B:"Rigidly enforcing a Western individualistic model disregards the client's cultural values.",D:"This response is dismissive and not client-centered.",C:"Avoiding the topic fails to address the client's expressed preference."},
